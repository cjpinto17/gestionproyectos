# Publica automaticamente en Google Apps Script todo lo que se suba a la rama.
#
# Requiere estos secretos del repositorio (Settings > Secrets and variables > Actions):
#   CLASP_CREDENTIALS  Contenido del archivo .clasprc.json que genera "clasp login"
#   SCRIPT_ID          ID del proyecto de Apps Script
#   DEPLOYMENT_ID      (opcional) ID de la implementacion web, para actualizarla
#
# El paso a paso para obtenerlos esta en docs/IMPLEMENTACION.md

name: Desplegar en Google Apps Script

on:
  push:
    branches:
      - main
      - claude/project-management-system-w58l3v
    paths:
      - 'apps-script/**'
      - '.github/workflows/desplegar-apps-script.yml'
  workflow_dispatch:

jobs:
  desplegar:
    runs-on: ubuntu-24.04

    # Los secretos se exponen como variables de entorno del job: GitHub no
    # permite leer el contexto "secrets" dentro de una condicion "if".
    env:
      CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
      SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
      DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v5

      - name: Revisar los secretos
        run: |
          error=0

          if [ -z "$CLASP_CREDENTIALS" ]; then
            echo "FALTA el secreto CLASP_CREDENTIALS."
            error=1
          fi
          if [ -z "$SCRIPT_ID" ]; then
            echo "FALTA el secreto SCRIPT_ID."
            error=1
          else
            case "$SCRIPT_ID" in
              *script.google.com*|*/*)
                echo "SCRIPT_ID parece ser una direccion web completa."
                echo "Debe ser solo el identificador, sin https:// ni barras."
                echo "Lo encuentra en el editor de Apps Script:"
                echo "  engranaje Configuracion del proyecto > ID de la secuencia de comandos."
                error=1 ;;
              *" "*)
                echo "SCRIPT_ID trae espacios. Vuelva a copiarlo sin espacios al inicio o al final."
                error=1 ;;
            esac
          fi

          if [ "$error" -ne 0 ]; then
            echo "---"
            echo "Configure los secretos en Settings > Secrets and variables > Actions."
            echo "El procedimiento esta en docs/IMPLEMENTACION.md, parte 2, camino A."
            exit 1
          fi
          echo "Secretos presentes y con formato valido."

      - name: Preparar Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Instalar clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Autenticar con Google
        run: |
          printf '%s' "$CLASP_CREDENTIALS" > ~/.clasprc.json
          node .github/scripts/normalizar-credencial.js

      - name: Apuntar al proyecto de Apps Script
        run: |
          printf '{\n  "scriptId": "%s",\n  "rootDir": "apps-script",\n  "fileExtension": "gs"\n}\n' \
            "$SCRIPT_ID" > .clasp.json
          echo "Archivos que se van a publicar:"
          ls -1 apps-script

      - name: Sellar la version con la fecha del despliegue
        run: |
          # El pie de pagina muestra cuando se publico de verdad. Si esto se
          # dejara a mano, tarde o temprano mostraria una fecha falsa.
          numero=$(grep -o "numero: '[^']*'" apps-script/Version.gs | head -1 | cut -d"'" -f2)
          publicada=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > apps-script/Version.gs <<EOF
          /**
           * Version.gs — generado por el flujo de despliegue. No editar a mano:
           * el proximo despliegue lo reescribe. El numero de version se cura en
           * el repositorio, en la copia versionada de este archivo.
           */
          var VERSION_APP = {
            numero: '${numero}',
            publicada: '${publicada}',
            commit: '${{ github.sha }}'
          };

          function getVersionApp_() {
            return {
              numero: VERSION_APP.numero,
              publicada: VERSION_APP.publicada,
              commit: VERSION_APP.commit,
              autor: CONFIG.APP_AUTOR
            };
          }
          EOF
          echo "Sellado: version ${numero}, publicada ${publicada}"

      - name: Subir los archivos
        run: |
          set +e
          salida=$(clasp push --force 2>&1)
          codigo=$?
          echo "$salida"
          if [ "$codigo" -eq 0 ]; then exit 0; fi

          echo "=================================================="
          echo "NO SE PUDO PUBLICAR. Causa probable:"
          case "$salida" in
            *"Apps Script API"*|*"not enabled"*|*"SERVICE_DISABLED"*)
              echo "La API de Apps Script esta desactivada en su cuenta de Google."
              echo "Solucion: entre a https://script.google.com/home/usersettings"
              echo "y active el interruptor 'API de Google Apps Script'."
              echo "Espere un minuto y vuelva a ejecutar este flujo." ;;
            *"access_token"*|*"Error retrieving access token"*)
              echo "La credencial quedo en un formato que esta version de clasp no entiende."
              echo "Solucion: en Cloud Shell ejecute"
              echo "  npm install -g @google/clasp@2.4.2"
              echo "  clasp login      (y repita el procedimiento del curl)"
              echo "  cat ~/.clasprc.json"
              echo "y actualice el secreto CLASP_CREDENTIALS con el resultado." ;;
            *"invalid_grant"*|*"Invalid Credentials"*|*"401"*|*"unauthorized"*)
              echo "La credencial caduco o fue revocada."
              echo "Solucion: repita el paso A.2 de docs/IMPLEMENTACION.md"
              echo "y actualice el secreto CLASP_CREDENTIALS." ;;
            *"Script ID"*|*"not found"*|*"404"*|*"Requested entity was not found"*)
              echo "El SCRIPT_ID no corresponde a ningun proyecto, o la cuenta con la"
              echo "que se autorizo clasp no tiene acceso a ese proyecto."
              echo "Verifique que ambos sean la misma cuenta corporativa." ;;
            *"403"*|*"permission"*|*"PERMISSION_DENIED"*)
              echo "La cuenta no tiene permiso sobre ese proyecto de Apps Script,"
              echo "o una politica de la organizacion bloquea el acceso por API." ;;
            *)
              echo "Revise el mensaje de arriba: es la respuesta textual de Google." ;;
          esac
          echo "=================================================="
          exit "$codigo"

      - name: Actualizar la aplicacion publicada
        if: env.DEPLOYMENT_ID != ''
        run: |
          clasp deploy \
            --deploymentId "$DEPLOYMENT_ID" \
            --description "Despliegue automatico ${{ github.sha }}"

      - name: Resumen
        run: |
          echo "Codigo publicado en Apps Script desde el commit ${{ github.sha }}"
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "Nota: no hay DEPLOYMENT_ID configurado, asi que la aplicacion que usa"
            echo "el equipo sigue en la version anterior hasta publicarla con el boton"
            echo "Implementar del editor."
          fi
