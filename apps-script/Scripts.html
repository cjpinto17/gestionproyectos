/* ================= Costos ================= */
/**
 * Cuanto costo la fabrica y a donde se fue (D-110).
 *
 * La plata se presenta en pesos redondos y sin decimales: un reparto
 * proporcional da centavos que nadie puede verificar y que solo ensucian la
 * lectura. Lo que se compara entre meses no es el total —depende de cuantas
 * actividades hubo— sino el COSTO POR DIA de capacidad, que va al lado.
 */
function cargarCostos(forzar) {
  // Un mes a la vez: el costo de la fabrica es una cuenta mensual, y mezclar
  // meses en un total escondia que cada mes se paga completo.
  var mes = $('fCostoMes').value;
  if (!forzar && DATOS.costos && DATOS.costosClave === mes) {
    pintarCostos(DATOS.costos); return;
  }
  cargando('kpisCostos', 'kpis');
  api('getCostos', mes, mes, !!forzar).then(function (r) {
    DATOS.costos = r;
    DATOS.costosClave = mes;
    if (!$('fCostoMes').value && r.desde) $('fCostoMes').value = r.desde;
    pintarCostos(r);
  }).catch(function (e) {
    // Un aviso que se desvanece deja la pagina con el esqueleto puesto y a quien
    // la mira sin saber si esta cargando o si fallo. El motivo se queda escrito.
    fallo(e);
    $('kpisCostos').innerHTML = '';
    $('notaCostos').innerHTML = '<b style="color:var(--rojo)">No se pudo calcular:</b> ' +
        esc(e && e.message ? e.message : String(e));
  });
}
// Calcular relee las hojas: es el boton al que acude quien acaba de corregir
// algo a mano en el Sheets y no ve el cambio.
$('btnCostos').addEventListener('click', function () {
  DATOS.costos = null;
  cargarCostos(true);
});
// Cambiar el mes recalcula, sin tener que acordarse del boton.
$('fCostoMes').addEventListener('change', function () {
  DATOS.costos = null;
  cargarCostos();
});

/** Pesos colombianos, sin decimales: $1.234.567 */
function pesos(n) {
  if (n === null || n === undefined) return '—';
  var entero = Math.round(Number(n) || 0);
  var signo = entero < 0 ? '-' : '';
  return signo + '$' + String(Math.abs(entero)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

/** Lo mismo, en millones, para las cifras grandes de las tarjetas. */
function millones(n) {
  var m = (Number(n) || 0) / 1000000;
  return (Math.round(m * 10) / 10).toString().replace('.', ',');
}

function pintarCostos(r) {
  // El servidor puede devolver vacio —un calculo que no cupo en la respuesta, una
  // sesion que se cayo a mitad—. Sin esta guarda, la pagina se caia pintando y el
  // mensaje que veia la persona era un error de javascript, no lo que paso.
  if (!r) {
    $('kpisCostos').innerHTML = '';
    $('notaCostos').innerHTML = '<b style="color:var(--rojo)">El servidor no devolvió ' +
        'el cálculo.</b> Vuelva a oprimir <b>Calcular</b>; si se repite, avise, ' +
        'porque significa que la respuesta no alcanzó a llegar completa.';
    return;
  }
  if (r.sinTarifas) {
    $('kpisCostos').innerHTML = '';
    $('notaCostos').innerHTML = '<b>' + esc(r.mensaje) + '</b>';
    ['tablaCostoIni', 'graficoCostoTipo', 'tablaCostoEtapa', 'graficoCostoMes',
     'tablaBolsas', 'tablaCostoActividades'].forEach(function (id) { $(id).innerHTML = ''; });
    return;
  }

  var t = r.total;
  $('subCostos').textContent = etiquetaMes(r.desde) +
      ' · valores en pesos, sin IVA · las fechas salen de las columnas de cada solicitud';

  $('kpisCostos').innerHTML = [
    kpi('Costo del mes', millones(t.contrato), ' M',
        pesos(t.contrato) + ' facturados por la fábrica'),
    kpi('Repartido', millones(t.atribuido), ' M',
        formatoPorcentaje(t.pctAtribuido) + ' del total, entre ' + t.actividades + ' actividades'),
    kpi('Sin atribuir', millones(t.noAtribuido), ' M',
        'Capacidad pagada que, según las fechas registradas, nadie ocupó',
        t.noAtribuido > t.contrato * 0.25 ? 'mal' : ''),
    kpi('Costo promedio', t.actividades ? millones(t.atribuido / t.actividades) : null, ' M',
        'Por actividad que ocupó la fábrica')
  ].join('');

  // Las bolsas dedicadas a una iniciativa que no existe: el reparto de esa plata
  // no esta llegando a ningun lado y hay que decirlo arriba, no esconderlo.
  var huerfanas = r.bolsas.filter(function (b) { return b.sinIniciativa; });
  $('notaCostos').innerHTML = huerfanas.length
      ? '<b style="color:var(--rojo)">' + huerfanas.length + ' bolsa' +
        (huerfanas.length === 1 ? '' : 's') + ' dedicada' + (huerfanas.length === 1 ? '' : 's') +
        ' apunta' + (huerfanas.length === 1 ? '' : 'n') + ' a una iniciativa que no existe:</b> ' +
        huerfanas.map(function (b) { return esc(b.concepto); }).join(', ') +
        '. Corríjalo en Administración → Costos de la fábrica.'
      : '';

  /* --- por iniciativa --- */
  $('tablaCostoIni').innerHTML = r.porIniciativa.length
      ? '<div class="tabla-scroll"><table class="tabla-compacta"><thead><tr>' +
        '<th>Iniciativa</th><th class="num">Análisis</th><th class="num">Desarrollo</th>' +
        // El porcentaje es sobre TODO lo facturado en el periodo, no sobre lo
        // repartido: la columna no suma 100% y eso es a proposito —lo que falta
        // es la capacidad que nadie ocupo, y esconderlo seria perder el dato.
        '<th class="num">Pruebas</th><th class="num">Total</th>' +
        '<th class="num">% del período</th>' +
        '</tr></thead><tbody>' +
        r.porIniciativa.map(function (i) {
          return '<tr><td>' + esc(i.nombre) +
            '<div style="color:var(--ink-faint);font-size:11px">' + i.actividades +
            (i.actividades === 1 ? ' actividad' : ' actividades') + '</div></td>' +
            '<td class="num">' + pesos(i.porEtapa['ETA-ANA'] || 0) + '</td>' +
            '<td class="num">' + pesos(i.porEtapa['ETA-DEV'] || 0) + '</td>' +
            '<td class="num">' + pesos(i.porEtapa['ETA-QA'] || 0) + '</td>' +
            '<td class="num" style="font-weight:700">' + pesos(i.costo) + '</td>' +
            '<td class="num">' + (i.pct === null ? '—' : formatoPorcentaje(i.pct)) + '</td></tr>';
        }).join('') +
        // El total: sin el, cada quien suma la columna a mano para saber si
        // cuadra con lo repartido de arriba.
        '<tr class="cst-total"><td>Total</td>' +
        r.porEtapa.map(function (e) {
          return '<td class="num">' + pesos(r.porIniciativa.reduce(function (a, i) {
            return a + (i.porEtapa[e.etapa] || 0);
          }, 0)) + '</td>';
        }).join('') +
        '<td class="num">' + pesos(r.total.atribuido) + '</td>' +
        '<td class="num">' + formatoPorcentaje(r.total.pctAtribuido) + '</td></tr>' +
        '</tbody></table></div>'
      : '<p style="color:var(--ink-muted);font-size:13px">Ninguna actividad ocupó la fábrica ' +
        'en este período.</p>';

  /* --- por tipo: construir contra corregir --- */
  var maxTipo = r.porTipo.length ? r.porTipo[0].costo : 0;
  $('graficoCostoTipo').innerHTML = r.porTipo.length
      ? r.porTipo.map(function (x) {
          return barra(x.nombre, x.costo, maxTipo, millones(x.costo) + ' M',
                       CLASE_TIPO[x.tipo] === 'tipo-estab' ? 'rojo' : '');
        }).join('') +
        '<p class="nota" style="margin-top:10px">Lo que aparece como <b>Ajuste</b> y ' +
        '<b>Estabilización</b> es lo que costó sostener y corregir, no construir.</p>'
      : '<p style="color:var(--ink-muted);font-size:13px">Sin datos en el período.</p>';

  /* --- por etapa --- */
  $('tablaCostoEtapa').innerHTML =
    '<div class="tabla-scroll"><table class="tabla-compacta"><thead><tr><th>Etapa</th>' +
    '<th class="num">Costo</th>' +
    '<th class="num">Días de capacidad</th><th class="num">Costo por día</th>' +
    '</tr></thead><tbody>' +
    r.porEtapa.map(function (e) {
      return '<tr><td>' + esc(e.nombre) + '</td>' +
        '<td class="num">' + pesos(e.costo) + '</td>' +
        '<td class="num">' + e.dias + '</td>' +
        '<td class="num">' + pesos(e.costoPorDia) + '</td></tr>';
    }).join('') +
    (function () {
      var dias = r.porEtapa.reduce(function (a, e) { return a + e.dias; }, 0);
      // El costo por dia del total es la division de los totales, NO el promedio
      // de los tres: promediar tres etapas con volumenes distintos da un numero
      // que no corresponde a ninguna plata real.
      return '<tr class="cst-total"><td>Total</td>' +
        '<td class="num">' + pesos(r.total.atribuido) + '</td>' +
        '<td class="num">' + (Math.round(dias * 10) / 10).toString().replace('.', ',') + '</td>' +
        '<td class="num">' + (dias ? pesos(r.total.atribuido / dias) : '—') + '</td></tr>';
    })() + '</tbody></table></div>';

  /* --- las bolsas --- */
  // Resumida: con un solo mes sobran la vigencia y el conteo de meses, y lo que
  // importa de cada bolsa es cuanto costo y cuanto de eso no encontro donde ir.
  $('tablaBolsas').innerHTML =
    '<div class="tabla-scroll"><table class="tabla-compacta"><thead><tr><th>Concepto</th>' +
    '<th>Dedicada a</th><th class="num">Facturado</th>' +
    '<th class="num">Sin atribuir</th></tr></thead><tbody>' +
    r.bolsas.filter(function (b) { return b.meses > 0; }).map(function (b) {
      // Una bolsa que no estuvo vigente todo el mes factura menos que su valor
      // mensual. Sin decirlo, la cifra parece un error de calculo (D-126).
      var parcial = b.parcial
        ? '<div style="color:var(--alerta);font-size:11px">vigente ' + b.habiles +
          ' de ' + b.habilesPosibles + ' días hábiles · mensual ' + pesos(b.mensual) + '</div>'
        : '';
      return '<tr><td>' + esc(b.concepto) +
        '<div style="color:var(--ink-faint);font-size:11px">' + esc(b.etapaNombre) + '</div>' +
        parcial + '</td>' +
        '<td>' + (b.dedicada
          ? (b.sinIniciativa
              ? '<span style="color:var(--rojo)">' + esc(b.dedicada) + ' (no existe)</span>'
              : esc(b.dedicadaNombre))
          : '<span style="color:var(--ink-faint)">todas</span>') + '</td>' +
        '<td class="num">' + pesos(b.total) + '</td>' +
        '<td class="num"' + (b.noAtribuido ? ' style="color:var(--alerta);font-weight:700"' : '') +
        '>' + pesos(b.noAtribuido) + '</td></tr>';
    }).join('') +
    '<tr class="cst-total"><td colspan="2">Total</td>' +
    '<td class="num">' + pesos(r.total.contrato) + '</td>' +
    '<td class="num">' + pesos(r.total.noAtribuido) + '</td></tr>' +
    '</tbody></table></div>';

  /* --- actividades: el detalle que alguien va a sumar con la calculadora --- */
  pintarDetalleCostos(r);
  pintarFaltaInfoCostos(r);
}

/**
 * El detalle, agrupado por iniciativa y plegable (D-113, D-114).
 *
 * La iniciativa es un renglon de grupo que YA TRAE su subtotal: ponerlo en una
 * fila aparte al final obligaba a buscarlo, y con los grupos cerrados no se
 * veria. Cada etapa muestra en una sola celda los dias, lo que costo y —debajo—
 * las fechas de las que salio, que es lo que permite verificarlo.
 */
var COSTO_ABIERTAS = {};
/** Lo que falta por diligenciar, por solicitud, para el formulario rapido. */
var FALTA_COSTOS = {};

function pintarDetalleCostos(r) {
  if (!r.actividades.length) {
    $('tablaCostoActividades').innerHTML =
        '<p style="color:var(--ink-muted);font-size:13px">Ninguna actividad tiene fechas ' +
        'registradas en este mes, así que no hay nada que repartir.</p>';
    return;
  }

  var grupos = {};
  r.actividades.forEach(function (a) {
    (grupos[a.idProyecto] = grupos[a.idProyecto] ||
        { nombre: a.iniciativa, filas: [], costo: 0 });
    grupos[a.idProyecto].filas.push(a);
    grupos[a.idProyecto].costo += a.costo;
  });
  var orden = Object.keys(grupos).sort(function (a, b) {
    return grupos[b].costo - grupos[a].costo;
  });

  var etapas = r.porEtapa;
  var dia = function (n) { return (Math.round(n * 10) / 10).toString().replace('.', ','); };

  /** Una celda de etapa: dias, plata y las fechas de donde salen. */
  function celda(dias, costo, rango) {
    if (!dias && !costo) {
      return '<td class="cst-etapa cst-nada">—</td>';
    }
    var fechas = rango
        ? fecha(rango.desde) + ' → ' + (rango.abierta
            ? '<i>sin cerrar</i>'
            : fecha(rango.hasta))
        : '<i>sin fechas</i>';
    return '<td class="cst-etapa"><b>' + pesos(costo) + '</b>' +
           '<div class="cst-dias">' + dia(dias) + (dias === 1 ? ' día' : ' días') + '</div>' +
           '<div class="cst-fechas">' + fechas + '</div></td>';
  }

  var cab = '<tr><th>Actividad</th><th>Tipo</th>' +
      etapas.map(function (e) {
        return '<th class="num" style="text-align:right">' + esc(e.nombre) + '</th>';
      }).join('') +
      '<th class="num" style="text-align:right">Total</th></tr>';

  var cuerpo = orden.map(function (k) {
    var g = grupos[k];
    var filas = g.filas.sort(function (a, b) { return b.costo - a.costo; });
    // Cerradas por omision: la tabla abre mostrando los subtotales por
    // iniciativa, que es la lectura de arriba, y quien quiera el detalle de una
    // la despliega. Con todo abierto habia que recorrer cientos de filas para
    // llegar al siguiente grupo.
    var abierta = COSTO_ABIERTAS[k] === true;
    var subDias = {}, subCosto = {};
    filas.forEach(function (a) {
      etapas.forEach(function (e) {
        subDias[e.etapa] = (subDias[e.etapa] || 0) + (a.diasPorEtapa[e.etapa] || 0);
        subCosto[e.etapa] = (subCosto[e.etapa] || 0) + (a.porEtapa[e.etapa] || 0);
      });
    });

    // El grupo trae su subtotal en la misma linea: se lee cerrado o abierto.
    var cabGrupo = '<tr class="cst-grupo' + (abierta ? ' abierta' : '') +
        '" data-ini="' + esc(k) + '">' +
      '<td colspan="2"><span class="cst-flecha">▸</span> ' + esc(g.nombre) +
        ' <span class="cst-cuenta">' + filas.length +
        (filas.length === 1 ? ' actividad' : ' actividades') + '</span></td>' +
      etapas.map(function (e) {
        return '<td class="num">' + (subCosto[e.etapa] ? pesos(subCosto[e.etapa]) : '—') +
               '<div class="cst-dias">' + dia(subDias[e.etapa] || 0) + ' d</div></td>';
      }).join('') +
      '<td class="num">' + pesos(g.costo) + '</td></tr>';

    return cabGrupo + filas.map(function (a) {
        return '<tr class="cst-fila" data-de="' + esc(k) + '"' +
          (abierta ? '' : ' hidden') + '>' +
          '<td><b>' + esc(a.id) + '</b> · ' + esc(a.nombre) + '</td>' +
          '<td><span class="rm-tipo ' + (CLASE_TIPO[a.tipo] || '') + '">' +
            esc(a.tipoNombre) + '</span></td>' +
          etapas.map(function (e) {
            return celda(a.diasPorEtapa[e.etapa] || 0, a.porEtapa[e.etapa] || 0,
                         a.rangos[e.etapa]);
          }).join('') +
          '<td class="num" style="font-weight:700">' + pesos(a.costo) + '</td></tr>';
      }).join('');
  }).join('');

  var total = '<tr class="cst-total"><td colspan="2">TOTAL REPARTIDO</td>' +
      etapas.map(function (e) {
        return '<td class="num">' + pesos(e.costo) +
               '<div class="cst-dias">' + dia(e.dias) + ' d</div></td>';
      }).join('') +
      '<td class="num">' + pesos(r.total.atribuido) + '</td></tr>';

  $('tablaCostoActividades').innerHTML =
      '<div class="cst-caja"><table class="tabla-compacta cst-detalle"><thead>' + cab +
      '</thead><tbody>' + cuerpo + total + '</tbody></table></div>';
}

/* Plegar y desplegar una iniciativa. El estado se recuerda mientras dure la
   sesion: repintar por cambiar de mes no vuelve a abrir lo que se cerro. */
$('tablaCostoActividades').addEventListener('click', function (e) {
  var cab = e.target.closest('.cst-grupo');
  if (!cab) return;
  var id = cab.dataset.ini;
  var abrir = !cab.classList.contains('abierta');
  COSTO_ABIERTAS[id] = abrir;
  cab.classList.toggle('abierta', abrir);
  Array.prototype.forEach.call(
    $('tablaCostoActividades').querySelectorAll('.cst-fila[data-de="' + id + '"]'),
    function (f) { f.hidden = !abrir; });
});

/**
 * Lo que al equipo le falta por diligenciar (D-114).
 *
 * Va arriba y no escondido abajo porque es la explicacion de la plata sin
 * atribuir: mientras esas fechas no esten, esa capacidad no tiene a quien
 * cargarse. Es una lista de trabajo, no un reproche.
 */
function pintarFaltaInfoCostos(r) {
  var f = r.incompletas || [];
  FALTA_COSTOS = {};
  var marcadas = r.fasesNoAplican || 0;
  var notaMarcadas = marcadas
      ? ' Hay <b>' + marcadas + '</b> fase' + (marcadas === 1 ? '' : 's') +
        ' marcada' + (marcadas === 1 ? '' : 's') + ' como <i>no aplica</i>, que no se piden ' +
        'ni cuestan. <a href="#" id="verMarcadas">Ver cuáles</a>.'
      : '';

  /* La lista de lo marcado. Una marca puesta sin querer saca la solicitud del
     costeo en silencio, y sin poder verla no hay como encontrarla. */
  function bloqueMarcadas() {
    var m = r.noAplicaDetalle || [];
    if (!m.length) return '';
    return '<div id="listaMarcadas" hidden style="margin-top:10px"><div class="tabla-scroll">' +
      '<table class="tabla-compacta"><thead><tr><th>Actividad</th><th>Fase</th>' +
      '<th>Columna</th></tr></thead><tbody>' +
      m.map(function (x) {
        return '<tr><td><b>' + esc(x.id) + '</b> · ' + esc(x.nombre) + '</td>' +
          '<td>' + esc(x.rango) + '</td>' +
          '<td><code>' + esc(x.campoNo) + '</code></td></tr>';
      }).join('') + '</tbody></table></div></div>';
  }
  function cablearVerMarcadas() {
    var a = $('verMarcadas');
    if (!a) return;
    a.addEventListener('click', function (e) {
      e.preventDefault();
      var l = $('listaMarcadas');
      if (!l) return;
      l.hidden = !l.hidden;
      a.textContent = l.hidden ? 'Ver cuáles' : 'Ocultar';
    });
  }

  // Si las columnas de la hoja estan mal, ninguna marca va a servir y hay que
  // decirlo antes que nada: es la causa, no un detalle.
  var rev = r.revisionColumnas || { sinColumna: [], duplicadas: [] };
  var aviso = '';
  if (rev.sinColumna && rev.sinColumna.length) {
    aviso = '<div class="panel cst-falta" style="border-color:var(--rojo)">' +
      '<h3 style="color:var(--rojo)">La hoja no tiene las columnas de «no aplica»</h3>' +
      '<div class="sub">Faltan en <b>Solicitudes</b>: <code>' +
      rev.sinColumna.map(esc).join('</code>, <code>') + '</code>. ' +
      'Mientras no existan, marcar una fase no se guarda en ninguna parte. ' +
      'Ejecute <b>actualizarEstructura</b> en el editor de Apps Script y vuelva a entrar.' +
      '</div></div>';
  } else if (rev.duplicadas && rev.duplicadas.length) {
    aviso = '<div class="panel cst-falta" style="border-color:var(--rojo)">' +
      '<h3 style="color:var(--rojo)">Hay columnas repetidas en la hoja</h3>' +
      '<div class="sub">En <b>Solicitudes</b> aparecen dos veces: <code>' +
      rev.duplicadas.map(esc).join('</code>, <code>') + '</code>. ' +
      'El programa lee la última, así que lo que usted escriba en la primera no ' +
      'se ve. Borre la columna sobrante en la hoja.' +
      '</div></div>';
  }

  if (!f.length) {
    // Sin pendientes, pero si hay marcas conviene decirlo: es la confirmacion
    // de que quedaron guardadas.
    $('faltaInfoCostos').innerHTML = aviso + (marcadas
        ? '<p class="nota" style="margin-top:0">Ninguna actividad tiene fechas pendientes.' +
          notaMarcadas + '</p>' + bloqueMarcadas()
        : '');
    cablearVerMarcadas();
    return;
  }

  f.forEach(function (x) {
    (FALTA_COSTOS[x.id] = FALTA_COSTOS[x.id] || { nombre: x.nombre, faltan: [] })
      .faltan.push(x);
  });
  var ids = Object.keys(FALTA_COSTOS);
  var puedeEditar = permiso('Editar_Solicitud');
  var total = r.incompletasTotal || f.length;
  var recortada = total > f.length
      ? ' Se muestran ' + f.length + ' de <b>' + total + '</b> pendientes.'
      : '';

  $('faltaInfoCostos').innerHTML = aviso +
    '<div class="panel cst-falta"><div class="fila">' +
      '<div><h3>' + ids.length + (ids.length === 1
        ? ' actividad sin fechas registradas' : ' actividades sin fechas registradas') + '</h3>' +
      '<div class="sub">El costo se reparte entre las que tienen fechas. Mientras estas ' +
      'estén vacías no cargan nada, y su parte de la capacidad queda <b>sin atribuir</b>.' +
      (puedeEditar ? ' Se llenan aquí mismo.' : ' Se llenan editando la solicitud.') +
      notaMarcadas + recortada +
      ' Si corrigió algo directamente en la hoja, oprima <b>Calcular</b>: ese botón relee.' +
      '</div></div>' +
      '<button class="btn-sec ml-auto" id="btnVerFalta">Ver cuáles</button>' +
    '</div><div id="listaFalta" hidden><div class="tabla-scroll">' +
      '<table class="tabla-compacta"><thead><tr><th>Actividad</th><th>Etapa</th>' +
      '<th>Qué falta</th>' + (puedeEditar ? '<th></th>' : '<th>Columna</th>') +
      '</tr></thead><tbody>' +
      ids.map(function (id) {
        var g = FALTA_COSTOS[id];
        return g.faltan.map(function (x, i) {
          return '<tr><td>' + (i === 0
              ? '<b>' + esc(id) + '</b> · ' + esc(g.nombre) : '') + '</td>' +
            '<td>' + esc(x.rango) + '</td>' +
            '<td>' + esc(x.falta) +
              '<div style="color:var(--ink-faint);font-size:10.5px">' +
              esc(x.campoNo) + ' dice: <b>' +
              (x.valorMarca ? esc(x.valorMarca) : 'vacío') + '</b></div></td>' +
            '<td>' + (i === 0
              ? (puedeEditar
                  ? '<button class="btn-sec cst-llenar" data-id="' + esc(id) +
                    '" style="padding:4px 10px;font-size:11.5px">Llenar fechas</button>'
                  : '<code>' + esc(x.campo) + '</code>')
              : (puedeEditar ? '' : '<code>' + esc(x.campo) + '</code>')) + '</td></tr>';
        }).join('');
      }).join('') + '</tbody></table></div></div>' + bloqueMarcadas() + '</div>';

  cablearVerMarcadas();
  $('btnVerFalta').addEventListener('click', function () {
    var l = $('listaFalta');
    l.hidden = !l.hidden;
    this.textContent = l.hidden ? 'Ver cuáles' : 'Ocultar';
  });

  Array.prototype.forEach.call($('faltaInfoCostos').querySelectorAll('.cst-llenar'),
    function (b) {
      b.addEventListener('click', function () { formularioFechasEtapa(b.dataset.id); });
    });
}

/**
 * Llenar las fechas que faltan sin salir de la pagina (D-115).
 *
 * Se piden las DOS fechas del rango, no solo la que falta: quien tiene el dato
 * de una suele tener el de la otra, y abrir el formulario para escribir un solo
 * campo y volver a abrirlo para el otro no ahorra nada. Las que ya estaban
 * vienen llenas y se pueden corregir.
 */
function formularioFechasEtapa(idSolicitud) {
  var g = FALTA_COSTOS[idSolicitud];
  if (!g) return;

  // Un rango puede aparecer dos veces (le falta inicio Y fin): se muestra uno.
  var rangos = [], vistos = {};
  g.faltan.forEach(function (x) {
    var clave = x.campoIni + '|' + x.campoFin;
    if (vistos[clave]) return;
    vistos[clave] = true;
    rangos.push(x);
  });

  var columnas = [], valores = {};
  rangos.forEach(function (x) {
    columnas.push({ campo: x.campoIni, etiqueta: x.rango + ' · inicio', tipo: 'date' });
    columnas.push({ campo: x.campoFin, etiqueta: x.rango + ' · fin', tipo: 'date' });
    // La salida para la etapa por la que esta solicitud no pasa.
    columnas.push({ campo: x.campoNo, etiqueta: x.rango + ' · ¿no aplica?', tipo: 'boolSN',
                    ayuda: 'SI si esta solicitud no pasa por esa fase. Deja de pedirse ' +
                           'y no entra en el costo.' });
    valores[x.campoIni] = x.valorIni;
    valores[x.campoFin] = x.valorFin;
    valores[x.campoNo] = 'NO';
  });

  abrirModal('Fechas de la etapa', idSolicitud + ' · ' + g.nombre,
    '<div class="formulario">' +
      '<p class="nota" style="margin:0">Estas son las fechas con las que se reparte el costo: ' +
      'los días hábiles entre el inicio y el fin de cada etapa. Si la actividad ' +
      '<b>sigue en curso</b>, deje el fin vacío y se contará hasta hoy. Si no pasa por esa ' +
      'fase, marque <b>no aplica</b> y deja de pedirse.</p>' +
      construirCampos(columnas, {}, valores, null) + '</div>',
    function () {
      return api('registrarFechasEtapa', idSolicitud, leerCampos(columnas))
        .then(function () {
          toast('Fechas de ' + idSolicitud + ' registradas.');
          invalidarCacheCliente();
          DATOS.costos = null;
          cargarCostos();
        });
    });
}

/** Arma el archivo de auditoria y entrega el enlace. */
function descargarAuditoriaCostos() {
  var b = $('btnCostoDetalle');
  b.disabled = true;
  $('avisoDetalle').innerHTML = 'Armando el archivo. Puede tardar un momento…';
  api('getCostosDetalle', $('fCostoMes').value, $('fCostoMes').value)
    .then(function (d) {
      $('avisoDetalle').innerHTML =
          '<b>Listo:</b> <a href="' + esc(d.url) + '" target="_blank" rel="noopener">' +
          esc(d.nombre) + '</a> · ' + d.actividades + ' actividades, ' + d.filas +
          ' líneas de reparto, ' + d.incompletas + ' pendientes por diligenciar. ' +
          'Queda en su Drive; desde ahí se descarga como Excel con ' +
          '<i>Archivo → Descargar → Microsoft Excel</i>.';
    })
    .catch(function (e) {
      fallo(e);
      $('avisoDetalle').innerHTML = '<b style="color:var(--rojo)">No se pudo generar:</b> ' +
          esc(e && e.message ? e.message : String(e));
    })
    .then(function () { b.disabled = false; });
}
$('btnCostoDetalle').addEventListener('click', descargarAuditoriaCostos);

/* ================= Facturacion por fabrica ================= */
/**
 * El documento de pago de cada fabrica de software, listo para imprimir.
 *
 * Una hoja por fabrica, con sus bolsas y su total arriba y el desglose por
 * solicitud debajo como anexo. Al imprimir, cada fabrica arranca en una pagina
 * nueva: la factura de una no debe terminar en la misma hoja que la de otra,
 * porque son dos documentos que van a dos proveedores distintos.
 *
 * El monto a facturar es lo ATRIBUIDO a solicitudes, por decision del usuario.
 * La linea de conciliacion —lo contratado y la diferencia— va FUERA del total y
 * marcada como tal: quien autoriza el pago tiene que poder ver que esta pagando
 * menos que el contrato, y la fabrica lo va a notar (D-132).
 */
function abrirFacturacion() {
  var mes = $('fCostoMes').value;
  if (!mes) { toast('Escoja primero el mes que va a facturar.'); return; }
  var b = $('btnFacturar');
  b.disabled = true;
  var antes = b.textContent;
  b.textContent = 'Armando…';
  api('getFacturacion', mes).then(function (f) {
    pintarFacturacion(f);
    $('veloFactura').hidden = false;
    document.body.classList.add('con-factura');
  }).catch(function (e) {
    fallo(e);
    $('avisoDetalle').innerHTML = '<b style="color:var(--rojo)">No se pudo armar la ' +
        'facturación:</b> ' + esc(e && e.message ? e.message : String(e));
  }).then(function () { b.disabled = false; b.textContent = antes; });
}
$('btnFacturar').addEventListener('click', abrirFacturacion);

function cerrarFacturacion() {
  $('veloFactura').hidden = true;
  document.body.classList.remove('con-factura');
}
$('btnFacCerrar').addEventListener('click', cerrarFacturacion);
$('btnFacImprimir').addEventListener('click', function () { window.print(); });
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && !$('veloFactura').hidden) cerrarFacturacion();
});

function pintarFacturacion(f) {
  $('facTitulo').textContent = 'Facturación por fábrica · ' + etiquetaMes(f.mes);

  if (f.sinTarifas) {
    $('facHojas').innerHTML = '<div class="fac-hoja"><p class="nota"><b>' +
        esc(f.mensaje) + '</b></p></div>';
    return;
  }
  if (!f.fabricas.length && !f.sinAsignar.length) {
    $('facHojas').innerHTML = '<div class="fac-hoja"><p class="nota">No hay ninguna bolsa ' +
        'de capacidad vigente en ' + esc(etiquetaMes(f.mes)) + ', así que no hay nada que ' +
        'facturar.</p></div>';
    return;
  }

  var hojas = f.fabricas.map(function (g) { return hojaDeFactura(g, f); }).join('');

  /* Las bolsas sin fabrica van en su propia hoja y al final. No se suman a
     ninguna factura: una bolsa en la factura equivocada es un pago mal hecho, y
     callarla seria plata que nadie cobra sin que nadie se entere. */
  if (f.sinAsignar.length) {
    hojas += '<div class="fac-hoja fac-huerfanas">' +
      '<div class="fac-cab"><div><div class="fac-rot">Pendiente de asignar</div>' +
      '<h2>Bolsas sin fábrica</h2></div>' +
      '<div class="fac-mes">' + esc(etiquetaMes(f.mes)) + '</div></div>' +
      '<p class="nota"><b>Estas bolsas no están en ninguna factura</b> porque no tienen ' +
      'fábrica asignada. Se asigna en <b>Administración → Costos de la fábrica</b>, en la ' +
      'columna «Fábrica que la factura». Mientras falte, son ' +
      pesos(f.sinAsignarTotal) + ' que nadie va a cobrar.</p>' +
      '<div class="tabla-scroll"><table class="tabla-compacta"><thead><tr>' +
      '<th>Bolsa</th><th>Concepto</th><th>Etapa</th>' +
      '<th class="num">Atribuido</th></tr></thead><tbody>' +
      f.sinAsignar.map(function (b) {
        return '<tr><td>' + esc(b.id) + '</td><td>' + esc(b.concepto) + '</td><td>' +
          esc(b.etapaNombre) + '</td><td class="num">' + pesos(b.atribuido) + '</td></tr>';
      }).join('') +
      '<tr class="cst-total"><td colspan="3">Total sin asignar</td>' +
      '<td class="num">' + pesos(f.sinAsignarTotal) + '</td></tr>' +
      '</tbody></table></div></div>';
  }
  $('facHojas').innerHTML = hojas;
}

/** Una hoja: la factura de una fabrica y su anexo. */
function hojaDeFactura(g, f) {
  var h = '<div class="fac-hoja">';

  h += '<div class="fac-cab"><div>' +
    '<div class="fac-rot">Soporte de facturación</div>' +
    '<h2>' + esc(g.nombre) + '</h2>' +
    (g.nit ? '<div class="fac-dato">NIT ' + esc(g.nit) + '</div>' : '') +
    (g.contrato ? '<div class="fac-dato">' + esc(g.contrato) + '</div>' : '') +
    '</div><div class="fac-mes">' + esc(etiquetaMes(f.mes)) +
    '<div class="fac-dato">Generado ' + esc(f.generado) + '</div></div></div>';

  /* El total, grande y primero: es lo que alguien busca al abrir el documento. */
  h += '<div class="fac-total"><div class="fac-total-rot">Valor a facturar</div>' +
    '<div class="fac-total-cifra num">' + pesos(g.aFacturar) + '</div>' +
    '<div class="fac-dato">' + esc(f.moneda || 'COP') + ' · sin IVA · ' +
    g.actividades + ' actividad(es) en ' + g.bolsas.length + ' bolsa(s) de capacidad</div></div>';

  h += '<div class="fac-seccion">Conceptos</div>' +
    '<div class="tabla-scroll"><table class="tabla-compacta"><thead><tr>' +
    '<th>Bolsa</th><th>Concepto</th><th>Etapa</th><th>Vigencia en el mes</th>' +
    '<th class="num">A facturar</th></tr></thead><tbody>' +
    g.bolsas.map(function (b) {
      // Una bolsa que no estuvo vigente todo el mes cobra proporcional: sin
      // decirlo, la cifra parece un error de calculo.
      var vig = b.parcial
        ? b.habiles + ' de ' + b.habilesPosibles + ' días hábiles'
        : 'mes completo';
      return '<tr><td>' + esc(b.id) + '</td><td>' + esc(b.concepto) +
        (b.dedicada ? '<div style="color:var(--ink-faint);font-size:11px">dedicada a ' +
          esc(b.dedicadaNombre || b.dedicada) + '</div>' : '') +
        '</td><td>' + esc(b.etapaNombre) + '</td><td>' + esc(vig) + '</td>' +
        '<td class="num">' + pesos(b.atribuido) + '</td></tr>';
    }).join('') +
    '<tr class="cst-total"><td colspan="4">Total a facturar</td>' +
    '<td class="num">' + pesos(g.aFacturar) + '</td></tr>' +
    '</tbody></table></div>';

  /* La conciliacion, FUERA del total y marcada como tal. El monto a facturar es
     lo atribuido; esto dice cuanto de lo contratado no entro y por que. */
  if (g.sinAtribuir) {
    h += '<div class="fac-concilia">' +
      '<div class="fac-seccion" style="margin-top:0">Conciliación contra el contrato ' +
      '<span class="fac-nofactura">no hace parte del valor a facturar</span></div>' +
      '<table class="tabla-compacta"><tbody>' +
      '<tr><td>Capacidad contratada en el mes</td><td class="num">' +
      pesos(g.contratado) + '</td></tr>' +
      '<tr><td>Atribuido a actividades (lo que se factura)</td><td class="num">' +
      pesos(g.aFacturar) + '</td></tr>' +
      '<tr class="cst-total"><td>Diferencia no facturada</td><td class="num">' +
      pesos(g.sinAtribuir) + '</td></tr>' +
      '</tbody></table>' +
      '<p class="nota" style="margin:8px 0 0">Esta diferencia es capacidad contratada que ' +
      'ninguna actividad ocupó <b>según las fechas registradas</b>. Si falta diligenciar ' +
      'fechas, parte de esto debería estar facturado' +
      (f.actividadesSinFechas
        ? ': hoy hay <b>' + f.actividadesSinFechas + ' actividades sin fechas</b> en alguna ' +
          'de sus fases.'
        : '.') + '</p></div>';
  }

  /* El anexo. Si no cuadra con el total es un error del calculo, y el documento
     lo dice: nadie deberia enterarse de eso frente al proveedor. */
  h += '<div class="fac-seccion">Anexo · de dónde sale cada peso</div>';
  if (!g.cuadra) {
    h += '<p class="nota" style="color:var(--rojo)"><b>Atención:</b> la suma del anexo (' +
      pesos(g.sumaAnexo) + ') no coincide con el valor a facturar (' + pesos(g.aFacturar) +
      '). Es un error de cálculo: no use este documento y repórtelo.</p>';
  }
  h += '<div class="tabla-scroll"><table class="tabla-compacta"><thead><tr>' +
    '<th>Solicitud</th><th>Iniciativa</th><th>Etapa</th><th>Bolsa</th>' +
    '<th class="num">Días</th><th class="num">De</th><th class="num">Costo</th>' +
    '</tr></thead><tbody>' +
    g.lineas.map(function (l) {
      return '<tr><td>' + esc(l.id) + '<div style="color:var(--ink-faint);font-size:11px">' +
        esc(l.nombre) + '</div></td>' +
        '<td>' + esc(l.iniciativa) + '</td><td>' + esc(l.etapaNombre) + '</td>' +
        '<td>' + esc(l.bolsa) + '</td>' +
        '<td class="num">' + diasInforme(l.dias) + '</td>' +
        '<td class="num">' + diasInforme(l.diasTotales) + '</td>' +
        '<td class="num">' + pesos(l.costo) + '</td></tr>';
    }).join('') +
    '<tr class="cst-total"><td colspan="6">Total del anexo</td>' +
    '<td class="num">' + pesos(g.sumaAnexo) + '</td></tr>' +
    '</tbody></table></div>' +
    '<p class="nota">«Días» son los días hábiles que esa solicitud ocupó la etapa en el mes, ' +
    'y «De» los días totales que se reparten en esa bolsa: el costo es la parte proporcional. ' +
    'Las fechas salen de las columnas registradas en cada solicitud.</p>';

  return h + '</div>';
}


/* ================= Informe de gestion ================= */
/**
 * El informe del mes, para el comite.
 *
 * Tres reglas de esta pantalla, que son las que la diferencian de Reportes:
 *
 *  1. Toda cifra va con su COBERTURA. Un promedio calculado sobre tres de
 *     cuarenta solicitudes se ve igual que uno calculado sobre las cuarenta, y
 *     en un comite esa diferencia es todo. El panel de arriba dice sobre que se
 *     calculo antes de que nadie lea un numero.
 *  2. No se muestran pesos del contrato. Ni el total, ni las bolsas. El servidor
 *     no los manda (InformeGestion.gs), asi que esto no es una pantalla que
 *     esconde: es un payload que no los trae.
 *  3. Los SLA van rotulados como de referencia mientras nadie los apruebe.
 *     Presentar cumplimiento contra una meta inventada es hacer creer que la
 *     meta existe.
 */
function cargarInforme(forzar) {
  var mes = $('fInformeMes').value;
  if (!mes) {
    // Por defecto, el mes pasado: el informe de gestion se hace sobre un mes
    // cerrado, y abrir en el mes en curso muestra medio mes y parece una caida.
    var h = new Date();
    var m = new Date(h.getFullYear(), h.getMonth() - 1, 1);
    mes = m.getFullYear() + '-' + ('0' + (m.getMonth() + 1)).slice(-2);
    $('fInformeMes').value = mes;
  }
  if (!forzar && DATOS.informe && DATOS.informeClave === mes) {
    pintarInforme(DATOS.informe); return;
  }
  cargando('kpisInforme', 'kpis');
  api('getInforme', mes, !!forzar).then(function (r) {
    DATOS.informe = r;
    DATOS.informeClave = mes;
    pintarInforme(r);
  }).catch(function (e) {
    fallo(e);
    $('kpisInforme').innerHTML = '';
    $('notaInforme').innerHTML = '<b style="color:var(--rojo)">No se pudo generar:</b> ' +
        esc(e && e.message ? e.message : String(e));
  });
}
$('btnInforme').addEventListener('click', function () {
  DATOS.informe = null;
  cargarInforme(true);
});
$('fInformeMes').addEventListener('change', function () {
  DATOS.informe = null;
  cargarInforme();
});

/** Un numero entero con separador de miles, o una raya si no hay con que. */
function numeroInforme(n) {
  if (n === null || n === undefined) return '—';
  return Number(n).toLocaleString('es-CO');
}
/** Un porcentaje, o una raya. Distinto de cero: cero es un dato. */
function pctInforme(n) {
  return (n === null || n === undefined) ? '—' : formatoPorcentaje(n);
}
/**
 * Dias con un decimal y coma, como el resto de la pagina.
 *
 * Escribir el numero crudo daba "8.6" junto a un "17,1" que si pasaba por el
 * formato local, y dos separadores decimales distintos en la misma tarjeta se
 * leen como dos unidades distintas.
 */
function diasInforme(n) {
  if (n === null || n === undefined) return '—';
  return (Math.round(Number(n) * 10) / 10).toString().replace('.', ',') + ' d';
}

function pintarInforme(r) {
  // El servidor puede devolver vacio: una respuesta que no cupo, una sesion
  // caida. Sin guarda, lo que ve la persona es un error de javascript en vez de
  // lo que paso (D-122).
  if (!r) {
    $('kpisInforme').innerHTML = '';
    $('notaInforme').innerHTML = '<b style="color:var(--rojo)">El servidor no devolvió ' +
        'el informe.</b> Vuelva a oprimir <b>Generar</b>; si se repite, avise.';
    return;
  }
  var t = r.titulares;
  $('subInforme').textContent = 'Mes de ' + etiquetaMes(r.mes) +
      ' · generado el ' + r.generado +
      ' · las duraciones salen de las fechas registradas en cada solicitud';

  $('kpisInforme').innerHTML = [
    kpi('Versiones entregadas', numeroInforme(t.versionesEntregadas), '',
        t.solicitudesEntregadas + ' solicitudes incluidas'),
    kpi('Llegaron a producción', numeroInforme(t.llegaronAProduccion), '',
        'Entraron al embudo ' + t.entraronAlEmbudo + ' en el mes'),
    kpi('Puntualidad', pctInforme(t.puntualidadPct), '',
        'Versiones que salieron en la fecha planeada o antes'),
    kpi('Bloqueos', numeroInforme(t.bloqueosDelMes), '',
        diasInforme(t.diasHabilesPerdidos) + ' hábiles perdidas, ' + t.bloqueosAbiertos +
        (t.bloqueosAbiertos === 1 ? ' sigue abierto' : ' siguen abiertos'),
        t.bloqueosAbiertos ? 'mal' : '')
  ].join('');

  $('notaInforme').innerHTML = 'Solicitudes en vuelo hoy: <b>' + numeroInforme(t.enVuelo) +
      '</b> · iniciativas registradas: <b>' + numeroInforme(t.iniciativasActivas) +
      '</b> · cobertura de fechas por fase: <b>' + pctInforme(t.coberturaDatosPct) + '</b>' +
      (t.pctAtribuido !== null && t.pctAtribuido !== undefined
        ? ' · capacidad con trazabilidad: <b>' + pctInforme(t.pctAtribuido) + '</b>' : '');

  pintarCalidadInforme(r);
  pintarInformeEntregadas(r);
  pintarInformePlaneadas(r);
  pintarInformeMezcla(r);
  pintarInformeIniciativasTarjetas(r);
  pintarInformeIniciativas(r);
  pintarInformeEmbudo(r);
  pintarInformeCiclo(r);
  pintarInformeDistribucion(r);
  pintarInformeBloqueos(r);
  pintarInformeCostos(r);
}

/**
 * Lo que el informe NO puede afirmar, arriba y no al final.
 *
 * Va antes de las cifras a proposito. Un comite que descubre el limite de un
 * dato despues de haber decidido sobre el no tiene como deshacer la decision, y
 * la proxima vez no cree ninguna de las cifras.
 */
function pintarCalidadInforme(r) {
  var c = r.calidad;
  var avisos = (c.avisos || []).map(function (a) {
    return '<li><b>' + esc(a.titulo) + ':</b> ' + esc(a.detalle) +
           ' <span style="color:var(--ink-faint)">(' + esc(a.donde) + ')</span></li>';
  }).join('');

  var extras = [];
  if (r.versiones.sinVersionReconocida.length) {
    extras.push('<li><b>' + r.versiones.sinVersionReconocida.length + ' solicitudes salieron a ' +
      'producción con una versión que no está en el Roadmap:</b> no suman en ninguna versión de ' +
      'la tabla de arriba. ' +
      r.versiones.sinVersionReconocida.map(function (s) {
        return esc(s.id) + ' (' + esc(s.version || 'sin versión') + ')';
      }).join(', ') + '</li>');
  }
  if (r.bloqueos.causalPerdida) {
    extras.push('<li><b>' + r.bloqueos.causalPerdida + ' bloqueos ya resueltos no tienen ' +
      'causal registrada:</b> al levantar un bloqueo el sistema borra el motivo, así que de ' +
      'esos se sabe cuánto duraron pero no por qué ocurrieron.</li>');
  }
  if (r.distribucion.totales.enProduccionSinFecha) {
    extras.push('<li><b>' + r.distribucion.totales.enProduccionSinFecha + ' solicitudes están ' +
      'en producción sin fecha de despliegue:</b> no se pueden atribuir a ningún mes, así que ' +
      'no cuentan como entrega de este.</li>');
  }
  if (r.bloqueos.sinBitacora) {
    extras.push('<li><b>La bitácora está vacía:</b> los bloqueos del mes no se pueden ' +
      'reconstruir, y por eso aparecen en cero. No significa que no hubo.</li>');
  }

  if (!avisos && !extras.length) {
    $('calidadInforme').innerHTML = '<p class="nota"><b>Cobertura completa:</b> las ' +
        c.solicitudesFabrica + ' solicitudes de fábrica tienen sus fechas por fase ' +
        'diligenciadas. Todas las cifras de esta página se calculan sobre el total.</p>';
    return;
  }

  $('calidadInforme').innerHTML =
    '<div class="panel" style="border-left:4px solid var(--alerta)">' +
    '<h3>Sobre qué datos se calculó este informe</h3>' +
    '<div class="sub">De ' + c.solicitudesFabrica + ' solicitudes de fábrica, <b>' +
    c.conTodasLasFechas + '</b> tienen todas sus fechas por fase (' +
    pctInforme(c.coberturaPct) + '). Lo que falta no desaparece del informe: baja la ' +
    'base sobre la que se calcula, y eso cambia los promedios.</div>' +
    '<ul style="margin:10px 0 0 18px;line-height:1.6">' + avisos + extras.join('') + '</ul>' +
    '</div>';
}

/** Las versiones entregadas, por plataforma, con su contenido desplegable. */
function pintarInformeEntregadas(r) {
  var v = r.versiones;
  if (!v.entregadas.length) {
    $('tablaInformeEntregadas').innerHTML = '<p class="nota">No hay versiones con fecha de ' +
        'despliegue real en ' + etiquetaMes(r.mes) + '. Si se entregó algo, falta registrar la ' +
        'fecha de despliegue en el Roadmap.</p>';
    return;
  }
  var h = '';
  v.entregadasPorPlataforma.forEach(function (p) {
    h += '<div class="seccion" style="margin-top:14px">' + esc(p.nombre) +
         ' <span style="font-weight:400;color:var(--ink-faint)">· ' + p.versiones.length +
         ' versión(es), ' + p.solicitudes + ' solicitudes</span></div>';
    h += '<div class="tabla-scroll"><table class="tabla-compacta"><thead><tr>' +
         '<th>Versión</th><th>Planeada</th><th>Real</th><th class="num">Desvío</th>' +
         '<th class="num">Solicitudes</th></tr></thead><tbody>';
    p.versiones.forEach(function (x) {
      // El desvio en dias, con el signo que importa: negativo es antes de lo
      // planeado, y eso es una buena noticia que no debe leerse como un retraso.
      var desvio = x.desvioDias === null
        ? '<span style="color:var(--ink-faint)">sin fecha planeada</span>'
        : (x.desvioDias > 0
            ? '<span style="color:var(--alerta)">+' + x.desvioDias + ' d</span>'
            : '<span style="color:var(--verde)">' + x.desvioDias + ' d</span>');
      h += '<tr><td><b>' + esc(x.numero) + '</b></td><td>' +
           esc(x.fechaPlaneada ? String(x.fechaPlaneada).slice(0, 10) : '—') + '</td><td>' +
           esc(x.fechaReal ? String(x.fechaReal).slice(0, 10) : '—') + '</td>' +
           '<td class="num">' + desvio + '</td>' +
           '<td class="num">' + x.cuenta + '</td></tr>';
      if (x.solicitudes.length) {
        h += '<tr><td colspan="5" style="padding:0 0 10px 18px">' +
             x.solicitudes.map(function (s) {
               return '<div style="font-size:12px;line-height:1.5">' +
                 '<span class="t-ver num">' + esc(s.tipoNombre) + '</span> ' +
                 esc(s.id) + ' · ' + esc(s.nombre) +
                 (s.enProduccion ? '' : ' <span style="color:var(--alerta)">(aún no en ' +
                   'producción)</span>') + '</div>';
             }).join('') + '</td></tr>';
      } else {
        h += '<tr><td colspan="5" style="padding:0 0 10px 18px;color:var(--alerta);' +
             'font-size:12px">Esta versión no tiene solicitudes asociadas: nadie le asignó ' +
             'el número de versión a lo que incluyó.</td></tr>';
      }
    });
    h += '</tbody></table></div>';
  });
  h += '<p class="nota" style="margin-top:12px">Puntualidad: <b>' +
       v.puntualidad.aTiempo + ' de ' + v.puntualidad.conFechaPlaneada +
       '</b> versiones salieron en la fecha planeada o antes' +
       (v.puntualidad.sinFechaPlaneada
         ? '. ' + v.puntualidad.sinFechaPlaneada + ' no tenían fecha planeada, así que no se ' +
           'pueden calificar.' : '.') + '</p>';
  $('tablaInformeEntregadas').innerHTML = h;
}

/** Lo comprometido que no salió, y lo que viene. */
function pintarInformePlaneadas(r) {
  var v = r.versiones;
  var h = '';
  if (v.planeadasDelMes.length) {
    h += '<div class="sub" style="color:var(--alerta);font-weight:600">Planeadas para ' +
         etiquetaMes(r.mes) + ' que no salieron</div>' +
         '<div class="tabla-scroll"><table class="tabla-compacta"><thead><tr>' +
         '<th>Plataforma</th><th>Versión</th><th>Planeada</th>' +
         '<th class="num">Comprometidas</th></tr></thead><tbody>' +
         v.planeadasDelMes.map(function (x) {
           return '<tr><td>' + esc(x.plataforma) + '</td><td><b>' + esc(x.numero) +
             '</b></td><td>' + esc(String(x.fechaPlaneada || '').slice(0, 10)) +
             '</td><td class="num">' + x.cuenta + '</td></tr>';
         }).join('') + '</tbody></table></div>';
  } else {
    h += '<p class="nota">No quedó ninguna versión planeada del mes sin salir.</p>';
  }
  if (v.planeadasFuturas.length) {
    h += '<div class="sub" style="margin-top:14px;font-weight:600">Lo que viene</div>' +
         '<div class="tabla-scroll"><table class="tabla-compacta"><thead><tr>' +
         '<th>Plataforma</th><th>Versión</th><th>Planeada</th>' +
         '<th class="num">Comprometidas</th></tr></thead><tbody>' +
         v.planeadasFuturas.map(function (x) {
           return '<tr><td>' + esc(x.plataforma) + '</td><td><b>' + esc(x.numero) +
             '</b></td><td>' + esc(String(x.fechaPlaneada || '').slice(0, 10)) +
             '</td><td class="num">' + x.cuenta + '</td></tr>';
         }).join('') + '</tbody></table></div>';
  }
  $('tablaInformePlaneadas').innerHTML = h;
}

/** Donde se concentro el valor entregado. En porcentaje, nunca en pesos. */
function pintarInformeMezcla(r) {
  var k = r.costos;
  if (!k.disponible) {
    $('tablaInformeMezcla').innerHTML = '<p class="nota"><b>No disponible:</b> ' +
        esc(k.motivo) + '</p>';
    return;
  }
  var ejes = [
    ['Línea estratégica de negocio', k.porLinea],
    ['Vertical', k.porVertical],
    ['Tipo de solicitud entregada', k.porTipoSolicitud]
  ];
  var h = ejes.map(function (par) {
    var lista = par[1] || [];
    if (!lista.length) return '';
    var max = Math.max.apply(null, lista.map(function (x) { return x.pct || 0; })) || 1;
    return '<div class="sub" style="margin-top:12px;font-weight:600">' + esc(par[0]) + '</div>' +
      lista.map(function (x) {
        return barra(x.nombre, x.pct || 0, max, pctInforme(x.pct));
      }).join('');
  }).join('');
  $('tablaInformeMezcla').innerHTML = h +
    '<p class="nota" style="margin-top:12px">El porcentaje es sobre el valor <b>atribuido</b> ' +
    'del mes. Aparte, ' + pctInforme(k.pctSinAtribuir) + ' de la capacidad pagada no encontró ' +
    'actividad a la que cargarse.</p>';
}

/** Volumen y estado de las iniciativas, por plataforma digital. */
function pintarInformeIniciativas(r) {
  var i = r.iniciativas;
  var estados = i.estados || [];
  var h = '<div class="tabla-scroll"><table class="tabla-compacta"><thead><tr>' +
    '<th>Plataforma</th>' +
    estados.map(function (e) { return '<th class="num">' + esc(e.nombre) + '</th>'; }).join('') +
    '<th class="num">Total</th></tr></thead><tbody>' +
    i.porPlataforma.map(function (p) {
      return '<tr><td>' + esc(p.nombre) + '</td>' +
        estados.map(function (e) {
          var n = p.estados[e.id] || 0;
          return '<td class="num">' + (n || '<span style="color:var(--ink-faint)">—</span>') +
                 '</td>';
        }).join('') +
        '<td class="num"><b>' + p.total + '</b></td></tr>';
    }).join('') +
    '<tr class="cst-total"><td>Suma de las filas</td>' +
    estados.map(function (e) {
      var n = i.porPlataforma.reduce(function (a, p) { return a + (p.estados[e.id] || 0); }, 0);
      return '<td class="num">' + n + '</td>';
    }).join('') +
    '<td class="num">' + i.sumaFilas + '</td></tr>' +
    '</tbody></table></div>';

  // La suma de las filas puede superar el numero de iniciativas: una que toca
  // varias plataformas se cuenta en todas. Decirlo evita que alguien reste y
  // concluya que la tabla esta mal.
  if (i.sumaFilas !== i.total) {
    h += '<p class="nota"><b>' + i.total + ' iniciativas en total.</b> La suma de las filas da ' +
         i.sumaFilas + ' porque ' + i.origen.varias + ' iniciativa(s) tocan más de una ' +
         'plataforma y se cuentan en cada una.</p>';
  }
  if (i.origen.deducida || i.origen.ninguna) {
    h += '<p class="nota">Plataforma <b>declarada</b> en ' + i.origen.declarada +
         ', <b>deducida</b> de sus solicitudes en ' + i.origen.deducida + ', y ' +
         i.origen.ninguna + ' sin ninguna' +
         (i.sinPlataforma.length
           ? ': ' + i.sinPlataforma.map(function (x) { return esc(x.nombre); }).join(', ')
           : '') + '.</p>';
  }
  $('tablaInformeIniciativas').innerHTML = h;
}

/** El inventario del ciclo de fabrica, fase por fase. */
function pintarInformeEmbudo(r) {
  var e = r.embudo;

  var h = '<div class="tabla-scroll"><table class="tabla-compacta"><thead><tr>' +
    '<th>Fase del ciclo</th><th class="num">En la fase</th><th class="num">Bloqueadas</th>' +
    '<th class="num">Entraron</th><th class="num">Salieron</th>' +
    '</tr></thead><tbody>' +
    e.fases.map(function (f) {
      return '<tr><td>' + esc(f.nombre) +
        '<span class="pista" style="display:block;margin-top:3px"><span class="relleno" ' +
        'style="width:' + Math.round(f.enFase / max * 100) + '%"></span></span></td>' +
        '<td class="num"><b>' + f.enFase + '</b></td>' +
        '<td class="num"' + (f.bloqueadas ? ' style="color:var(--alerta);font-weight:700"' : '') +
        '>' + (f.bloqueadas || '—') + '</td>' +
        '<td class="num">' + (f.entradas || '—') + '</td>' +
        '<td class="num">' + (f.salidas || '—') + '</td></tr>';
    }).join('') +
    '<tr class="cst-total"><td>Total</td><td class="num">' +
    e.fases.reduce(function (a, f) { return a + f.enFase; }, 0) + '</td><td class="num">' +
    e.fases.reduce(function (a, f) { return a + f.bloqueadas; }, 0) + '</td><td class="num">' +
    e.fases.reduce(function (a, f) { return a + f.entradas; }, 0) + '</td><td class="num">' +
    e.fases.reduce(function (a, f) { return a + f.salidas; }, 0) + '</td></tr>' +
    '</tbody></table></div>' +
    '<p class="nota"><b>En la fase</b> es una foto de hoy, no del cierre del mes: ' +
    'reconstruir el inventario día por día exigiría una bitácora que cubra todo el ' +
    'período. <b>Entraron</b> y <b>salieron</b> sí son del mes. Fuera del embudo hay ' +
    e.tareas + ' tareas y ' + e.estabilizaciones + ' estabilizaciones, que no lo recorren.</p>';
  $('tablaInformeEmbudo').innerHTML = h;

/** Cuanto duro cada fase contra su SLA, con la cobertura al lado. */
function pintarInformeCiclo(r) {
  var c = r.ciclo;
  var h = '<div class="tabla-scroll"><table class="tabla-compacta"><thead><tr>' +
    '<th>Fase</th><th class="num">Cerradas</th><th class="num">Promedio</th>' +
    '<th class="num">Mediana</th><th class="num">SLA ref.</th>' +
    '<th class="num">Cumple</th><th class="num">Sin medir</th>' +
    '</tr></thead><tbody>' +
    c.fases.map(function (f) {
      var cumple = f.cumplimientoPct === null
        ? '<span style="color:var(--ink-faint)">—</span>'
        : '<span style="color:' + (f.cumplimientoPct >= 80 ? 'var(--verde)' : 'var(--alerta)') +
          ';font-weight:700">' + pctInforme(f.cumplimientoPct) + '</span>';
      // "Sin medir" junta lo que sigue en curso y lo que no tiene fechas: son
      // las dos razones por las que una solicitud no entra en el promedio, y
      // quien lee necesita saber cuantas quedaron fuera.
      var fuera = f.enCurso + f.sinFechas;
      return '<tr><td>' + esc(f.nombre) + '</td>' +
        '<td class="num"><b>' + f.cerradas + '</b></td>' +
        '<td class="num">' + diasInforme(f.promedio) + '</td>' +
        '<td class="num">' + diasInforme(f.mediana) + '</td>' +
        '<td class="num">' + diasInforme(f.sla) + '</td>' +
        '<td class="num">' + cumple + '</td>' +
        '<td class="num" title="' + f.enCurso + ' en curso, ' + f.sinFechas +
        ' sin fechas, ' + f.noAplica + ' no aplican">' +
        (fuera || '—') + '</td></tr>';
    }).join('') + '</tbody></table></div>';

  if (c.sinColumnas.length) {
    h += '<p class="nota"><b>' +
      c.sinColumnas.map(function (f) { return esc(f.nombre); }).join(' y ') +
      '</b> no tienen columnas de fecha de inicio y fin en la solicitud, así que su duración ' +

    h += '<p class="nota" style="color:var(--alerta)"><b>Los SLA son valores de referencia, ' +

/**
 * Modo presentacion: pantalla completa y un bloque a la vez.
 *
 * Es una presentacion de comite, no un tablero de trabajo: proyectar la pagina
 * completa obliga a quien expone a desplazarse buscando el siguiente cuadro. Se
 * usa la pantalla completa del navegador y se esconden los bloques que no son el
 * actual; con Escape o con el boton se vuelve a la vista normal.
 */
var INFORME_BLOQUE = 0;
function bloquesDelInforme() {
  var pg = $('pg-informe');
  // Cada "diapositiva" es un titulo de seccion con lo que le sigue hasta el
  // siguiente titulo.
  var hijos = [].slice.call(pg.children);
  var grupos = [], actual = null;
  hijos.forEach(function (h) {
    if (h.classList.contains('encabezado') || h.id === 'kpisInforme' ||
        h.id === 'notaInforme' || h.id === 'calidadInforme') return;
    if (h.classList.contains('seccion')) { actual = [h]; grupos.push(actual); return; }
    if (actual) actual.push(h);
  });
  return grupos;
}
function mostrarBloqueInforme(n) {
  var grupos = bloquesDelInforme();
  if (!grupos.length) return;
  INFORME_BLOQUE = Math.max(0, Math.min(n, grupos.length - 1));
  grupos.forEach(function (g, i) {
    g.forEach(function (h) { h.hidden = i !== INFORME_BLOQUE; });
  });
}
function salirDePresentacion() {
  $('pg-informe').classList.remove('presentando');
  bloquesDelInforme().forEach(function (g) {
    g.forEach(function (h) { h.hidden = false; });
  });
  if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
}
$('btnInformePresentar').addEventListener('click', function () {
  var pg = $('pg-informe');
  if (pg.classList.contains('presentando')) { salirDePresentacion(); return; }
  pg.classList.add('presentando');
  mostrarBloqueInforme(0);
  if (pg.requestFullscreen) pg.requestFullscreen().catch(function () { /* sin permiso: igual sirve */ });
});
document.addEventListener('keydown', function (e) {
  var pg = $('pg-informe');
  if (!pg || !pg.classList.contains('presentando')) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
    mostrarBloqueInforme(INFORME_BLOQUE + 1); e.preventDefault();
  } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
    mostrarBloqueInforme(INFORME_BLOQUE - 1); e.preventDefault();
  } else if (e.key === 'Escape') {
    salirDePresentacion();
  }
});
document.addEventListener('fullscreenchange', function () {
  // Si se sale de pantalla completa con la tecla del navegador, la pagina no
  // puede quedarse con los bloques escondidos.
  if (!document.fullscreenElement) salirDePresentacion();
});

/**
 * Las tarjetas de iniciativa.
 *
 * Una tarjeta y no una fila de tabla porque son nueve datos por iniciativa: en
 * una tabla de nueve columnas no se lee ninguno, y proyectada en un comite
 * menos. La tarjeta agrupa los tres que se leen juntos —avance real contra
 * esperado y su desviacion— y deja el resto como etiquetas.
 *
 * Los filtros son del navegador, no del servidor: el informe ya trae todas las
 * iniciativas, y pedirlas de nuevo por cada filtro haria esperar para esconder
 * filas que ya estan en la pagina.
 */
/* Esta pagina muestra TODAS las iniciativas, sin filtros. Los filtros viven en
   el menu Portafolio: el Informe se proyecta en un comite, y una vista filtrada
   proyectada es una vista que alguien va a leer como el total (D-129). */
function pintarInformeIniciativasTarjetas(r) {
  var pf = r.portafolio;
  if (!pf || !pf.tarjetas.length) {
    $('tarjetasInformeIniciativas').innerHTML = '<p class="nota">No hay iniciativas ' +
      'registradas.</p>';
    $('notaInformePortafolio').innerHTML = '';
    return;
  }

  $('notaInformePortafolio').innerHTML =
    '<b>' + pf.total + ' iniciativas</b>' +
    ' · <b>' + pf.atrasadas + '</b> por debajo de su plan' +
    ' · <b>' + pf.conBloqueo + '</b> con alguna solicitud bloqueada' +
    (pf.enPausa ? ' · <b>' + pf.enPausa + '</b> en pausa' : '') +
    (pf.sinPlan ? ' · <b>' + pf.sinPlan + '</b> sin fechas de plan, así que no se les puede ' +
      'calcular el avance esperado' : '') +
    (pf.sinActividades ? ' · <b>' + pf.sinActividades + '</b> sin solicitudes, así que no hay ' +
      'con qué medir su avance real' : '');

  $('tarjetasInformeIniciativas').innerHTML = '<div class="tarjetas-ini">' +
    pf.tarjetas.map(tarjetaDeIniciativa).join('') + '</div>';
}

/** Una tarjeta. Se separa para poder leerla y para poder probarla sola. */
function tarjetaDeIniciativa(t) {
  /* La desviacion manda el color de la tarjeta: es la unica lectura que le dice
     a un comite si hay que hacer algo. Sin plan no hay desviacion, y entonces no
     hay color: pintar de verde una iniciativa que nadie puede evaluar seria
     tranquilizar sin motivo. */
  var clase = 'ti';
  if (t.desviacion === null) clase += ' ti-sinplan';
  else if (t.desviacion < -15) clase += ' ti-mal';
  else if (t.desviacion < 0) clase += ' ti-ojo';
  else clase += ' ti-bien';

  var fecha = function (d) {
    return d ? esc(String(d).slice(0, 10)) : '<span class="ti-falta">sin fecha</span>';
  };
  var barraAvance = function (etq, valor, modificador) {
    if (valor === null || valor === undefined) {
      return '<div class="ti-av"><span class="ti-av-rot">' + esc(etq) + '</span>' +
        '<span class="pista"></span><span class="ti-av-val">—</span></div>';
    }
    return '<div class="ti-av"><span class="ti-av-rot">' + esc(etq) + '</span>' +
      '<span class="pista"><span class="relleno' + (modificador ? ' ' + modificador : '') +
      '" style="width:' + Math.max(0, Math.min(100, valor)) + '%"></span></span>' +
      '<span class="ti-av-val num">' + formatoPorcentaje(valor) + '</span></div>';
  };

  /* El color de la barra de avance REAL dice como va contra su plan; la de
     ESPERADO va siempre en verde, porque es la referencia y no un resultado. Dos
     barras del mismo color obligan a leer los numeros para saber cual es cual;
     con la referencia fija en verde, la comparacion se ve sin leer. */
  var colorReal = '';
  if (t.desviacion === null) colorReal = '';          // sin plan contra el cual medir
  else if (t.desviacion < -15) colorReal = 'rojo';
  else if (t.desviacion < 0) colorReal = 'ambar';
  else colorReal = 'verde';

  /* Sin desviacion hay DOS razones distintas y exigen acciones distintas: le
     faltan las fechas del plan, o le faltan solicitudes. Decir "sin plan" a una
     iniciativa que tiene sus dos fechas y ninguna solicitud manda a corregir lo
     que no esta mal. */
  var desv;
  if (t.desviacion !== null) {
    desv = '<span class="ti-pill ' + (t.desviacion < 0 ? 'ti-pill-mal' : 'ti-pill-bien') + '">' +
      (t.desviacion > 0 ? '+' : '') + formatoPorcentaje(t.desviacion) + '</span>';
  } else if (t.faltaFechaInicio || t.faltaFechaFin) {
    desv = '<span class="ti-pill ti-pill-gris" title="Falta ' +
      (t.faltaFechaInicio && t.faltaFechaFin ? 'la fecha de inicio y la fecha fin planeada'
        : (t.faltaFechaInicio ? 'la fecha de inicio' : 'la fecha fin planeada')) +
      '">sin plan</span>';
  } else {
    desv = '<span class="ti-pill ti-pill-gris" title="Tiene fechas de plan, pero ninguna ' +
      'solicitud de la cual medir el avance real">sin solicitudes</span>';
  }

  /* La iniciativa en pausa, senalada. No es un error —el negocio puede pausarla
     a proposito— pero una pausa que nadie recuerda es un compromiso detenido que
     sigue contando en el portafolio. El icono lleva texto en el titulo porque un
     simbolo solo no se lee en un lector de pantalla. */
  var pausa = t.enPausa
    ? '<span class="ti-pausa" title="Iniciativa en pausa: sigue en el portafolio y no avanza" ' +
      'role="img" aria-label="En pausa">&#9888;</span>'
    : '';

  return '<article class="' + clase + (t.enPausa ? ' ti-enpausa' : '') + '">' +
    '<header class="ti-cab">' +
      pausa +
      '<div class="ti-nombre" title="' + esc(t.id) + '">' + esc(t.nombre) + '</div>' +
      desv +
    '</header>' +
    '<div class="ti-etqs">' +
      '<span class="ti-etq">' + esc(t.estadoNombre) + '</span>' +
      '<span class="ti-etq ti-pri-' + esc(t.prioridad || 'x') + '">' +
        esc(t.prioridadNombre) + '</span>' +
      '<span class="ti-etq">' + esc(t.tipoNombre) + '</span>' +
      '<span class="ti-etq' + (t.origenPlataforma === 'declarada' ? '' : ' ti-etq-tenue') +
        '" title="' + (t.origenPlataforma === 'declarada'
          ? 'Plataforma declarada en la iniciativa'
          : t.origenPlataforma === 'varias'
            ? 'La iniciativa toca varias plataformas'
            : t.origenPlataforma === 'deducida'
              ? 'Deducida de las solicitudes: la iniciativa no la tiene declarada'
              : 'La iniciativa no tiene plataforma y no tiene solicitudes de las cuales deducirla') +
        '">' + esc(t.plataforma) +
        (t.origenPlataforma === 'deducida' ? ' *' : '') + '</span>' +
      (t.tieneBloqueo
        ? '<span class="ti-etq ti-etq-bloqueo" title="' +
          esc(t.detalleBloqueo.map(function (b) { return b.id + ' · ' + b.nombre; }).join('\n')) +
          '">Bloqueo: ' + t.bloqueadas + '</span>'
        : '') +
    '</div>' +
    barraAvance('Real', t.avanceReal, colorReal) +
    barraAvance('Esperado', t.avanceEsperado, 'verde') +
    /* El estado de sus solicitudes. Se muestran solo los estados que tienen
       alguna: una tarjeta con cinco ceros no informa nada. */
    ((t.porEstado && t.porEstado.length)
      ? '<div class="ti-estados">' + t.porEstado.map(function (e) {
          return '<span class="ti-est ti-est-' + esc(e.estado) + '">' +
            '<b class="num">' + e.cuenta + '</b> ' + esc(e.nombre) + '</span>';
        }).join('') + '</div>'
      : '<div class="ti-estados"><span class="ti-est ti-est-vacio">Sin solicitudes</span></div>') +
    '<footer class="ti-pie">' +
      '<span>Inicio ' + fecha(t.fechaInicio) + '</span>' +
      '<span>Fin plan. ' + fecha(t.fechaFinPlaneada) + '</span>' +
      '<span>' + t.actividades + ' solicitud(es)' +
        (t.estabilizaciones ? ' · ' + t.estabilizaciones + ' incid.' : '') + '</span>' +
    '</footer>' +
    '</article>';
}

/* ================= Portafolio de iniciativas ================= */
/**
 * El portafolio en tarjetas: como va cada iniciativa frente a su plan.
 *
 * Filtrar y ordenar se hacen EN EL NAVEGADOR. El servidor manda todas las
 * iniciativas una vez —son decenas, no miles— y volver a pedirlas por cada
 * cambio de filtro haria esperar para esconder tarjetas que ya estan en la
 * pagina. Esta pantalla es la unica con filtros: el Informe de gestion muestra
 * el portafolio completo porque se proyecta en un comite, y una vista filtrada
 * proyectada es una vista que alguien va a leer como el total.
 */
var PF_FILTRO = { estado: '', plataforma: '', prioridad: '', tipo: '',
                  texto: '', bloqueo: false, atraso: false, pausa: false };
var PF_ORDEN = { campo: 'finPlaneada', invertido: false };
/* Lo ultimo que llego. Los filtros repintan con esto y no con DATOS, para que no
   dejen de responder en silencio si alguien limpia la cache del cliente. */
var PF_DATOS = null;

function cargarPortafolio(forzar) {
  if (!forzar && PF_DATOS) { pintarPortafolio(PF_DATOS); return; }
  cargando('kpisPortafolio', 'kpis');
  api('getPortafolio', !!forzar).then(function (r) {
    PF_DATOS = r;
    pintarPortafolio(r);
  }).catch(function (e) {
    fallo(e);
    $('kpisPortafolio').innerHTML = '';
    $('notaPortafolio').innerHTML = '<b style="color:var(--rojo)">No se pudo cargar:</b> ' +
        esc(e && e.message ? e.message : String(e));
  });
}

/** Las tarjetas que pasan el filtro, en el orden pedido. */
function tarjetasVisiblesPortafolio(r) {
  var f = PF_FILTRO;
  var texto = f.texto.trim().toLowerCase();
  var lista = r.tarjetas.filter(function (t) {
    if (f.estado && t.estado !== f.estado) return false;
    if (f.plataforma && t.plataforma !== f.plataforma) return false;
    if (f.prioridad && t.prioridad !== f.prioridad) return false;
    if (f.tipo && t.tipo !== f.tipo) return false;
    if (f.bloqueo && !t.tieneBloqueo) return false;
    if (f.pausa && !t.enPausa) return false;
    // "Por debajo del plan" es desviacion negativa. Una iniciativa sin plan no
    // esta atrasada: no se puede saber, y colarla aqui seria inventar.
    if (f.atraso && !(t.desviacion !== null && t.desviacion < 0)) return false;
    if (texto && String(t.nombre).toLowerCase().indexOf(texto) === -1 &&
        String(t.id).toLowerCase().indexOf(texto) === -1) return false;
    return true;
  });

  /* En CUALQUIER orden, lo que no tiene el dato por el cual se ordena va al
     final, nunca al principio: una iniciativa sin fecha no es la mas urgente, y
     una sin plan no es la mas atrasada. Invertir el orden no las sube: siguen al
     final, porque "lo que falta" no es un extremo de la escala. */
  var sinDato = function (t) {
    if (PF_ORDEN.campo === 'finPlaneada') return !t.fechaFinPlaneada;
    if (PF_ORDEN.campo === 'inicio') return !t.fechaInicio;
    if (PF_ORDEN.campo === 'prioridad') return !t.prioridad;
    if (PF_ORDEN.campo === 'desviacion') return t.desviacion === null;
    return false;
  };
  var clave = function (t) {
    if (PF_ORDEN.campo === 'finPlaneada') return String(t.fechaFinPlaneada || '').slice(0, 10);
    if (PF_ORDEN.campo === 'inicio') return String(t.fechaInicio || '').slice(0, 10);
    // La prioridad se ordena por su codigo, que ya viene de critica a baja.
    if (PF_ORDEN.campo === 'prioridad') return String(t.prioridad || '');
    if (PF_ORDEN.campo === 'desviacion') return t.desviacion;
    return String(t.nombre || '').toLowerCase();
  };
  var signo = PF_ORDEN.invertido ? -1 : 1;
  lista.sort(function (a, b) {
    var fa = sinDato(a), fb = sinDato(b);
    if (fa !== fb) return fa ? 1 : -1;
    if (fa && fb) return String(a.nombre).localeCompare(String(b.nombre));
    var ka = clave(a), kb = clave(b);
    if (ka === kb) return String(a.nombre).localeCompare(String(b.nombre));
    if (typeof ka === 'number') return (ka - kb) * signo;
    return ka.localeCompare(kb) * signo;
  });
  return lista;
}

function pintarPortafolio(r) {
  if (!r) {
    $('kpisPortafolio').innerHTML = '';
    $('notaPortafolio').innerHTML = '<b style="color:var(--rojo)">El servidor no devolvió ' +
        'el portafolio.</b> Vuelva a oprimir <b>Actualizar</b>.';
    return;
  }
  PF_DATOS = r;
  if (!r.tarjetas || !r.tarjetas.length) {
    $('kpisPortafolio').innerHTML = '';
    $('tarjetasPortafolio').innerHTML = '';
    $('notaPortafolio').innerHTML = 'No hay iniciativas registradas. Se administran en ' +
        '<b>Administración → Iniciativas</b>.';
    return;
  }
  llenarFiltrosPortafolio(r);

  $('kpisPortafolio').innerHTML = [
    kpi('Iniciativas', numeroInforme(r.total), '',
        r.enPausa ? r.enPausa + ' en pausa' : 'Ninguna en pausa', r.enPausa ? 'mal' : ''),
    kpi('Por debajo del plan', numeroInforme(r.atrasadas), '',
        'Su avance real va detrás del esperado', r.atrasadas ? 'mal' : ''),
    kpi('Con bloqueo', numeroInforme(r.conBloqueo), '',
        'Tienen al menos una solicitud detenida', r.conBloqueo ? 'mal' : ''),
    // Las dos razones por las que una iniciativa no se puede evaluar, juntas:
    // es la lista de lo que hay que diligenciar.
    kpi('Sin poder medir', numeroInforme(r.sinPlan + r.sinActividades), '',
        r.sinPlan + ' sin fechas de plan, ' + r.sinActividades + ' sin solicitudes')
  ].join('');

  var visibles = tarjetasVisiblesPortafolio(r);
  $('notaPortafolio').innerHTML = visibles.length === r.total
    ? '<b>' + r.total + ' iniciativas</b>, ordenadas por ' + etiquetaOrdenPortafolio() + '.'
    : '<b>' + visibles.length + ' de ' + r.total + ' iniciativas</b>, ordenadas por ' +
      etiquetaOrdenPortafolio() + '. <a href="#" id="pfQuitarFiltros">Quitar los filtros</a>';
  if ($('pfQuitarFiltros')) {
    $('pfQuitarFiltros').addEventListener('click', function (e) {
      e.preventDefault(); limpiarFiltrosPortafolio();
    });
  }

  $('tarjetasPortafolio').innerHTML = visibles.length
    ? '<div class="tarjetas-ini">' + visibles.map(tarjetaDeIniciativa).join('') + '</div>'
    : '<p class="nota">Ninguna iniciativa cumple el filtro. ' +
      '<a href="#" id="pfQuitarFiltros2">Quitar los filtros</a></p>';
  if ($('pfQuitarFiltros2')) {
    $('pfQuitarFiltros2').addEventListener('click', function (e) {
      e.preventDefault(); limpiarFiltrosPortafolio();
    });
  }

  $('leyendaPortafolio').innerHTML =
    'El <b>% real</b> es el promedio de avance de sus solicitudes, sin contar las canceladas; ' +
    'las de fábrica se miden por el embudo de ocho fases y las tareas por su estado. El ' +
    '<b>% esperado</b> es lo que debería llevar hoy según sus fechas, en días hábiles, y va ' +
    'siempre en <b>verde</b> porque es la referencia. La barra de <b>% real</b> toma su color de ' +
    'la comparación: verde si va igual o mejor que el plan, ámbar hasta 15 puntos por debajo, ' +
    'rojo más abajo. El número de arriba a la derecha es esa diferencia. ' +
    '<b>Sin plan</b> significa que falta la fecha de inicio o la fecha fin estimada; ' +
    '<b>sin solicitudes</b>, que tiene fechas pero no hay con qué medir el avance real. ' +
    'El icono &#9888; marca las iniciativas <b>en pausa</b>. Una plataforma en cursiva con ' +
    'asterisco está <b>deducida</b> de las solicitudes: la iniciativa no la tiene declarada. ' +
    'Datos al ' + esc(r.generado || '') + '.';
}

  if (opciones) {
    for (var i = 0; i < opciones.length; i++) {
      if (String(opciones[i].valor) === String(valor)) return opciones[i].texto;
    }
  }
  return valor;
}

/**
 * Arma los campos de un formulario a partir de la definicion de columnas del
 * esquema. Lo usan el CRUD de administracion y la migracion de solicitudes, de
 * modo que ambos respetan los mismos tipos, obligatorios y listas.
 *
 * @param {!Array<!Object>} columnas
 * @param {!Object} opciones Listas desplegables por campo.
 * @param {!Object} registro Valores actuales.
 * @param {string=} campoBloqueado Campo que no se puede editar.
 * @return {string} HTML de los campos.
 */
function construirCampos(columnas, opciones, registro, campoBloqueado) {
  return columnas.map(function (c) {
    var valor = registro[c.campo] === undefined || registro[c.campo] === null ? '' : registro[c.campo];
    var bloqueado = (campoBloqueado && c.campo === campoBloqueado) ? ' disabled' : '';
    var lista = opciones[c.campo];
    var control;

    if (lista) {
      control = '<select id="campo_' + c.campo + '"' + bloqueado + '>' +
        (c.requerido ? '' : '<option value="">(sin asignar)</option>') +
        lista.map(function (o) {
          return '<option value="' + esc(o.valor) + '"' +
                 (String(o.valor) === String(valor) ? ' selected' : '') + '>' +
                 esc(o.texto) + '</option>';
        }).join('') + '</select>';
    } else if (c.opciones) {
      control = '<select id="campo_' + c.campo + '"' + bloqueado + '>' +
        c.opciones.map(function (o) {
          return '<option value="' + esc(o) + '"' + (o === valor ? ' selected' : '') + '>' +
                 esc(o) + '</option>';
        }).join('') + '</select>';
    } else if (c.tipo === 'boolSN') {
      /* El valor vacio tiene que caer en NO, y por eso NO va primero.
         Antes la lista empezaba por SI y, con la celda vacia, ninguna opcion
         quedaba marcada: el navegador mostraba la primera —SI— y quien abriera
         el formulario y guardara, por cualquier motivo, dejaba el campo en SI
         sin haberlo tocado. Con las columnas de "no aplica" eso dejo de ser un
         detalle: marcaba fases que nadie quiso marcar y sacaba la solicitud del
         costeo en silencio (D-125). */
      var siMarcado = String(valor || '').trim().toUpperCase();
      var esSi = siMarcado === 'SI' || siMarcado === 'SÍ' || siMarcado === 'TRUE' ||
                 siMarcado === 'VERDADERO' || siMarcado === 'X' || siMarcado === '1';
      control = '<select id="campo_' + c.campo + '"' + bloqueado + '>' +
        '<option value="NO"' + (esSi ? '' : ' selected') + '>NO</option>' +
        '<option value="SI"' + (esSi ? ' selected' : '') + '>SI</option>' +
        '</select>';
    } else if (c.tipo === 'longtext') {
      control = '<textarea id="campo_' + c.campo + '" rows="3"' + bloqueado + '>' + esc(valor) + '</textarea>';
    } else if (c.tipo === 'date' || c.tipo === 'datetime') {
      control = '<input type="date" id="campo_' + c.campo + '" value="' +
                fechaInput(valor) + '"' + bloqueado + '>';
    } else {
      var tipoInput = (c.tipo === 'number' || c.tipo === 'decimal') ? 'number'
                    : (c.tipo === 'email' ? 'email' : 'text');
      control = '<input type="' + tipoInput + '" id="campo_' + c.campo + '" value="' +
                esc(valor) + '"' + bloqueado + '>';
    }
    // La ayuda la declara el esquema, asi que un campo que necesita explicarse
    // se explica igual en todos los formularios que lo muestren.
    return '<label class="campo"><span>' + esc(c.etiqueta) + (c.requerido ? ' *' : '') +
           '</span>' + control +
           (c.ayuda ? '<small style="color:var(--ink-faint)">' + esc(c.ayuda) + '</small>' : '') +
           '</label>';
  }).join('');
}

/** Lee de vuelta los campos construidos por construirCampos(). */
function leerCampos(columnas) {
  var datos = {};
  columnas.forEach(function (c) {
    var el = $('campo_' + c.campo);
    datos[c.campo] = el ? el.value : '';
  });
  return datos;
}

function formularioRegistro(valorPk) {
  var r = DATOS.admin;
  var registro = valorPk
      ? r.filas.filter(function (f) { return String(f[r.pk]) === String(valorPk); })[0]
      : {};

  var campos = construirCampos(r.columnas, r.opciones, registro, valorPk ? r.pk : null);
  if (!valorPk) {
    campos = campos.replace('</label>',
        '<small style="color:var(--ink-faint)">Déjelo vacío y el sistema lo genera</small></label>');
  }

  abrirModal(valorPk ? 'Editar registro' : 'Nuevo registro',
    r.etiqueta, '<div class="formulario">' + campos + '</div>',
    function () {
      var nuevo = leerCampos(r.columnas);
      var metodo = valorPk ? 'adminActualizarRegistro' : 'adminCrearRegistro';
      var args = valorPk ? [metodo, r.tabla, valorPk, nuevo] : [metodo, r.tabla, nuevo];
      return api.apply(null, args).then(function () {
        toast(valorPk ? 'Registro actualizado.' : 'Registro creado.');
        invalidarCacheCliente();
        cargarTablaAdmin(r.tabla);
      });
    });
}

/** El gobierno del tipo elegido en el formulario de alta. */
function gobiernoDelFormulario() {

}

/** True si el tipo elegido en el formulario de alta es una tarea. */
function tipoEsTarea() { return gobiernoDelFormulario() === 'tarea'; }

/** Muestra u oculta los campos que solo aplican a un gobierno u otro. */
/**
 * El campo "Fase inicial" del formulario de nueva solicitud, o nada.
 *
 * Casi toda solicitud entra por "Gestion de la demanda", pero no todas: una que
 * llega ya analizada, o una que se registra cuando el trabajo va avanzado, no
 * tiene por que empezar en la primera casilla y que alguien la arrastre cinco
 * veces para ponerla donde de verdad esta.
 *
 * Solo se ofrecen las fases en las que ese rol podria dejarla, y se preguntan
 * con la misma regla que valida un arrastre: registrar una solicitud en la fase
 * X es lo mismo que crearla en la primera y moverla hasta X. Si no hay ninguna
 * otra, el campo no se dibuja: un combo de una sola opcion no es una decision.
 */
function campoFaseInicial() {
  var permitidas = CAT.fases.filter(function (f) {
    return f.id === 'FAS-01' || validarTransicionCliente('FAS-01', f.id).permitido;
  });
  if (permitidas.length < 2) return '';
  return '<label class="campo solo-fabrica"><span>Fase inicial</span>' +
    '<select id="nsFase">' + permitidas.map(function (f) {
      return '<option value="' + esc(f.id) + '">' + esc(f.nombre) + '</option>';
    }).join('') + '</select>' +

    'primera. Solo se listan las que su rol puede operar. Una tarea no lleva ' +
    'fase: se gobierna por estado.</small></label>';
