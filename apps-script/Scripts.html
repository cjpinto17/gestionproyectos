<script>
/**
 * Scripts.html
 * Logica de la interfaz. Todo el dato viene del backend por google.script.run:
 * esta capa solo pinta y valida lo que el usuario escribe antes de enviarlo.
 */

/* ================= Estado de la aplicacion ================= */
var CTX = null;          // usuario en sesion, rol y permisos
var CAT = null;          // catalogos maestros
var DATOS = {};          // cache por pagina
var tablaAdminActual = 'Usuarios';
var arrastrada = null;
var accionModal = null;

var TODAS = '*';
var PAGINAS = ['home', 'portafolio', 'iniciativas', 'gestion', 'roadmap', 'reportes',
               'costos', 'informe', 'admin'];
// Mismo codigo de color que los estados de iniciativa, para que el tablero y
// la matriz se lean igual: gris lo que no arranca, amarillo lo que avanza,
// verde lo terminado, rojo lo detenido.
var CLASE_ESTADO = {
  'EST-01': 'e-por-iniciar',   // Por iniciar  · gris
  'EST-02': 'e-en-progreso',   // En progreso  · amarillo
  'EST-03': 'e-finalizada',    // Aprobada     · verde
  'EST-04': 'e-en-pausa',      // Bloqueada    · rojo
  'EST-05': 'e-cancelada',     // Cancelada    · gris tachado
  'EST-06': 'e-finalizada'     // Terminada    · verde
};
// Codigo de color de los estados de iniciativa, definido por el negocio.
/**
 * Color de cada tipo de solicitud. Lo nuevo construye, el ajuste corrige: verlos
 * del mismo color en el roadmap era perder de un vistazo la mezcla de inversion.
 * Un tipo que alguien agregue despues sale neutro, que es mejor que no salir.
 */
var CLASE_TIPO = { 'TIP-03': 'tipo-nuevo', 'TIP-02': 'tipo-mejora', 'TIP-01': 'tipo-ajuste',
                  'TIP-05': 'tipo-estab' };

/**
 * Color de cada momento de las historias: escribiendo es trabajo en curso,
 * esperando al PO es una espera que alguien tiene que destrabar, y aprobadas es
 * trabajo listo. Verlos del mismo color era no poder barrer la columna de un
 * vistazo buscando lo que lleva dias esperando (D-108).
 */
var CLASE_HISTORIAS = {
  'En construcción': 'h-curso', 'Enviadas al PO': 'h-espera', 'Aprobadas': 'h-listo'
};


var CLASE_ESTADO_INI = {
  'EIN-01': 'e-por-iniciar',   // gris
  'EIN-02': 'e-en-progreso',   // amarillo
  'EIN-03': 'e-en-pausa',      // rojo
  'EIN-04': 'e-cancelada',     // gris tachado
  'EIN-05': 'e-finalizada'     // verde
};
var FRANJA_ESTADO_INI = {
  'EIN-01': 'f-por-iniciar', 'EIN-02': 'f-en-progreso', 'EIN-03': 'f-en-pausa',
  'EIN-04': 'f-cancelada', 'EIN-05': 'f-finalizada'
};
var PRIORIDAD_CLASE = {
  'PRI-01': 'p-critica', 'PRI-02': 'p-alta', 'PRI-03': 'p-media', 'PRI-04': 'p-baja'
};
// Orden de presentacion: critica, alta, media, baja. Lo que no tenga prioridad
// va al final de la celda.
var PESO_PRIORIDAD = { 'PRI-01': 0, 'PRI-02': 1, 'PRI-03': 2, 'PRI-04': 3 };
/**
 * Ventana con la que abre el Home: los ultimos tres meses.
 *
 * Vive aqui y no solo en el <option selected> porque el arranque pide los
 * indicadores de esta ventana en el mismo viaje que la sesion y los catalogos.
 * Si los dos valores se separaran, el Home pediria de nuevo al servidor apenas
 * abrir, y se perderia justo el viaje que ese arranque ahorra. Su gemelo del
 * lado del servidor es CONFIG.VENTANA_HOME_MESES, que decide cual ventana se
 * deja caliente en cache.
 */
var VENTANA_INICIAL = 3;
var COLOR_FASE = ['#00306E','#0B4FA5','#1B6FD0','#3E92E0','#1BB26C','#1DD982','#50EAA2','#9CF3CB'];

/* ================= Utilidades ================= */
function esc(t) {
  return String(t === null || t === undefined ? '' : t)
      .replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
}
function $(id) { return document.getElementById(id); }

var tToast;
function toast(msg, esError) {
  var el = $('toast');
  el.textContent = msg;
  el.className = 'toast' + (esError ? ' err' : '');
  el.hidden = false;
  clearTimeout(tToast);
  tToast = setTimeout(function () { el.hidden = true; }, esError ? 7000 : 4500);
}

/**
 * Identificador de la sesion abierta con codigo. Los de la compania no lo
 * necesitan: a ellos los reconoce Google.
 */
var TOKEN_SESION = '';
var CLAVE_TOKEN = 'sesionPlataformasDigitales';

function leerTokenGuardado() {
  try { return localStorage.getItem(CLAVE_TOKEN) || ''; } catch (e) { return ''; }
}
function guardarToken(token) {
  TOKEN_SESION = token || '';
  try {
    if (token) localStorage.setItem(CLAVE_TOKEN, token);
    else localStorage.removeItem(CLAVE_TOKEN);
  } catch (e) { /* navegador sin almacenamiento: la sesion dura lo que la pestana */ }
}

/**
 * Envuelve google.script.run en una promesa.
 *
 * Todas las operaciones entran por el despachador del servidor, que establece
 * la identidad una sola vez y la deja fija. Por eso el token viaja en cada
 * llamada: es lo unico que el servidor tiene para saber quien pregunta cuando
 * Google no lo dice.
 */
function api(metodo) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (err) {
          var msg = (err && err.message) ? err.message : String(err);
          if (msg.indexOf('SESION_INVALIDA') !== -1) {
            // La sesion vencio o nunca existio: se pide el ingreso de nuevo en
            // lugar de dejar un error suelto en pantalla.
            guardarToken('');
            mostrarIngreso(msg.replace(/^.*SESION_INVALIDA:\s*/, ''));
            return;
          }
          reject(err);
        })
        .llamar(TOKEN_SESION, metodo, args);
  });
}

/**
 * Consultas que ya salieron y todavia no han vuelto, por nombre.
 *
 * Mientras la persona mira el Home, la precarga va trayendo el tablero y la
 * matriz. Si hace clic en Seguimiento mientras la matriz viene en camino, sin
 * esto se disparaba una segunda consulta identica: dos viajes al servidor, el
 * doble de espera y ninguna ganancia. Con esto el clic se engancha a la
 * consulta que ya iba.
 */
var EN_VUELO = {};

/**
 * Cuenta las veces que los datos del navegador se han dado por viejos.
 *
 * Sirve para no instalar una respuesta que salio antes de una escritura: la
 * consulta ya iba en camino y vuelve con los datos de antes del cambio.
 */
var GENERACION_DATOS = 0;

/** Da por viejo lo que venga en camino. */
function olvidarConsultas() {
  EN_VUELO = {};
  GENERACION_DATOS++;
}

/**
 * Hace la consulta una sola vez aunque se pida varias en paralelo.
 * @param {string} clave Identifica la consulta.
 * @param {function(): !Promise} pedir
 * @return {!Promise}
 */
function unaSolaConsulta(clave, pedir) {
  if (EN_VUELO[clave]) return EN_VUELO[clave];
  var olvidar = function () { delete EN_VUELO[clave]; };
  EN_VUELO[clave] = pedir().then(
      function (r) { olvidar(); return r; },
      function (e) { olvidar(); throw e; });
  return EN_VUELO[clave];
}

/** Llamadas que ocurren ANTES de tener identidad, sin pasar por el despachador. */
function apiPublica(metodo) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)[metodo].apply(null, args);
  });
}

function fecha(valor) {
  if (!valor) return '';
  var d = new Date(valor);
  if (isNaN(d.getTime())) return String(valor);
  return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) +
         '/' + d.getFullYear();
}
function fechaHora(valor) {
  if (!valor) return '';
  var d = new Date(valor);
  if (isNaN(d.getTime())) return String(valor);
  return fecha(valor) + ' ' + ('0' + d.getHours()).slice(-2) + ':' +
         ('0' + d.getMinutes()).slice(-2);
}
/**
 * Valor para un <input type="date">: aaaa-mm-dd en la hora LOCAL.
 *
 * No se usa toISOString(), que convierte a UTC: una fecha registrada a las
 * 7 de la noche en Colombia (UTC-5) ya es el dia siguiente en UTC, y el
 * formulario mostraria un dia de mas. Al guardar, ese dia de mas se quedaria.
 */
function fechaInput(valor) {
  if (!valor) return '';
  var d = new Date(valor);
  if (isNaN(d.getTime())) return '';
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' +
         ('0' + d.getDate()).slice(-2);
}
function etiquetaMes(clave) {
  var m = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  var p = String(clave).split('-');
  return m[Number(p[1]) - 1] + ' ' + p[0].slice(2);
}
function nombreDeCatalogo(lista, id) {
  for (var i = 0; i < (lista || []).length; i++) {
    if (lista[i].id === id) return lista[i].nombre;
  }
  return id || '';
}
function nombreFase(id) { return nombreDeCatalogo(CAT.fases, id); }
function nombreEstado(id) { return nombreDeCatalogo(CAT.estados, id); }
function nombrePlataforma(id) { return nombreDeCatalogo(CAT.plataformas, id); }
function nombreUsuario(id) {
  for (var i = 0; i < CAT.usuarios.length; i++) {
    if (CAT.usuarios[i].ID_Usuario === id) return CAT.usuarios[i].Nombre_Completo;
  }
  return '';
}
function nombreCorto(id) {
  var n = nombreUsuario(id);
  if (!n) return '—';
  var p = n.split(' ');
  return p[0] + ' ' + (p[1] || '').charAt(0) + '.';
}
function ordenDeFase(id) {
  for (var i = 0; i < CAT.fases.length; i++) {
    if (CAT.fases[i].id === id) return CAT.fases[i].orden;
  }
  return -1;
}

/* ================= Componentes de presentacion ================= */
function kpi(rot, cifra, unidad, pie, clase) {
  var valor = (cifra === null || cifra === undefined)
      ? '<small>sin datos</small>'
      : esc(cifra) + (unidad ? '<small>' + esc(unidad) + '</small>' : '');
  return '<div class="kpi' + (clase ? ' ' + clase : '') + '">' +
         '<div class="rot">' + esc(rot) + '</div>' +
         '<div class="cifra num">' + valor + '</div>' +
         (pie ? '<div class="pie">' + esc(pie) + '</div>' : '') + '</div>';
}
function barra(etq, val, max, texto, clase) {
  var w = max ? Math.round(val / max * 100) : 0;
  return '<div class="barra-dato"><span>' + esc(etq) + '</span>' +
         '<span class="pista"><span class="relleno ' + (clase || '') +
         '" style="width:' + w + '%"></span></span>' +
         '<span class="val num">' + esc(texto) + '</span></div>';
}
function columnas(items, max) {
  var dobles = items.some(function (i) { return i.v2 !== undefined; });
  var tope = max || Math.max.apply(null, items.map(function (i) {
    return dobles ? Math.max(i.v1 || 0, i.v2 || 0) : (i.v1 || 0);
  })) || 1;
  return '<div class="columnas">' + items.map(function (i) {
    var h1 = Math.round((i.v1 || 0) / tope * 100);
    var h2 = Math.round((i.v2 || 0) / tope * 100);
    var cuerpo = dobles
        ? '<div class="par"><div class="bloque b2" style="height:' + h2 + '%"></div>' +
          '<div class="bloque" style="height:' + h1 + '%"></div></div>'
        : '<div class="torre"><div class="bloque" style="height:' + h1 + '%"></div></div>';
    return '<div class="colum"><span class="cifra num">' + esc(i.txt) + '</span>' +
           cuerpo + '<span class="etq">' + esc(i.etq) + '</span></div>';
  }).join('') + '</div>';
}
/**
 * Dibuja de inmediato la forma de lo que se esta pidiendo, en vez de la palabra
 * "Cargando". La espera es la misma, pero el ojo ya tiene donde posarse y la
 * pagina no da el salto de quedarse en blanco y llenarse de golpe.
 *
 * @param {string} contenedor
 * @param {string=} forma kpis | matriz | tablero | grafico | lista (por defecto).
 */
function cargando(contenedor, forma) {
  var caja = $(contenedor);
  if (!caja) return;
  var repetir = function (html, veces) { return new Array(veces + 1).join(html); };
  var formas = {
    kpis: '<div class="eq-kpis">' + repetir('<div class="eq eq-kpi"></div>', 5) + '</div>',
    matriz: '<div class="eq-matriz">' + repetir('<div class="eq eq-celda"></div>', 8) + '</div>',
    tablero: '<div class="eq-tablero">' + repetir('<div class="eq eq-columna"></div>', 4) + '</div>',
    grafico: '<div class="eq eq-grafico"></div>',
    lista: repetir('<div class="eq eq-linea"></div>', 4)
  };
  caja.innerHTML = '<div class="esqueleto" aria-busy="true" aria-label="Cargando">' +
                   (formas[forma] || formas.lista) + '</div>';
}
function fallo(err) {
  toast(err && err.message ? err.message : String(err), true);
}

/* ================= Modal ================= */
function abrirModal(titulo, subtitulo, cuerpoHtml, alGuardar, ancho) {
  // La ventana crece solo cuando quien la abre lo pide. Un modal ancho para un
  // formulario de cuatro campos deja las etiquetas a un metro de sus casillas.
  document.querySelector('.modal').classList.toggle('ancho', !!ancho);
  $('modalTitulo').textContent = titulo;
  $('modalSub').textContent = subtitulo || '';
  $('modalCuerpo').innerHTML = cuerpoHtml;
  $('modalError').textContent = '';
  accionModal = alGuardar || null;
  $('btnGuardarModal').hidden = !alGuardar;
  $('velo').hidden = false;
}
function cerrarModal() { $('velo').hidden = true; accionModal = null; }
$('btnCerrarModal').addEventListener('click', cerrarModal);
$('velo').addEventListener('click', function (e) { if (e.target === this) cerrarModal(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') cerrarModal(); });
$('btnGuardarModal').addEventListener('click', function () {
  if (!accionModal) return;
  var boton = this;
  boton.disabled = true;
  boton.textContent = 'Guardando…';
  // La accion se llama DENTRO de la cadena de promesas, no antes de armarla.
  // Llamarla antes dejaba escapar las validaciones que lanzan de una vez
  // —"Escriba el nombre de la solicitud", "Elija la iniciativa"—: la excepcion
  // salia del manejador, la cadena nunca se armaba, y el boton se quedaba
  // bloqueado en "Guardando…" sin mostrar el motivo. Habia que cerrar la ventana
  // y volver a empezar.
  Promise.resolve().then(accionModal)
      .then(function () { cerrarModal(); })
      .catch(function (err) { $('modalError').textContent = err.message || String(err); })
      .then(function () { boton.disabled = false; boton.textContent = 'Guardar'; });
});

/* ================= Router ================= */
/**
 * Si el rol tiene un permiso. Es la misma pregunta que hace el servidor, con la
 * misma respuesta: los permisos llegan resueltos en el arranque.
 *
 * Esconder aqui es cortesia, no seguridad. Cada operacion se vuelve a
 * comprobar al guardar, porque las llamadas del navegador se pueden escribir a
 * mano y un boton escondido no detiene a nadie.
 */
function permiso(nombre) {
  return !!(CTX.permisos && CTX.permisos[nombre]);
}

/** Permiso de menu que corresponde a cada pagina. Gemelo de PERMISO_DE_PAGINA. */
var PERMISO_DE_PAGINA = {
  home: 'Ver_Home', portafolio: 'Ver_Portafolio', iniciativas: 'Ver_Iniciativas',
  gestion: 'Ver_Gestion',
  roadmap: 'Ver_Roadmap', reportes: 'Ver_Reportes', costos: 'Ver_Costos',
  informe: 'Ver_Informe', admin: 'Administrar'
};

/** Esconde del menu las pestanas que el rol no puede abrir. */
function aplicarPermisosDeMenu() {
  document.querySelectorAll('.tab').forEach(function (t) {
    t.hidden = !permiso(PERMISO_DE_PAGINA[t.dataset.pagina]);
  });
  // Botones de accion que dependen de un permiso y viven fuera de su pagina.
  if ($('btnNueva')) $('btnNueva').hidden = !permiso('Crear_Solicitud');
  if ($('btnMigrar')) $('btnMigrar').hidden = !permiso('Migrar_Solicitud');
}

/** La primera pagina que el rol si puede abrir. */
/**
 * Abre lo que pedia el enlace: ?page=gestion&id=SOL-0042 o
 * ?page=iniciativas&id=INI-004.
 *
 * Es lo que hace util al correo de un comentario: deja a la persona delante de
 * la solicitud o la iniciativa que le mencionaron, con el seguimiento a la
 * vista, en vez de en el tablero completo buscando a mano.
 *
 * Si el enlace apunta a algo que el rol no puede ver, no pasa nada: la pagina
 * ya se redirigio a la que si puede, y aqui simplemente no se abre el detalle.
 */
function abrirRegistroDelEnlace() {
  var id = (typeof REGISTRO_INICIAL === 'string' ? REGISTRO_INICIAL : '').trim();
  if (!id) return;

  if (/^SOL-/i.test(id) && permiso('Ver_Gestion')) {
    verDetalle(id);
    return;
  }
  if (/^INI-/i.test(id) && permiso('Ver_Iniciativas')) {
    // Primero se despliega la fila en Seguimiento —para que al cerrar la
    // ventana quede donde corresponde— y encima se abren los comentarios,
    // que es de donde viene quien llego por el correo.
    VISTA_INI = 'listado';
    Array.prototype.forEach.call($('vistaIni').querySelectorAll('button'), function (b) {
      b.classList.toggle('activa', b.dataset.vista === 'listado');
    });
    INI_ABIERTAS[id] = true;
    verDetalleIniciativa(id);
  }
}

function primeraPaginaPermitida() {
  for (var i = 0; i < PAGINAS.length; i++) {
    if (permiso(PERMISO_DE_PAGINA[PAGINAS[i]])) return PAGINAS[i];
  }
  return null;
}

function navegar(pagina) {
  // Un enlace guardado (?page=roadmap) puede apuntar a una pagina que el rol ya
  // no tiene: se cae a la primera que si pueda abrir, en vez de dejar la
  // pantalla en blanco.
  if (!permiso(PERMISO_DE_PAGINA[pagina])) {
    var alternativa = primeraPaginaPermitida();
    if (!alternativa) {
      $('contenido').hidden = true;
      $('avisoAccesoMotivo').textContent =
          'Su rol no tiene acceso a ninguna sección de la aplicación. ' +
          'Escriba al administrador para que le habilite lo que necesita.';
      $('avisoAcceso').hidden = false;
      return;
    }
    pagina = alternativa;
  }
  PAGINAS.forEach(function (p) { $('pg-' + p).hidden = (p !== pagina); });
  document.querySelectorAll('.tab').forEach(function (t) {
    if (t.dataset.pagina === pagina) t.setAttribute('aria-current', 'page');
    else t.removeAttribute('aria-current');
  });
  var cargadores = {
    home: cargarHome, portafolio: cargarPortafolio,
    iniciativas: cargarIniciativas, gestion: cargarGestion,
    roadmap: cargarRoadmap, reportes: cargarReportes, costos: cargarCostos,
    informe: cargarInforme, admin: cargarAdmin
  };
  if (cargadores[pagina]) cargadores[pagina]();
}
$('tabs').addEventListener('click', function (e) {
  var b = e.target.closest('.tab');
  if (b) navegar(b.dataset.pagina);
});

/* ================= Home ================= */
function cargarHome() {
  var meses = Number($('ventanaMeses').value);
  // Si ya se pidieron estos meses en esta sesion, se pinta de inmediato.
  if (DATOS.home && DATOS.home[meses]) { pintarHome(DATOS.home[meses]); return; }
  cargando('kpisPortafolio', 'kpis');
  api('getMetricasHome', meses).then(function (m) {
    DATOS.home = DATOS.home || {};
    DATOS.home[meses] = m;
    pintarHome(m);
  }).catch(fallo);
}
$('ventanaMeses').addEventListener('change', cargarHome);

/**
 * Los indicadores de lo que se rompio despues de salir a produccion (D-101).
 *
 * El numero que manda es la tasa de escape: de lo que se desplego en el periodo,
 * cuanto necesito despues una estabilizacion. Los demas explican por que.
 */
function pintarCalidadProduccion(e) {
  if (!e) return;

  var escape = e.escape.pctVersiones;
  $('kpisEstabilizacion').innerHTML = [
    kpi('Tasa de escape', escape, ' %',
        e.escape.versionesConIncidente + ' de ' + e.escape.versionesDesplegadas +
        ' versiones desplegadas necesitaron estabilización',
        escape === null ? '' : (escape <= 15 ? 'bien' : (escape <= 35 ? '' : 'mal'))),
    kpi('Estabilizaciones', e.registradas, '',
        e.criticas + ' de prioridad crítica o alta'),
    kpi('Indisponibilidad', e.indisponibilidad.horas, ' h',
        'Total ' + enHoras(e.indisponibilidad.minutosTotal) + ' · parcial ' +
        enHoras(e.indisponibilidad.minutosParcial)),
    kpi('Abiertas hoy', e.abiertas, '',
        e.sinDatosParaCerrar
          ? e.sinDatosParaCerrar + ' sin los datos para poder cerrarse'
          : 'Ninguna le falta información',
        e.abiertasCriticas ? 'mal' : '')
  ].join('');

  $('graficoCausaRaiz').innerHTML = e.pareto.length
      ? e.pareto.map(function (c) {
          return barra(c.nombre, c.cuenta, e.pareto[0].cuenta, c.cuenta + ' (' + c.pct + '%)', '');
        }).join('')
      : '<p style="color:var(--ink-muted);font-size:13px">Todavía no hay estabilizaciones con ' +
        'causa raíz registrada.</p>';

  var versiones = e.porVersion.filter(function (v) { return v.incidentes > 0; });
  $('graficoVersiones').innerHTML = versiones.length
      ? versiones.slice(0, 8).map(function (v) {
          return barra(v.etiqueta, v.incidentes, versiones[0].incidentes,
                       v.incidentes + (v.minutosCaida ? ' · ' + enHoras(v.minutosCaida) : ''),
                       v.criticas ? 'rojo' : '');
        }).join('')
      : '<p style="color:var(--ink-muted);font-size:13px">Ninguna versión ha generado ' +
        'estabilizaciones.</p>';

  var meses = e.indisponibilidad.porMes;
  $('graficoCaida').innerHTML = meses.some(function (x) { return x.minutos > 0; })
      ? columnas(meses.map(function (x) {
          return { etq: etiquetaMes(x.mes), v1: x.minutos, txt: enHoras(x.minutos) };
        }))

}

/* ================= Iniciativas ================= */
function cargarIniciativas() {
  if (DATOS.matriz) {
    prepararFiltrosIniciativas(DATOS.matriz);
    pintarIniciativas();
    return;
  }
  // El esqueleto va en el contenedor de la vista que se esta abriendo; si
  // fuera siempre el de la matriz, la vista que abre por defecto arrancaria
  // en blanco mientras llegan los datos.
  cargando(CAJA_ESQUELETO_INI[VISTA_INI] || 'matriz', 'matriz');
  unaSolaConsulta('matriz', function () { return api('getMatrizIniciativas'); }).then(function (r) {
    DATOS.matriz = r;
    prepararFiltrosIniciativas(r);
    pintarIniciativas();
  }).catch(fallo);
}

/**
 * Llena los combos de la pagina. Vive aparte de la consulta porque los datos
 * pueden llegar por la precarga en segundo plano y no solo por abrir la pagina.
 */
function prepararFiltrosIniciativas(r) {
  // Las dos listas largas se arman con lo que de verdad hay en el portafolio,
  // no con el catalogo completo: ofrecer a alguien que no es solicitante de
  // ninguna iniciativa es ofrecer un filtro que siempre devuelve vacio.
  //
  // Se rehacen en cada carga y no una sola vez, porque su contenido depende de
  // los datos: si alguien acaba de asignarse como solicitante, tiene que
  // aparecer sin recargar la pagina. Rehacer un <datalist> no toca lo que haya
  // escrito la persona, asi que no se pierde el filtro puesto.
  var todas = todasLasIniciativas();
  llenarCombo('dlIniIni', todas.map(function (i) {
    return { id: i.idProyecto, texto: i.nombre };
  }));
  var solicitantes = {};
  todas.forEach(function (i) {
    if (i.solicitanteId && i.solicitante) solicitantes[i.solicitanteId] = i.solicitante;
  });
  llenarCombo('dlSolicitanteIni', Object.keys(solicitantes).map(function (id) {
    return { id: id, texto: solicitantes[id] };
  }));

  // Los tres combos fijos salen de catalogos y no cambian con los datos, asi
  // que se arman una vez: rehacerlos borraria la opcion elegida.
  if (DATOS.filtrosIniListos) return;
  $('filtroTipoIni').innerHTML = '<option value="">Todos los tipos</option>' +
      r.tipos.map(function (t) {
        return '<option value="' + t.id + '">' + esc(t.nombre) + '</option>';
      }).join('');
  $('filtroPlataformaIni').innerHTML = '<option value="">Todas las plataformas</option>' +
      r.plataformas.map(function (pl) {
        return '<option value="' + pl.id + '">' + esc(pl.nombre) + '</option>';
      }).join('') + '<option value="__SIN__">Sin plataforma asignada</option>';
  DATOS.filtrosIniListos = true;
}

/** Todas las iniciativas del portafolio, sacadas de las celdas de la matriz. */
function todasLasIniciativas() {
  var r = DATOS.matriz;
  if (!r) return [];
  var todas = [];
  Object.keys(r.celdas).forEach(function (k) { todas = todas.concat(r.celdas[k]); });
  return todas;
}
['buscIni', 'filtroIniIni', 'filtroSolicitanteIni'].forEach(function (id) {
  $(id).addEventListener('input', pintarIniciativas);
});
$('filtroTipoIni').addEventListener('change', pintarIniciativas);
$('filtroPlataformaIni').addEventListener('change', pintarIniciativas);

/**
 * Vista activa del portafolio. Las tres leen los mismos datos y respetan los
 * mismos filtros; cambia el eje con el que se agrupan.
 *
 * Abre en "listado" (rotulada Seguimiento en pantalla) porque es la que
 * responde la pregunta de todos los dias —como va cada tema— y la unica que
 * deja abrir una iniciativa para ver sus solicitudes. La matriz y las columnas
 * por prioridad responden preguntas de planeacion, que se hacen de vez en
 * cuando, y quedan a un clic.
 */
var VISTA_INI = 'listado';

/** Donde va el esqueleto de carga de cada vista. */
var CAJA_ESQUELETO_INI = { matriz: 'matriz', prioridad: 'prioridades', listado: 'listadoIni' };

$('vistaIni').addEventListener('click', function (e) {
  var boton = e.target.closest('button[data-vista]');
  if (!boton || boton.dataset.vista === VISTA_INI) return;
  VISTA_INI = boton.dataset.vista;
  Array.prototype.forEach.call(this.querySelectorAll('button'), function (b) {
    b.classList.toggle('activa', b.dataset.vista === VISTA_INI);
  });
  pintarIniciativas();
});

function pintarIniciativas() {
  var vista = VISTA_INI;
  [['vistaMatriz', 'matriz'], ['prioridades', 'prioridad'], ['vistaListado', 'listado'],
   ['subMatriz', 'matriz'], ['subPrioridad', 'prioridad'], ['subListado', 'listado'],
   ['notaMatriz', 'matriz'], ['notaPrioridad', 'prioridad'], ['notaListado', 'listado']
  ].forEach(function (par) {
    $(par[0]).hidden = (par[1] !== vista);
  });
  // La caja de "sin clasificar" la llena la matriz. En las otras vistas esas
  // iniciativas ya aparecen entre las demas, asi que se recoge.
  if (vista !== 'matriz') $('sinClasificar').hidden = true;

  if (vista === 'matriz') pintarMatriz();
  else if (vista === 'prioridad') pintarPorPrioridad();
  else pintarListadoIniciativas();
}

/**
 * Todas las iniciativas del portafolio en una sola tabla.
 *
 * La matriz responde donde estamos invirtiendo y las columnas por prioridad
 * que es lo mas urgente. Esta vista responde la pregunta mas simple de todas,
 * y la que ninguna de las dos contesta bien: cuales son, todas, en una lista
 * que se pueda recorrer de arriba abajo y buscar con los ojos.

                  '% real', '% esperado', 'Prioridad', 'Tipo de iniciativa', 'Plataforma'];

  $('listadoIni').innerHTML =
    '<thead><tr><th style="width:26px"></th>' + columnas.map(function (c) {
      return '<th>' + esc(c) + '</th>';
    }).join('') + '</tr></thead><tbody>' +
    (visibles.length
      ? visibles.map(function (i) {
          var estado = nombreDeCatalogo(r.estados, i.estado);
          var abierta = INI_ABIERTAS[i.idProyecto];
          return '<tr class="ini-fila' + (abierta ? ' ini-abierta' : '') +
              '" data-ini="' + esc(i.idProyecto) + '" role="button" tabindex="0"' +
              ' aria-expanded="' + (abierta ? 'true' : 'false') + '">' +
            '<td class="ini-flecha">' + (abierta ? '&#9662;' : '&#9656;') + '</td>' +
            '<td style="font-weight:600">' + esc(i.nombre) +
              botonComentarios(i.idProyecto, '') +
              (CTX.puedeEditarIniciativa
                ? '<button class="lapiz" title="Editar iniciativa" data-editar-ini="' +
                  esc(i.idProyecto) + '">&#9998;</button>'
                : '') + '</td>' +
            '<td>' + (i.estado
                       ? '<span class="badge ' + (CLASE_ESTADO_INI[i.estado] || 'e-cancelada') +
                         '">' + esc(estado) + '</span>'
                       : sinDato('sin estado')) + '</td>' +
            '<td>' + (i.solicitante ? esc(i.solicitante) : sinDato('sin asignar')) + '</td>' +
            '<td>' + (i.bo ? esc(i.bo) : sinDato('sin asignar')) + '</td>' +
            '<td>' + (i.po ? esc(i.po) : sinDato('sin asignar')) + '</td>' +
            '<td class="num">' + (i.fechaInicio ? esc(fecha(i.fechaInicio))
                                                : sinDato('sin fecha')) + '</td>' +
            '<td class="num">' + (i.fechaFinPlaneada ? esc(fecha(i.fechaFinPlaneada))
                                                     : sinDato('sin fecha')) + '</td>' +
            '<td class="num">' + celdaAvanceReal(i) + '</td>' +
            '<td class="num">' + celdaAvanceEsperado(i) + '</td>' +
            '<td>' + (i.prioridad
                       ? '<span class="badge ' + (PRIORIDAD_CLASE[i.prioridad] || 'p-baja') +
                         '">' + esc(i.prioridadNombre) + '</span>'
                       : sinDato('sin prioridad')) + '</td>' +
            '<td>' + (i.tipo ? esc(nombreDeCatalogo(r.tipos, i.tipo))
                             : sinDato('sin tipo')) + '</td>' +

          '</tr>' +
          (abierta
            ? '<tr class="ini-detalle"><td></td><td colspan="' + columnas.length +
              '" style="padding-top:0">' + detalleIniciativa(i.idProyecto) + '</td></tr>'
            : '');
        }).join('')
      : '<tr><td colspan="' + (columnas.length + 1) + '" style="color:var(--ink-faint);' +
        'text-align:center">Ninguna iniciativa coincide con los filtros.</td></tr>') +

/** Iniciativas desplegadas en el listado, por ID. */
var INI_ABIERTAS = {};

$('listadoIni').addEventListener('click', function (e) {
  var globo = e.target.closest('[data-comentar-ini]');
  if (globo) { verDetalleIniciativa(globo.dataset.comentarIni); return; }
  var lapiz = e.target.closest('[data-editar-ini]');
  if (lapiz) { formularioIniciativa(lapiz.dataset.editarIni); return; }
  var fila = e.target.closest('.ini-fila[data-ini]');
  if (fila) alternarIniciativa(fila.dataset.ini);
});
$('listadoIni').addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  var fila = e.target.closest('.ini-fila[data-ini]');
  if (!fila) return;
  e.preventDefault();
  alternarIniciativa(fila.dataset.ini);
});

function alternarIniciativa(idProyecto) {
  if (INI_ABIERTAS[idProyecto]) {
    delete INI_ABIERTAS[idProyecto];
    pintarListadoIniciativas();
    return;
  }
  INI_ABIERTAS[idProyecto] = true;

  // Las solicitudes ya viajan al navegador para el tablero de Gestion, y la
  // precarga en segundo plano suele haberlas traido. Si todavia no, se piden
  // una sola vez y de ahi en adelante desplegar es instantaneo.
  if (DATOS.kanban) { pintarListadoIniciativas(); return; }
  pintarListadoIniciativas();
  api('getDatosKanban', {}).then(function (r) {
    if (!r) return;
    DATOS.kanban = r;
    prepararFiltrosKanban(r);
    pintarListadoIniciativas();
  }).catch(fallo);
}

/**
 * Las actividades de una iniciativa, con su avance.
 *
 * Responde "como va cada tema" sin salir del listado: hasta donde llego cada
 * actividad, si esta trabada y cuando se espera que salga, que es la fecha
 * planeada de la version que tiene asignada.
 *
 * Aqui se llaman actividades y no solicitudes a proposito. Desde la iniciativa
 * son los renglones de su plan —lo que hay que hacer para sacarla adelante— y
 * dentro caben tanto las de fabrica como las tareas. "Solicitud" es como se
 * llaman cuando se piden y se gestionan, que es el lenguaje de Gestion.
 */
function detalleIniciativa(idProyecto) {
  if (!DATOS.kanban) {
    return '<div class="sol-cab">Cargando las actividades…</div>';
  }

  var actividades = DATOS.kanban.solicitudes.filter(function (s) {
    return s.ID_Proyecto === idProyecto;
  }).sort(ordenDeAtencion);

  if (!actividades.length) {
    return '<div class="sol-cab">Esta iniciativa todavía no tiene actividades.</div>';
  }

  var bloqueadas = 0, vencidas = 0;
  actividades.forEach(function (s) {
    if (estaBloqueada(s)) bloqueadas++;
    else if (estaVencida(s)) vencidas++;
  });

  var estabilizaciones = actividades.filter(esEstabilizacion).length;
  var delPlan = actividades.length - estabilizaciones;
  var resumen = delPlan + (delPlan === 1 ? ' actividad' : ' actividades') +
      (estabilizaciones ? ' · ' + estabilizaciones +
        (estabilizaciones === 1 ? ' estabilización' : ' estabilizaciones') : '') +
      (bloqueadas ? ' · ' + bloqueadas + (bloqueadas === 1 ? ' bloqueada' : ' bloqueadas') : '') +
      (vencidas ? ' · ' + vencidas + (vencidas === 1 ? ' vencida' : ' vencidas') + ' en su fase' : '');

  // Las dos clases van separadas porque se leen distinto: una de fabrica se
  // mira contra el embudo y una tarea contra su estado. Mezcladas, las barras
  // de tres y de ocho casillas se alternaban fila a fila y costaba ver de que
  // se estaba hablando. El grupo se rotula aunque sea el unico: la diferencia
  // entre tres y ocho casillas es sutil y no tiene por que adivinarse.
  var grupos = [
    { titulo: 'Gestión de fábrica', lista: actividades.filter(esDeFabrica) },
    { titulo: 'Tareas', lista: actividades.filter(esTarea) },
    // Las estabilizaciones van al final y aparte: no son alcance planeado de la
    // iniciativa —no cuentan en su avance— sino lo que hubo que atender porque
    // algo que ya estaba en produccion fallo (D-101).
    { titulo: 'Estabilización', lista: actividades.filter(esEstabilizacion) }
  ];

  return '<div class="sol-cab">' + esc(resumen) + '</div>' +
    grupos.filter(function (g) { return g.lista.length; }).map(function (g) {
      return '<div class="sol-grupo">' + esc(g.titulo) +
        '<span class="sol-grupo-n">' + g.lista.length + '</span></div>' +
        g.lista.map(filaSolicitud).join('');
    }).join('');
}

function estaBloqueada(s) {
  return String(s.Tiene_Bloqueo).toUpperCase().indexOf('S') === 0;
}
function estaVencida(s) {
  return s.Sla_Fase && s.Dias_En_Fase !== null && s.Dias_En_Fase > s.Sla_Fase;
}

/**
 * Las casillas de avance de una actividad.
 *
 * Una de fabrica lleva una casilla por fase del embudo, llenas hasta donde va.
 * Una tarea no recorre el embudo (D-79), asi que lleva tres —por iniciar, en
 * progreso, terminada—, que son los tres momentos que de verdad tiene. Pintarle
 * ocho casillas de las que seis nunca se llenarian la haria parecer atrasada
 * siempre.
 *
 * Una tarea bloqueada se cuenta como en progreso y se pinta en rojo: empezo y
 * esta trabada, que es distinto de no haber empezado.
 */
function casillasDeAvance(s, bloqueada, vencida) {
  var total, indice;
  if (!esDeFabrica(s)) {
    // Tres casillas: por iniciar, en progreso, terminada. Es lo que tienen tanto
    // una tarea como una estabilizacion, y pintarles ocho de las que seis nunca
    // se llenarian las haria parecer atrasadas siempre.
    total = 3;
    indice = { 'EST-01': 1, 'EST-02': 2, 'EST-03': 2, 'EST-04': 2, 'EST-06': 3 }[s.Estado_Actual] || 0;
  } else {
    total = CAT.fases.length;
    indice = 0;
    CAT.fases.forEach(function (f, i) { if (f.id === s.Fase_Actual) indice = i + 1; });
  }

  var casillas = '';
  for (var i = 1; i <= total; i++) {
    if (i < indice) casillas += '<i class="hecha"></i>';
    else if (i === indice) {
      casillas += '<i class="actual' + (bloqueada ? ' mal' : (vencida ? ' ojo' : '')) + '"></i>';
    } else casillas += '<i></i>';
  }
  return '<span class="fases' + (esDeFabrica(s) ? '' : ' de-tarea') + '">' + casillas + '</span>';
}

/** Una actividad dentro del desplegable de su iniciativa. */
function filaSolicitud(s) {
  var bloqueada = estaBloqueada(s);
  var vencida = !bloqueada && estaVencida(s);
  var alerta = bloqueada ? 'bloqueada' : (vencida ? 'vencida' : '');
  var sinFase = !esDeFabrica(s);

  return '<div class="sol ' + alerta + '">' +
    '<span class="sol-id">' + esc(s.ID_Solicitud) +
      '<span class="sol-tipo">' + esc(nombreDeCatalogo(CAT.tipos, s.Tipo_Solicitud) ||
        'sin tipo') + '</span></span>' +
    '<span class="sol-nombre">' + esc(s.Nombre_Solicitud) +
      (bloqueada
        ? '<div class="causal">&#9888;&#65039; ' +
          esc(nombreDeCatalogo(CAT.causales, s.Causal_Bloqueo)) +
          (s.Observacion_Bloqueo ? ' · ' + esc(s.Observacion_Bloqueo) : '') + '</div>'
        : '') +
      (vencida
        ? '<div class="causal ambar">' + s.Dias_En_Fase + ' días hábiles en esta fase, ' +
          'el objetivo son ' + s.Sla_Fase + '</div>'
        : '') +
    '</span>' +
    casillasDeAvance(s, bloqueada, vencida) +
    // Lo que no recorre el embudo no tiene fase que mostrar: sin esto quedaba un
    // " · " suelto delante del estado, como si faltara un dato.
    '<span class="sol-fase">' + (sinFase ? '' : esc(nombreFase(s.Fase_Actual)) + ' · ') +
      '<span class="badge ' + (CLASE_ESTADO[s.Estado_Actual] || 'e-por-iniciar') + '">' +
      esc(nombreEstado(s.Estado_Actual)) + '</span></span>' +
    '<span class="sol-quien"><span class="sol-rot">Responsable</span>' +
      (s.Nombre_Responsable ? esc(s.Nombre_Responsable) : sinAsignarTexto()) + '</span>' +
    '<span class="sol-ver">' + versionDeSolicitud(s) + '</span>' +
  '</div>';
}

/**
 * Los enlaces de una solicitud, en su propia tarjeta del tablero.
 *
 * Son dos, y cada uno lleva a un sitio distinto: 📄 al documento donde esta
 * escrito el requerimiento, y 🎫 al issue de Taiga, que es donde la fabrica lo
 * esta construyendo. Antes iban en el correo de creacion; alli envejecian,
 * porque el correo se recibe una vez y despues hay que buscarlo, mientras que
 * la tarjeta se tiene delante cada vez que se mira el tablero.
 *
 * Cada uno aparece solo si esa solicitud lo tiene: una tarjeta sin enlaces no
 * deja huecos, y con los dos se ven los dos.
 *
 * Se marcan con data-enlace para que el manejador del tablero los deje pasar al
 * navegador en vez de abrir el detalle de la solicitud por detras.
 *
 * La carpeta de Drive no esta aqui: es de la iniciativa (D-78), no de cada una
 * de sus solicitudes.
 */
function enlacesDeSolicitud(s) {
  var enlaces = [
    { url: s.Doc_Requerimiento_URL, icono: '&#128196;', titulo: 'Documento de requerimiento' },
    { url: s.Link_Taiga, icono: '&#127915;', titulo: 'Issue en Taiga' }
  ].filter(function (e) { return e.url; });

  if (!enlaces.length) return '';
  return '<span class="t-links">' + enlaces.map(function (e) {
    return '<a class="t-link" data-enlace href="' + esc(e.url) + '" ' +
      'target="_blank" rel="noopener" title="' + esc(e.titulo) + '" ' +
      'aria-label="' + esc(e.titulo) + '">' + e.icono + '</a>';
  }).join('') + '</span>';
}

/**
 * La fecha compromiso de una tarea, en rojo si ya paso.
 *
 * Es el reemplazo del SLA por fase: una tarea no tiene embudo contra el cual
 * medirse, asi que sin esta fecha no habria forma de que llegara tarde.
 */
function compromisoDeTarea(s) {
  if (!s.Fecha_Compromiso) return '';
  var hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  var f = new Date(s.Fecha_Compromiso);
  var cerrada = s.Estado_Actual === 'EST-06' || s.Estado_Actual === 'EST-05';
  var vencida = !cerrada && !isNaN(f.getTime()) && f < hoy;
  return '<span class="t-compromiso' + (vencida ? ' vencida' : '') + '" ' +
         'title="Fecha compromiso">' + esc(fecha(s.Fecha_Compromiso)) + '</span>';
}

function sinAsignarTexto() {
  return '<span style="color:var(--ink-faint)">sin asignar</span>';
}

/**
 * Version de la solicitud y cuando se espera que salga. La fecha sale del
 * roadmap: es el unico dato de plan que existe hoy, y responde la pregunta sin
 * pedirle al equipo que registre fechas una por una.
 */
function versionDeSolicitud(s) {
  // La plataforma acompana a la version porque una misma version —v2.4.0— la
  // tienen varias plataformas: el numero solo no dice de cual se habla.
  var plataforma = s.Nombre_Plataforma
      ? '<span class="sol-plat">' + esc(s.Nombre_Plataforma) + '</span>' : '';

  if (!s.Version_Semantica) {
    return '<b style="color:var(--ink-faint)">—</b>' + plataforma + '<br>' +
           '<span style="color:var(--ink-faint)">sin versión</span>';
  }
  var v = null;
  (DATOS.kanban.versiones || []).forEach(function (x) {
    if (x.valor === s.Version_Semantica &&
        (!x.plataformaId || x.plataformaId === s.Plataforma_ID)) v = x;
  });

  var pie = 'sin fecha en el roadmap';
  if (v && v.fechaReal) pie = 'salió ' + fecha(v.fechaReal);
  else if (v && v.fechaPlaneada) pie = 'planeada ' + fecha(v.fechaPlaneada);

  return '<b>' + esc(s.Version_Semantica) + '</b>' + plataforma + '<br>' + esc(pie);
}

/**
 * Arma el predicado de los filtros de la pagina. Lo comparten las dos vistas:
 * lo que se ve en una es exactamente lo que se ve en la otra, reagrupado.
 */
function filtroIniciativas() {
  var q = $('buscIni').value.trim().toLowerCase();
  var iniciativa = valorCombo('filtroIniIni', 'dlIniIni');
  var solicitante = valorCombo('filtroSolicitanteIni', 'dlSolicitanteIni');
  var tipo = $('filtroTipoIni').value;
  var plataforma = $('filtroPlataformaIni').value;

  return function (i) {
    if (iniciativa && i.idProyecto !== iniciativa) return false;
    if (solicitante && i.solicitanteId !== solicitante) return false;
    if (tipo && i.tipo !== tipo) return false;
    if (plataforma === '__SIN__') {
      if (i.plataformaId) return false;
    } else if (plataforma && i.plataformaId !== plataforma) {
      return false;
    }
    // El campo abierto busca por todo lo que se ve en la fila, no solo por el
    // nombre: quien escribe un apellido o una plataforma espera encontrarla.
    // El estado entra aqui desde que dejo de tener combo propio: se sigue
    // viendo en la tabla, y sin esto seria el unico dato a la vista por el que
    // no se pudiera buscar.
    if (q) {
      var pajar = [i.idProyecto, i.nombre, i.solicitante, i.bo, i.po, i.plataforma,
                   nombreDeCatalogo((DATOS.matriz || {}).estados, i.estado)]
          .join(' ').toLowerCase();
      if (pajar.indexOf(q) === -1) return false;
    }
    return true;
  };
}

/**
 * Orden del listado: por fecha de inicio ascendente, y a igualdad de inicio por
 * la de fin. Lo que no tiene fecha va al final y no al principio: una iniciativa
 * sin fechas no es la mas proxima, es la que no se ha planeado.
 */
/**
 * El avance real de la iniciativa, con una barra y su color.
 *
 * El color no lo da el porcentaje solo sino la comparacion con lo esperado:
 * 30% puede ser excelente en marzo y pesimo en noviembre. Verde si va igual o
 * mejor que el plan, ambar si va hasta diez puntos por debajo, rojo si va mas.
 * Sin fechas planeadas no hay con que comparar, y la barra queda neutra.
 */
function celdaAvanceReal(i) {
  if (i.avanceReal === null || i.avanceReal === undefined) {
    return '<span style="color:var(--ink-faint)" title="La iniciativa todavía no ' +
           'tiene actividades relacionadas">sin actividades</span>';
  }
  var clase = 'av-neutro';
  var ayuda = 'Promedio del avance de sus ' + i.actividades +
              (i.actividades === 1 ? ' actividad' : ' actividades');
  if (i.avanceEsperado !== null && i.avanceEsperado !== undefined) {
    var brecha = i.avanceReal - i.avanceEsperado;
    clase = brecha >= 0 ? 'av-bien' : (brecha >= -10 ? 'av-ojo' : 'av-mal');
    ayuda += '. ' + (brecha >= 0
        ? 'Va ' + formatoPuntos(brecha) + ' por encima de lo esperado'
        : 'Va ' + formatoPuntos(-brecha) + ' por debajo de lo esperado');
  }
  return '<span class="av ' + clase + '" title="' + esc(ayuda) + '">' +
         '<span class="av-barra"><i style="width:' + Math.max(0, Math.min(100, i.avanceReal)) +
         '%"></i></span>' + formatoPorcentaje(i.avanceReal) + '</span>';
}

/** El avance que la iniciativa deberia llevar hoy segun sus fechas. */
function celdaAvanceEsperado(i) {
  if (i.avanceEsperado === null || i.avanceEsperado === undefined) {
    return '<span style="color:var(--ink-faint)" title="Necesita fecha de inicio y ' +
           'fecha fin estimada para poder calcularlo">sin fechas</span>';
  }
  return '<span title="Días hábiles corridos desde el inicio sobre el total planeado">' +
         formatoPorcentaje(i.avanceEsperado) + '</span>';
}

/** 42.5 -> "42,5%". Un entero se muestra sin decimales. */
function formatoPorcentaje(n) {
  var v = Math.round(n * 10) / 10;
  return (v % 1 === 0 ? String(v) : String(v).replace('.', ',')) + '%';
}

/** La diferencia entre dos porcentajes se lee en puntos, no en por ciento. */
function formatoPuntos(n) {
  var v = Math.round(n * 10) / 10;
  return (v % 1 === 0 ? String(v) : String(v).replace('.', ',')) + ' puntos';
}

/**
 * La lupa que abre el detalle de una iniciativa.
 *
 * A diferencia del lapiz, la ve todo el mundo: ver no es editar. Dentro del
 * detalle van los datos, el avance, el enlace a la documentacion y la
 * trazabilidad completa de los comentarios.
 */
function botonComentarios(idProyecto, clases) {
  return '<button class="lapiz' + clases + '" title="Ver el detalle de la iniciativa" ' +
         'data-comentar-ini="' + esc(idProyecto) + '">&#128269;</button>';
}

function ordenPorFecha(a, b) {
  var ia = marcaDeTiempo(a.fechaInicio), ib = marcaDeTiempo(b.fechaInicio);
  if (ia !== ib) return ia - ib;
  var fa = marcaDeTiempo(a.fechaFinPlaneada), fb = marcaDeTiempo(b.fechaFinPlaneada);
  if (fa !== fb) return fa - fb;
  return String(a.nombre).localeCompare(String(b.nombre), 'es');
}

/** Fecha comparable; lo que no tenga fecha se va al final. */
function marcaDeTiempo(valor) {
  if (!valor) return Infinity;
  var d = new Date(valor);
  return isNaN(d.getTime()) ? Infinity : d.getTime();
}

function ordenPorPrioridad(a, b) {
  var pa = pesoPrioridad_(a.prioridad), pb = pesoPrioridad_(b.prioridad);
  if (pa !== pb) return pa - pb;
  return String(a.nombre).localeCompare(String(b.nombre), 'es');
}

function pintarMatriz() {
  var r = DATOS.matriz;
  if (!r) return;
  var pasa = filtroIniciativas();
  var cont = $('matriz');

  // Filas: lineas estrategicas de negocio. Columnas: verticales de producto.
  // Las celdas se indexan siempre como "vertical|LEN", que es como las arma el
  // backend.
  var filas = r.lineas;
  var columnas = r.verticales;

  // Una columna extra a la derecha y una fila extra abajo para los totales.
  cont.style.gridTemplateColumns = '150px repeat(' + columnas.length + ',1fr) 96px';

  function filtrar(lista) {
    return (lista || []).filter(pasa);
  }

  // Se resuelve cada celda una sola vez y de ahi salen los totales: asi las
  // sumas siempre corresponden a lo que se esta viendo con los filtros puestos.
  var porCelda = {};
  var totalFila = {}, totalColumna = {}, granTotal = 0;
  filas.forEach(function (f) {
    totalFila[f.id] = 0;
    columnas.forEach(function (c) {
      if (totalColumna[c.id] === undefined) totalColumna[c.id] = 0;
      var items = filtrar(r.celdas[c.id + '|' + f.id]).sort(ordenPorPrioridad);
      porCelda[f.id + '>' + c.id] = items;
      totalFila[f.id] += items.length;
      totalColumna[c.id] += items.length;
      granTotal += items.length;
    });
  });

  function celdaTotal(valor, etiqueta, clase) {
    return '<div class="mz-total' + (clase ? ' ' + clase : '') +
           (valor === 0 ? ' cero' : '') + '">' + valor +
           '<small>' + esc(etiqueta) + '</small></div>';
  }

  var html = '<div class="mz-cab esquina">LEN \\ Vertical</div>';
  columnas.forEach(function (c) { html += '<div class="mz-cab">' + esc(c.nombre) + '</div>'; });
  html += '<div class="mz-cab">Total</div>';

  filas.forEach(function (f) {
    html += '<div class="mz-fila">' + esc(f.nombre) + '</div>';
    columnas.forEach(function (c) {
      var items = porCelda[f.id + '>' + c.id];
      html += '<div class="mz-celda' + (items.length ? '' : ' vacia-celda') + '">' +
              (items.length > 3 ? '<div class="mz-conteo">' + items.length + ' iniciativas · desplace</div>' : '') +
              items.map(function (i) { return tarjetaIniciativa(i); }).join('') + '</div>';
    });
    html += celdaTotal(totalFila[f.id], 'en la LEN', '');
  });

  // Fila de cierre: total por vertical y total general.
  html += '<div class="mz-fila">Total</div>';
  columnas.forEach(function (c) {
    html += celdaTotal(totalColumna[c.id], 'en la vertical', '');
  });
  html += celdaTotal(granTotal, 'clasificadas', 'general');

  cont.innerHTML = html;

  var sueltas = [];
  Object.keys(r.celdas).forEach(function (k) {
    var p = k.split('|');
    if (p[0].indexOf('VER-') !== 0 || p[1].indexOf('LEN-') !== 0) {
      sueltas = sueltas.concat(filtrar(r.celdas[k]));
    }
  });
  var caja = $('sinClasificar');
  // Solo tiene sentido en la matriz: en la vista por prioridad estas mismas
  // iniciativas ya aparecen en su columna, con LEN y vertical en la tarjeta.
  caja.innerHTML = sueltas.length
      ? '<h3>Sin clasificar · ' + sueltas.length + '</h3>' +
        '<p class="nota" style="margin:0 0 10px">Les falta línea estratégica o vertical en la hoja de iniciativas.</p>' +
        '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px">' +
        sueltas.sort(ordenPorPrioridad)
               .map(function (i) { return tarjetaIniciativa(i); }).join('') + '</div>'
      : '';
  caja.hidden = !sueltas.length;
}

/**
 * Portafolio en columnas por prioridad: critica, alta, media y baja.
 *
 * La matriz responde "en que cruce de LEN y vertical estamos invirtiendo"; esta
 * vista responde "que es lo mas urgente", que es otra conversacion. Por eso
 * aqui entran tambien las iniciativas sin LEN o sin vertical: en la matriz no
 * tienen celda, pero una iniciativa critica sin clasificar sigue siendo
 * critica.
 */
function pintarPorPrioridad() {
  var r = DATOS.matriz;
  if (!r) return;
  var pasa = filtroIniciativas();

  var todas = [];
  Object.keys(r.celdas).forEach(function (k) { todas = todas.concat(r.celdas[k]); });
  var visibles = todas.filter(pasa);

  var columnas = r.prioridades.slice().sort(function (a, b) {
    return pesoPrioridad_(a.id) - pesoPrioridad_(b.id);
  });

  var grupos = {};
  columnas.forEach(function (p) { grupos[p.id] = []; });
  var sinPrioridad = [];
  visibles.forEach(function (i) {
    if (grupos[i.prioridad]) grupos[i.prioridad].push(i);
    else sinPrioridad.push(i);
  });

  var porNombre = function (a, b) {
    return String(a.nombre).localeCompare(String(b.nombre), 'es');
  };

  function columna(id, nombre, lista) {
    lista.sort(porNombre);
    return '<div class="pr-col' + (lista.length ? '' : ' vacia') + '">' +
      '<div class="pr-cab">' +
        '<span class="chip ' + (PRIORIDAD_CLASE[id] || 'p-baja') + '">' + esc(nombre) + '</span>' +
        '<span class="cuenta">' + lista.length + '</span>' +
      '</div>' +
      (lista.length
        ? lista.map(function (i) { return tarjetaIniciativa(i, true); }).join('')
        : '<p class="pr-vacia">Ninguna con este filtro.</p>') +
    '</div>';
  }

  var html = columnas.map(function (p) {
    return columna(p.id, p.nombre, grupos[p.id]);
  }).join('');

  // La columna de las que no tienen prioridad solo aparece si hay alguna: no
  // tiene sentido mostrar un hueco permanente por un dato que puede estar bien.
  if (sinPrioridad.length) {
    html += columna('', 'Sin prioridad', sinPrioridad);
  }

  $('prioridades').innerHTML = html;
}

/** Peso de orden de una prioridad; lo desconocido va al final. */
function pesoPrioridad_(id) {
  return PESO_PRIORIDAD[id] === undefined ? 9 : PESO_PRIORIDAD[id];
}

/**
 * @param {!Object} i Iniciativa.
 * @param {boolean=} conClasificacion Muestra LEN y vertical en la tarjeta. En
 *     la matriz sobran, porque la posicion de la tarjeta ya las dice.
 */
function tarjetaIniciativa(i, conClasificacion) {
  var nombreEst = nombreDeCatalogo(DATOS.matriz.estados, i.estado) || 'Sin estado';
  var clase = CLASE_ESTADO_INI[i.estado] || 'e-cancelada';
  var franja = FRANJA_ESTADO_INI[i.estado] || '';
  var tipo = nombreDeCatalogo(DATOS.matriz.tipos, i.tipo);

  var sinAsignar = function (texto) {
    return '<span style="color:var(--ink-faint)">' + texto + '</span>';
  };

  var clasificacion = conClasificacion
      ? '<div class="clasif">' +
        '<span class="chip c-len">' +
        esc(nombreDeCatalogo(DATOS.matriz.lineas, i.lenId) || 'Sin LEN') + '</span>' +
        '<span class="chip c-vertical">' +
        esc(nombreDeCatalogo(DATOS.matriz.verticales, i.verticalId) || 'Sin vertical') + '</span>' +
        '</div>'
      : '';

  var fechas = (i.fechaInicio || i.fechaFinPlaneada)
      ? '<div class="fechas">' +
        (i.fechaInicio ? '<span>Inicio ' + esc(fecha(i.fechaInicio)) + '</span>' : '') +
        (i.fechaFinPlaneada ? '<span>Fin ' + esc(fecha(i.fechaFinPlaneada)) + '</span>' : '') + '</div>'
      : '<div class="fechas"><span>Sin fechas registradas</span></div>';

  return '<article class="ini ' + franja + (i.prioridad === 'PRI-01' ? ' critica' : '') + '">' +
    '<h4>' + esc(i.nombre) +
      (CTX.puedeEditarIniciativa
        ? '<button class="lapiz ini-lapiz" title="Editar iniciativa" data-editar-ini="' +
          esc(i.idProyecto) + '">&#9998;</button>'
        : '') +
      botonComentarios(i.idProyecto, ' ini-lapiz') + '</h4>' +
    '<div class="meta">' +
      '<span class="badge ' + clase + '">' + esc(nombreEst) + '</span>' +
      (i.prioridadNombre
        ? '<span class="chip ' + (PRIORIDAD_CLASE[i.prioridad] || 'p-baja') + '">' +
          esc(i.prioridadNombre) + '</span>'
        : '') +
      (tipo ? '<span class="chip c-tipo">' + esc(tipo) + '</span>' : '') +
    '</div>' +
    '<div class="personas">' +
      '<span><b>BO</b> ' + (i.bo ? esc(i.bo) : sinAsignar('sin asignar')) + '</span>' +
      '<span><b>PO</b> ' + (i.po ? esc(i.po) : sinAsignar('sin asignar')) + '</span>' +
    '</div>' +
    '<div class="meta">' +
      '<span class="act">' + i.actividades + ' act.' +
        (i.actividadesAbiertas ? ' · ' + i.actividadesAbiertas +
          (i.actividadesAbiertas === 1 ? ' abierta' : ' abiertas') : '') + '</span>' +
      '<span class="app">' + (i.plataforma ? esc(i.plataforma) : sinAsignar('sin plataforma')) + '</span>' +
    '</div>' + fechas + clasificacion +
  '</article>';
}

/* ================= Gestion (Kanban) ================= */
function cargarGestion(forzar) {
  // Se traen todas las actividades una sola vez y el filtrado ocurre en el
  // navegador: asi la busqueda predictiva responde sin esperar al servidor.
  if (!forzar && DATOS.kanban) { pintarKanban(); return; }
  // Si ya hay un tablero pintado se deja a la vista mientras llegan los datos
  // nuevos. Vaciarlo para mostrar el esqueleto dejaba la pantalla en blanco
  // varios segundos justo despues de que alguien movio una tarjeta, que es
  // cuando mas se nota.
  if (!$('kanban').children.length) cargando('kanban', 'tablero');
  // Sin forzar se engancha a la consulta que la precarga pudo haber lanzado ya.
  // Forzando no: despues de una escritura hay que traer los datos nuevos, y una
  // consulta que salio antes del cambio traeria los viejos.
  var pedir = function () { return api('getDatosKanban', {}); };
  (forzar ? pedir() : unaSolaConsulta('kanban', pedir)).then(function (r) {
    DATOS.kanban = r;
    prepararFiltrosKanban(r);
    pintarKanban();
  }).catch(fallo);
}

/** Catalogos de los filtros, en el orden pedido y alfabeticamente. */
function prepararFiltrosKanban(r) {
  if (DATOS.filtrosListos) return;

  var proyectoPorId = {};
  r.proyectos.forEach(function (p) { proyectoPorId[p.ID_Proyecto] = p; });
  DATOS.proyectoPorId = proyectoPorId;

  llenarCombo('dlProyecto', r.proyectos.map(function (p) {
    return { id: p.ID_Proyecto, texto: p.Nombre_Proyecto };
  }));
  llenarCombo('dlPlataforma', r.plataformas.map(function (p) {
    return { id: p.id, texto: p.nombre };
  }));
  llenarCombo('dlSolicitante', r.usuarios.map(function (u) {
    return { id: u.ID_Usuario, texto: u.Nombre_Completo };
  }));
  llenarCombo('dlResponsable', r.usuarios.map(function (u) {
    return { id: u.ID_Usuario, texto: u.Nombre_Completo };
  }));

  DATOS.filtrosListos = true;
}

/**
 * Llena una lista predictiva y guarda la equivalencia texto -> identificador.
 *
 * Las opciones quedan en orden alfabetico (con localeCompare en espanol, para
 * que las tildes y la n con virgulilla caigan donde uno las busca y no al final).
 *
 * Si dos opciones se llaman igual —dos iniciativas con el mismo nombre, dos
 * personas homonimas— la segunda lleva su codigo entre parentesis. Sin eso, el
 * texto escrito apuntaria siempre a una de las dos y la otra seria inalcanzable
 * sin que nada lo advirtiera.
 */
var EQUIVALENCIAS = {};
function llenarCombo(idLista, opciones) {
  var ordenadas = opciones.slice().sort(function (a, b) {
    return String(a.texto).localeCompare(String(b.texto), 'es');
  });

  var vistos = {};
  var etiquetas = ordenadas.map(function (o) {
    var texto = String(o.texto || o.id);
    var clave = texto.toLowerCase();
    if (vistos[clave]) texto = texto + ' (' + o.id + ')';
    vistos[clave] = true;
    return { id: o.id, texto: texto };
  });

  EQUIVALENCIAS[idLista] = {};
  etiquetas.forEach(function (o) {
    EQUIVALENCIAS[idLista][o.texto.toLowerCase()] = o.id;
  });
  $(idLista).innerHTML = etiquetas.map(function (o) {
    return '<option value="' + esc(o.texto) + '"></option>';
  }).join('');
}

/**
 * Lee un combo: devuelve el identificador elegido, '' si esta vacio, o null si
 * lo escrito no corresponde a ninguna opcion.
 */
function valorCombo(idCampo, idLista) {
  var campo = $(idCampo);
  var texto = campo.value.trim().toLowerCase();
  if (!texto) { campo.classList.remove('sin-coincidencia'); return ''; }
  var id = EQUIVALENCIAS[idLista] ? EQUIVALENCIAS[idLista][texto] : undefined;
  campo.classList.toggle('sin-coincidencia', id === undefined);
  return id === undefined ? null : id;
}

/** Aplica todos los filtros sobre las actividades ya cargadas. */
function solicitudesFiltradas() {
  var r = DATOS.kanban;
  var proyecto = valorCombo('fProyecto', 'dlProyecto');
  var plataforma = valorCombo('fPlataforma', 'dlPlataforma');
  var solicitante = valorCombo('fSolicitante', 'dlSolicitante');
  var responsable = valorCombo('fResponsable', 'dlResponsable');
  var texto = $('fTexto').value.trim().toLowerCase();

  return r.solicitudes.filter(function (s) {
    if (proyecto && s.ID_Proyecto !== proyecto) return false;
    if (plataforma && s.Plataforma_ID !== plataforma) return false;
    if (solicitante && s.Solicitante_ID !== solicitante) return false;
    if (responsable && s.Responsable_ID !== responsable) return false;
    if (texto) {
      var pajar = (s.ID_Solicitud + ' ' + s.Nombre_Solicitud + ' ' + s.Nombre_Iniciativa).toLowerCase();
      if (pajar.indexOf(texto) === -1) return false;
    }
    return true;
  });
}

['fProyecto', 'fPlataforma', 'fSolicitante', 'fResponsable', 'fTexto'].forEach(function (id) {
  $(id).addEventListener('input', function () { if (DATOS.kanban) pintarKanban(); });
});
$('btnLimpiarFiltros').addEventListener('click', function () {
  ['fProyecto', 'fPlataforma', 'fSolicitante', 'fResponsable', 'fTexto'].forEach(function (id) {
    $(id).value = '';
    $(id).classList.remove('sin-coincidencia');
  });
  pintarKanban();
});

/**
 * Vista activa de Gestion: el embudo de la fabrica o el tablero de tareas.
 *
 * Son dos gobiernos distintos sobre la misma tabla: las de fabrica (Nuevo,
 * Mejora, Ajuste) recorren ocho fases; una tarea se hace y se cierra, y se
 * mueve por estado (D-79).
 */
var VISTA_GESTION = 'fabrica';

/** Columnas del tablero de tareas. Sin "Aprobada" ni "Cancelada" (D-79). */
var ESTADOS_TAREA = ['EST-01', 'EST-02', 'EST-04', 'EST-06'];

$('vistaGestion').addEventListener('click', function (e) {
  var boton = e.target.closest('button[data-vista]');
  if (!boton || boton.dataset.vista === VISTA_GESTION) return;
  VISTA_GESTION = boton.dataset.vista;
  Array.prototype.forEach.call(this.querySelectorAll('button'), function (b) {
    b.classList.toggle('activa', b.dataset.vista === VISTA_GESTION);
  });
  pintarKanban();
});

/**
 * Por que gobierno se mueve una solicitud. Gemelo de gobiernoDeTipo() del
 * servidor; cuando la solicitud viene del tablero ya lo trae resuelto.
 */
function gobiernoDe(s) {
  if (s && s.gobierno) return s.gobierno;
  return (CAT.gobiernoPorTipo || {})[s && s.Tipo_Solicitud] || 'fabrica';
}
function esTarea(s) { return gobiernoDe(s) === 'tarea'; }
function esEstabilizacion(s) { return gobiernoDe(s) === 'estabilizacion'; }
function esDeFabrica(s) { return gobiernoDe(s) === 'fabrica'; }

function pintarKanban() {
  $('notaFabrica').hidden = VISTA_GESTION !== 'fabrica';
  $('notaTareas').hidden = VISTA_GESTION !== 'tareas';
  $('notaEstabilizacion').hidden = VISTA_GESTION !== 'estabilizacion';
  if (VISTA_GESTION === 'tareas') pintarTableroTareas();
  else if (VISTA_GESTION === 'estabilizacion') pintarTableroEstabilizacion();
  else pintarTableroFabrica();
}

function pintarTableroFabrica() {
  var r = DATOS.kanban;
  var visibles = solicitudesFiltradas().filter(esDeFabrica);
  $('kanban').innerHTML = r.fases.map(function (f) {
    var aMano = faseSeOrdenaCliente(f.id);
    var enFase = visibles.filter(function (s) { return s.Fase_Actual === f.id; })
        .sort(aMano ? ordenPuestoAMano : ordenDeAtencion);
    return columnaTablero('data-fase="' + esc(f.id) + '"' + (aMano ? ' data-ordenable' : ''),
      '<span class="orden num">' + f.orden + '</span><h3>' + esc(f.nombre) + '</h3>', enFase);
  }).join('');

  var total = r.solicitudes.filter(esDeFabrica).length;
  $('subGestion').textContent = visibles.length + ' de ' + total +
      ' solicitudes de fábrica · ' + (permiso('Mover_Fase')
        ? 'arrastre las tarjetas para cambiarlas de fase'
        : 'tablero de consulta: su rol no mueve solicitudes de fase');
}

function pintarTableroTareas() {
  var r = DATOS.kanban;
  var visibles = solicitudesFiltradas().filter(esTarea);
  $('kanban').innerHTML = ESTADOS_TAREA.map(function (id, i) {
    var enEstado = visibles.filter(function (s) { return s.Estado_Actual === id; })
        .sort(ordenDeAtencion);
    return columnaTablero('data-estado="' + esc(id) + '"',
      '<span class="orden num">' + (i + 1) + '</span><h3>' + esc(nombreEstado(id)) + '</h3>',
      enEstado);
  }).join('');

  var total = r.solicitudes.filter(esTarea).length;
  // Las canceladas no tienen columna, asi que se dice cuantas quedaron fuera:
  // que un total no cuadre con la suma de las columnas desconcierta.
  var fuera = visibles.filter(function (s) {
    return ESTADOS_TAREA.indexOf(s.Estado_Actual) === -1;
  }).length;
  $('subGestion').textContent = visibles.length + ' de ' + total + ' tareas' +
      (fuera ? ' · ' + fuera + ' sin columna (canceladas o aprobadas)' : '') +
      ' · ' + (permiso('Mover_Estado_Tarea')
        ? 'arrastre las tarjetas para cambiarles el estado'
        : 'tablero de consulta: su rol no cambia el estado de las tareas');
}

/**
 * El tablero de estabilizacion: tres columnas por estado (D-101).
 *
 * Se ordena por prioridad y antiguedad, nunca a mano: un incidente se atiende
 * por severidad, y dejar que alguien reacomode ese orden seria permitir que una
 * critica espere detras de una media porque alguien la arrastro.
 */
function pintarTableroEstabilizacion() {
  var r = DATOS.kanban;
  var columnas = CAT.estadosEstabilizacion || ['EST-01', 'EST-02', 'EST-06'];
  var visibles = solicitudesFiltradas().filter(esEstabilizacion);
  $('kanban').innerHTML = columnas.map(function (id, i) {
    var enEstado = visibles.filter(function (s) { return s.Estado_Actual === id; })
        .sort(ordenDeAtencion);
    return columnaTablero('data-estado-estab="' + esc(id) + '"',
      '<span class="orden num">' + (i + 1) + '</span><h3>' + esc(nombreEstado(id)) + '</h3>',
      enEstado);
  }).join('');

  var total = r.solicitudes.filter(esEstabilizacion).length;
  var fuera = visibles.filter(function (s) {
    return columnas.indexOf(s.Estado_Actual) === -1;
  }).length;
  var caida = visibles.reduce(function (a, s) { return a + (s.Minutos_Caida || 0); }, 0);
  $('subGestion').textContent = visibles.length + ' de ' + total + ' estabilizaciones' +
      (fuera ? ' · ' + fuera + ' sin columna (canceladas)' : '') +
      (caida ? ' · ' + enHoras(caida) + ' de indisponibilidad acumulada' : '') +
      ' · ' + (permiso('Gestionar_Estabilizacion')
        ? 'arrastre las tarjetas para moverlas'
        : 'tablero de consulta: su rol no mueve estabilizaciones');
}

/** Minutos en una forma que se lee: "45 min", "3 h 20 min". */
function enHoras(minutos) {
  var m = Math.max(0, Math.round(minutos || 0));
  if (m < 60) return m + ' min';
  var h = Math.floor(m / 60), resto = m % 60;
  return h + ' h' + (resto ? ' ' + resto + ' min' : '');
}

/** El armazon de una columna, igual para los dos tableros. */
function columnaTablero(atributo, cabecera, lista) {
  var aMano = atributo.indexOf('data-ordenable') !== -1;
  return '<div class="col" ' + atributo + '>' +
    '<div class="col-cab">' + cabecera +
    '<span class="cuenta">' + lista.length + '</span></div>' +
    (lista.length
      ? lista.slice(0, 40).map(function (s, i) {
          return tarjetaActividad(s, aMano ? i + 1 : 0);
        }).join('') +
        (lista.length > 40 ? '<div class="vacia">y ' + (lista.length - 40) + ' más</div>' : '')
      : '<div class="vacia">Sin actividades</div>') + '</div>';
}

/** Gemelo de faseSeOrdena() del servidor: las columnas que se ordenan a mano. */
function faseSeOrdenaCliente(faseId) {
  return (CAT.fasesOrdenables || []).indexOf(faseId) !== -1;
}

/**
 * Orden de una columna que se acomoda a mano.
 *
 * Manda el numero que puso la persona arrastrando, y nada mas: la columna se ve
 * exactamente como la dejo. La prioridad sigue en la tarjeta para tenerla en
 * cuenta al ordenar, pero no reordena sola; si lo hiciera, arrastrar una
 * tarjeta por encima de una Critica la devolveria a su sitio y la aplicacion
 * pareceria no obedecer (D-96).
 *
 * Lo que todavia no tiene numero cae al final, en el orden de siempre: no se ha
 * ordenado, y colarlo arriba seria darle una prioridad que nadie decidio.
 */
function ordenPuestoAMano(a, b) {
  var na = Number(a.Orden_Columna), nb = Number(b.Orden_Columna);
  var va = !isNaN(na) && na > 0, vb = !isNaN(nb) && nb > 0;
  if (va && vb && na !== nb) return na - nb;
  if (va !== vb) return va ? -1 : 1;
  return ordenDeAtencion(a, b);
}

/**
 * Orden en que se leen las solicitudes, en el tablero y dentro de su iniciativa.
 *
 * Antes mandaba Orden_Iniciativa, un numero que el sistema asignaba solo al
 * crear la solicitud y que nadie reordenaba despues: ordenaba por antiguedad
 * disfrazada de decision. Sin el quedan los dos criterios que si significan
 * algo y que alguien si mantiene: primero lo mas prioritario, y a igual
 * prioridad lo que se pidio antes.
 */
function ordenDeAtencion(a, b) {
  var pa = PESO_PRIORIDAD[a.Prioridad], pb = PESO_PRIORIDAD[b.Prioridad];
  if (pa === undefined) pa = 9;
  if (pb === undefined) pb = 9;
  if (pa !== pb) return pa - pb;
  var fa = marcaDeTiempo(a.Fecha_Registro), fb = marcaDeTiempo(b.Fecha_Registro);
  if (fa !== fb) return fa - fb;
  return String(a.ID_Solicitud).localeCompare(String(b.ID_Solicitud), 'es');
}

function tarjetaActividad(s, posicion) {
  var bloq = String(s.Tiene_Bloqueo).toUpperCase().indexOf('S') === 0;
  // Sin permiso para operar el tablero, la tarjeta se abre pero no se arrastra.
  return '<article class="tarjeta' + (bloq ? ' bloqueada' : '') + (CTX.puedeOperarTablero ? '' : ' fija') +
      '"' + (CTX.puedeOperarTablero ? ' draggable="true"' : '') +
      ' data-id="' + esc(s.ID_Solicitud) + '">' +
    '<div class="t-top">' +
      // El numero se muestra solo donde el orden lo decide una persona: en las
      // demas columnas seria un dato que cambia solo y no significa nada.
      (posicion ? '<span class="t-pos num" title="Orden de atención">' + posicion + '</span>' : '') +
      '<span class="t-id">' + esc(s.ID_Solicitud) + '</span>' +
      '<span class="badge ' + (CLASE_ESTADO[s.Estado_Actual] || 'b-iniciar') + '">' +
        esc(nombreEstado(s.Estado_Actual)) + '</span>' +
      (bloq ? '<button class="t-alerta" data-alerta="' + esc(s.ID_Solicitud) +
              '" aria-label="Ver causal de bloqueo">&#9888;&#65039;</button>' : '') +
      selloAprobacion(s) +
      selloCierre(s) +
      (CTX.puedeEditarSolicitud ? '<button class="t-editar" data-editar-sol="' +
              esc(s.ID_Solicitud) + '" title="Editar la solicitud" ' +
              'aria-label="Editar la solicitud">&#9998;</button>' : '') +
    '</div>' +
    '<div class="t-ini">' + esc(s.Nombre_Iniciativa) + '</div>' +
    '<div class="t-nombre">' + esc(s.Nombre_Solicitud) + '</div>' +
    '<div class="t-pie">' +
      (esTarea(s) ? compromisoDeTarea(s)
        : esEstabilizacion(s) ? datosDeEstabilizacion(s)
        : (s.Version_Semantica ? '<span class="t-ver num">' + esc(s.Version_Semantica) + '</span>' : '')) +
      (s.Nombre_Plataforma ? '<span class="t-plat">' + esc(s.Nombre_Plataforma) + '</span>' : '') +
      '<span>' + esc(s.Nombre_Responsable || '—') + '</span>' +
      selloAnalista(s) +
      selloHistorias(s) +
      enlacesDeSolicitud(s) + '</div>' +
  '</article>';
}

/**
 * Lo que la tarjeta de una estabilizacion muestra en su pie.
 *
 * La version afectada va primero y en rojo: es el dato que explica por que
 * existe la tarjeta. Despues la de correccion, cuando ya se sabe, y el tiempo
 * que el servicio estuvo caido.
 */
function datosDeEstabilizacion(s) {
  var partes = [];
  if (s.Nombre_Version_Afectada) {
    partes.push('<span class="t-ver num t-rota" title="Versión en la que apareció">' +
      esc(s.Nombre_Version_Afectada) + '</span>');
  }
  if (s.Nombre_Version_Correccion) {
    partes.push('<span class="t-ver num t-arregla" title="Versión que lleva el arreglo">&#8594; ' +
      esc(s.Nombre_Version_Correccion) + '</span>');
  }
  if (s.Minutos_Caida) {
    partes.push('<span class="t-caida" title="' +
      esc((s.Tipo_Indisponibilidad || 'Indisponibilidad') + ' del servicio') + '">&#9201; ' +
      esc(enHoras(s.Minutos_Caida)) +
      (String(s.Tipo_Indisponibilidad) === 'Parcial' ? ' parcial' : '') + '</span>');
  }
  if (s.Nombre_Causa_Raiz) {
    partes.push('<span class="t-causa" title="Causa raíz">' + esc(s.Nombre_Causa_Raiz) + '</span>');
  }
  return partes.join('');
}

/**
 * El candado de una estabilizacion: que le falta para poder cerrarse.
 *
 * Se muestra ANTES de que alguien intente arrastrarla a Terminada, no despues.
 * El servidor vuelve a validar lo mismo —es su decision, no la del navegador—,
 * pero enterarse de que falta la causa raiz solo al tercer intento de mover la
 * tarjeta es una forma de no decirselo.
 */
function selloCierre(s) {
  if (!esEstabilizacion(s)) return '';
  if (s.Estado_Actual === 'EST-06') {
    return '<span class="t-cierre listo" title="Cerrada con todo registrado">&#10004;</span>';
  }
  if (!s.Falta_Para_Cerrar) {
    return '<span class="t-cierre listo" title="Tiene todo lo que hace falta para cerrarla">' +
      '&#10004;</span>';
  }
  return '<span class="t-cierre" title="' + esc(s.Falta_Para_Cerrar) +
    '" aria-label="' + esc(s.Falta_Para_Cerrar) + '">&#128274;</span>';
}

/**
 * El analista asignado, en la tarjeta de su fase.
 *
 * Solo se muestra donde significa algo: en Analisis y diseno, que es la fase que
 * lo pide. Despues la solicitud lo conserva —queda en la ficha y en el reporte—
 * pero sacarlo en todas las columnas seria repetir en siete tarjetas un dato que
 * ya no decide nada (D-102).
 *
 * Quien puede editar la solicitud lo cambia desde aqui: a quien se le asigna un
 * analisis cambia, y obligar a abrir la solicitud para corregirlo es el mismo
 * tramite que la pregunta al mover vino a evitar.
 */
function selloAnalista(s) {
  if (!esDeFabrica(s) || (CAT.fasesConAnalista || []).indexOf(s.Fase_Actual) === -1) return '';

  var puede = CTX.puedeEditarSolicitud && (CAT.analistas || []).length;
  var nombre = s.Nombre_Analista || 'sin analista';
  var titulo = s.Nombre_Analista
      ? ('Analista: ' + s.Nombre_Analista + (puede ? ' · clic para cambiarlo' : ''))
      : (puede ? 'Sin analista · clic para asignarlo' : 'Sin analista asignado');

  return '<' + (puede ? 'button' : 'span') + ' class="t-analista' +
    (s.Nombre_Analista ? '' : ' vacio') + '"' +
    (puede ? ' data-analista="' + esc(s.ID_Solicitud) + '"' : '') +
    ' title="' + esc(titulo) + '" aria-label="' + esc(titulo) + '">&#128100; ' +
    esc(nombre) + '</' + (puede ? 'button' : 'span') + '>';
}

/** Cambia el analista desde la tarjeta, sin abrir la solicitud. */
function cambiarAnalista(id) {
  var s = solicitudPorId(id);
  if (!s) return;
  preguntarAnalista(s, function (idAnalista) {
    var antes = { id: s.Analista_ID, nombre: s.Nombre_Analista };
    s.Analista_ID = idAnalista;
    s.Nombre_Analista = nombreDeCatalogo(CAT.analistas, idAnalista);
    pintarKanban();
    api('asignarAnalista', id, idAnalista).then(function () {
      toast(id + ': analiza ' + s.Nombre_Analista + '.');
    }).catch(function (err) {
      s.Analista_ID = antes.id;
      s.Nombre_Analista = antes.nombre;
      pintarKanban();
      fallo(err);
    });
  });
}

/**
 * En que van las historias de usuario, en la tarjeta de Analisis y diseno.
 *
 * Solo ahi y solo en las de fabrica: una tarea no pasa por esa fase y una
 * estabilizacion no escribe historias. Es informativo —no toca el sello de
 * aprobacion ni frena nada (D-108)— pero distingue tres esperas que antes se
 * veian iguales: escribiendo, esperando al PO, o ya revisadas.
 */
function selloHistorias(s) {
  if (!esDeFabrica(s) || s.Fase_Actual !== (CAT.faseHistorias || 'FAS-03')) return '';

  var valor = String(s.Estado_Historias || '');
  var puede = CTX.puedeEditarSolicitud;
  var titulo = valor
      ? ('Historias de usuario: ' + valor + (puede ? ' · clic para cambiarlo' : ''))
      : (puede ? 'Historias de usuario sin registrar · clic para indicarlo'
               : 'Historias de usuario sin registrar');

  return '<' + (puede ? 'button' : 'span') + ' class="t-hist ' +
    (CLASE_HISTORIAS[valor] || 'sin') + '"' +
    (puede ? ' data-historias="' + esc(s.ID_Solicitud) + '"' : '') +
    ' title="' + esc(titulo) + '" aria-label="' + esc(titulo) + '">&#128221; ' +
    esc(valor || 'sin registrar') + '</' + (puede ? 'button' : 'span') + '>';
}

/** Cambia el estado de las historias desde la tarjeta. */
function cambiarHistorias(id) {
  var s = solicitudPorId(id);
  if (!s) return;
  var actual = String(s.Estado_Historias || '');

  abrirModal('Historias de usuario de ' + s.ID_Solicitud, s.Nombre_Solicitud,
    '<div class="formulario">' +
      '<label class="campo"><span>¿En qué van?</span>' +
        '<select id="histEstado">' +
        (CAT.estadosHistorias || []).map(function (e) {
          return '<option value="' + esc(e) + '"' + (e === actual ? ' selected' : '') +
                 '>' + esc(e) + '</option>';
        }).join('') + '</select>' +
        '<small style="color:var(--ink-faint)">Es informativo: no mueve la tarjeta ni ' +
        'reemplaza el visto bueno de la fase, que se sigue dando con el sello.</small></label>' +
    '</div>',
    function () {
      var valor = $('histEstado').value;
      var antes = s.Estado_Historias;
      s.Estado_Historias = valor;
      pintarKanban();
      return api('cambiarEstadoHistorias', id, valor).then(function () {
        toast(id + ': historias ' + valor.toLowerCase() + '.');
      }).catch(function (err) {
        s.Estado_Historias = antes;
        pintarKanban();
        throw err;
      });
    });
}

/** Gemelo de faseExigeAprobacion() del servidor. */
function faseExigeAprobacionCliente(faseId) {
  return (CAT.fasesConAprobacion || []).indexOf(faseId) !== -1;
}

function estaAprobada(s) {
  return String(s.Aprobada || '').toUpperCase().indexOf('S') === 0;
}

/**
 * El sello de aprobacion de la tarjeta, en las tres fases que la piden.
 *
 * Quien puede aprobar ve un boton y decide ahi mismo, sin abrir la solicitud:
 * aprobar es una decision de un segundo y obligar a entrar al detalle la volvia
 * un tramite. Quien no puede ve lo mismo, pero sin poder oprimirlo: el estado de
 * la aprobacion le interesa a todo el equipo, no solo a quien la otorga (D-98).
 */
function selloAprobacion(s) {
  if (!esDeFabrica(s) || !faseExigeAprobacionCliente(s.Fase_Actual)) return '';

  var aprobada = estaAprobada(s);
  var puede = permiso('Aprobar_Solicitud');
  var titulo = aprobada
      ? (puede ? 'Aprobada · clic para retirar el visto bueno' : 'Aprobada')
      : (puede ? 'Sin aprobar · clic para aprobar' : 'Sin aprobar');

  return '<' + (puede ? 'button' : 'span') + ' class="t-aprob' + (aprobada ? ' si' : '') +
    (puede ? '' : ' fijo') + '"' +
    (puede ? ' data-aprobar="' + esc(s.ID_Solicitud) + '"' : '') +
    ' title="' + esc(titulo) + '" aria-label="' + esc(titulo) + '">' +
    (aprobada ? '&#10004;' : '&#9711;') +
    '</' + (puede ? 'button' : 'span') + '>';
}

/**
 * Da o quita el visto bueno desde la tarjeta.
 *
 * Se pinta de una vez y se revierte si el servidor dice que no, igual que el
 * arrastre. Y NO se recarga el tablero en exito: lo unico que cambio es un
 * dato de esa tarjeta, que ya esta en pantalla; pedir todo otra vez dejaria la
 * pagina en blanco varios segundos por un clic (D-97).
 */
function alternarAprobacion(id) {
  var s = solicitudPorId(id);
  if (!s) return;

  var antes = { Aprobada: s.Aprobada, Aprobada_Por: s.Aprobada_Por };
  var aprobar = !estaAprobada(s);
  s.Aprobada = aprobar ? 'SI' : 'NO';
  s.Aprobada_Por = aprobar ? CTX.idUsuario : '';
  pintarKanban();

  api('aprobarSolicitud', id, aprobar).then(function () {
    toast(id + (aprobar ? ' aprobada en ' : ' sin aprobar en ') + nombreFase(s.Fase_Actual) + '.');
  }).catch(function (err) {
    s.Aprobada = antes.Aprobada;
    s.Aprobada_Por = antes.Aprobada_Por;
    pintarKanban();
    fallo(err);
  });
}

/* --- Arrastrar y soltar --- */
document.addEventListener('dragstart', function (e) {
  var t = e.target.closest('.tarjeta');
  if (!t) return;
  arrastrada = t.dataset.id;
  t.classList.add('arrastrando');
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', arrastrada); } catch (err) {}
});
document.addEventListener('dragend', function (e) {
  var t = e.target.closest('.tarjeta');
  if (t) t.classList.remove('arrastrando');
  document.querySelectorAll('.col').forEach(function (c) {
    c.classList.remove('destino', 'vetada');
  });
  arrastrada = null;
});
document.addEventListener('dragover', function (e) {
  var col = e.target.closest('.col');
  if (!col || !arrastrada) return;
  e.preventDefault();
  var v = validarSoltar_(solicitudPorId(arrastrada), col);
  document.querySelectorAll('.col').forEach(function (c) {
    c.classList.remove('destino', 'vetada');
  });
  col.classList.add(v.permitido ? 'destino' : 'vetada');
  marcarSitio_(v.permitido ? col : null, e.clientY);
});

/**
 * La raya que muestra donde va a caer la tarjeta dentro de la columna.
 *
 * Sin ella, arrastrar para ordenar es adivinar: se suelta y se ve el resultado.
 * La raya convierte el arrastre en algo que se puede apuntar.
 */
function marcarSitio_(col, y) {
  document.querySelectorAll('.tarjeta.sitio-antes').forEach(function (t) {
    t.classList.remove('sitio-antes');
  });
  document.querySelectorAll('.col.sitio-final').forEach(function (c) {
    c.classList.remove('sitio-final');
  });
  if (!col || !col.hasAttribute('data-ordenable')) return;

  var vecina = tarjetaBajoElCursor_(col, y);
  if (vecina) vecina.classList.add('sitio-antes');
  else col.classList.add('sitio-final');
}

/**
 * La tarjeta ante la cual caeria el cursor, o null si cae al final.
 *
 * Se compara contra el centro de cada tarjeta: por encima del centro cae antes,
 * por debajo cae despues. Con el borde en vez del centro, la mitad de los
 * arrastres darian el vecino equivocado.
 */
function tarjetaBajoElCursor_(col, y) {
  var tarjetas = Array.prototype.slice.call(col.querySelectorAll('.tarjeta'))
      .filter(function (t) { return t.dataset.id !== arrastrada; });
  for (var i = 0; i < tarjetas.length; i++) {
    var caja = tarjetas[i].getBoundingClientRect();
    if (y < caja.top + caja.height / 2) return tarjetas[i];
  }
  return null;
}

/**
