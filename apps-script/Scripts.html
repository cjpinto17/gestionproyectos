/**
 * Lo que se esta editando. Vive aparte del DOM para que guardar mande lo que la
 * persona dejo marcado y no lo que el navegador alcanzo a repintar.
 */
var PERMISOS_EDIT = null;
var PERMISOS_SUCIOS = false;

/**
 * Los permisos ocupan la pagina entera de Administracion, no una ventana.
 *
 * Se probo primero como modal y no daba: la cuadricula es de 17 permisos mas 8
 * fases por 11 roles, y en una ventana hay que desplazarse a lo alto y a lo
 * ancho a la vez para encontrar una casilla. Como pagina caben los once roles
 * de una sola mirada, que es justo lo que uno hace aqui: comparar roles.
 */
function abrirPermisos() {
  mostrarPermisos(true);
  $('tablaPermisos').innerHTML =
    '<tbody><tr><td class="pm-fija">Cargando…</td></tr></tbody>';
  $('btnGuardarPermisos').disabled = true;

  api('getMatrizPermisos').then(function (r) {
    PERMISOS_EDIT = { valores: {}, fases: {}, roles: r.roles, permisos: r.permisos,
                      fases_cat: r.fases };
    r.roles.forEach(function (rol) {
      PERMISOS_EDIT.valores[rol.id] = {};
      r.permisos.forEach(function (pm) {
        PERMISOS_EDIT.valores[rol.id][pm.campo] = !!(r.valores[rol.id] || {})[pm.campo];
      });
      PERMISOS_EDIT.fases[rol.id] = (r.fasesPorRol[rol.id] || []).slice();
    });
    PERMISOS_SUCIOS = false;
    $('permisosAviso').textContent = r.enHoja
        ? 'Qué puede hacer cada rol. Su propio rol es ' + r.rolPropio + '.'
        : 'Todavía no se han guardado nunca: lo que ve es la configuración de fábrica, ' +
          'la misma con la que la aplicación viene funcionando.';
    $('tablaPermisos').innerHTML = cuerpoPermisos();
    $('btnGuardarPermisos').disabled = false;
  }).catch(function (err) {
    mostrarPermisos(false);
    fallo(err);
  });
}

/** Alterna entre la vista de catalogos y la de permisos. */
function mostrarPermisos(ver) {
  if (!ver && PERMISOS_SUCIOS &&
      !confirm('Hay cambios de permisos sin guardar. ¿Salir y perderlos?')) return;
  $('vistaPermisos').hidden = !ver;
  $('vistaCatalogos').hidden = ver;
  $('encabezadoAdmin').hidden = ver;      // la vista de permisos trae su propio titulo
  if (!ver) PERMISOS_SUCIOS = false;
  window.scrollTo(0, 0);
}

/**
 * La cuadricula: permisos en las filas, roles en las columnas.
 *
 * Va asi y no al reves porque los permisos son el doble que los roles: una
 * tabla de 25 filas por 11 columnas se recorre de arriba abajo; la traspuesta
 * obliga a desplazarse a lo ancho para comparar dos roles, que es lo que uno
 * viene a hacer.
 */
function cuerpoPermisos() {
  var e = PERMISOS_EDIT;
  var encabezado = '<thead><tr><th class="pm-fija">Permiso</th>' +
    e.roles.map(function (rol) {
      return '<th class="pm-rol" title="' + esc(rol.id) + '">' + esc(rol.nombre) + '</th>';
    }).join('') + '<th class="pm-todos">Todos</th></tr></thead>';

  var grupo = '';
  var filas = e.permisos.map(function (pm) {
    var cabecera = '';
    if (pm.grupo !== grupo) {
      grupo = pm.grupo;
      cabecera = filaDeGrupo(grupo);
    }
    return cabecera + filaPermiso(pm.nombre, 'permiso', pm.campo, function (rolId) {
      return e.valores[rolId][pm.campo];
    });
  }).join('');

  var filasFase = filaDeGrupo('Fases del embudo que puede mover') +
    e.fases_cat.map(function (f) {
      return filaPermiso(f.nombre, 'fase', f.id, function (rolId) {
        return e.fases[rolId].indexOf(f.id) !== -1;
      });
    }).join('');

  return encabezado + '<tbody>' + filas + filasFase + '</tbody>';
}

function filaDeGrupo(texto) {
  // El titulo va dentro de un <span> propio y no pegado a la celda: la celda
  // abarca todas las columnas, asi que fijarla a ella no sirve de nada. Fijando
  // el span, el titulo del grupo se queda a la vista aunque se desplace a lo
  // ancho en una pantalla angosta.
  return '<tr class="pm-grupo"><td colspan="' + (PERMISOS_EDIT.roles.length + 2) +
         '"><span>' + esc(texto) + '</span></td></tr>';
}

/**
 * Una fila: el nombre, una casilla por rol y el atajo de fila.
 *
 * El atajo marca o desmarca ese permiso para TODOS los roles de un golpe. Con
 * 275 casillas es la diferencia entre configurar y resignarse; y como nada se
 * guarda hasta presionar Guardar, equivocarse no cuesta nada.
 */
function filaPermiso(nombre, tipo, valor, estaMarcada) {
  return '<tr data-fila="' + esc(valor) + '"><td class="pm-fija">' + esc(nombre) + '</td>' +
    PERMISOS_EDIT.roles.map(function (rol) {
      return '<td class="pm-celda"><label><input type="checkbox" data-rol="' + esc(rol.id) +
             '" data-' + tipo + '="' + esc(valor) + '"' +
             (estaMarcada(rol.id) ? ' checked' : '') + '></label></td>';
    }).join('') +
    '<td class="pm-todos"><button type="button" class="pm-atajo" data-todos="' + esc(valor) +
    '" title="Marcar o desmarcar esta fila para todos los roles">todos</button></td></tr>';
}

$('tablaPermisos').addEventListener('change', function (e) {
  var c = e.target.closest('input[type=checkbox][data-rol]');
  if (!c) return;
  anotarPermiso(c.dataset.rol, c.dataset.permiso, c.dataset.fase, c.checked);
});

$('tablaPermisos').addEventListener('click', function (e) {
  var atajo = e.target.closest('[data-todos]');
  if (!atajo) return;
  var fila = atajo.closest('tr');
  var casillas = fila.querySelectorAll('input[type=checkbox]');
  // Si falta alguna por marcar, el atajo marca; si ya estaban todas, desmarca.
  var marcar = Array.prototype.some.call(casillas, function (c) { return !c.checked; });
  Array.prototype.forEach.call(casillas, function (c) {
    c.checked = marcar;
    anotarPermiso(c.dataset.rol, c.dataset.permiso, c.dataset.fase, marcar);
  });
});

/** Guarda en memoria lo que se acaba de marcar o desmarcar. */
function anotarPermiso(rolId, permiso, fase, marcado) {
  PERMISOS_SUCIOS = true;
  if (permiso) {
    PERMISOS_EDIT.valores[rolId][permiso] = marcado;
    return;
  }
  var fases = PERMISOS_EDIT.fases[rolId];
  var i = fases.indexOf(fase);
  if (marcado && i === -1) fases.push(fase);
  if (!marcado && i !== -1) fases.splice(i, 1);
}

function guardarPermisosDeLaPagina() {
  if (!PERMISOS_EDIT) return;
  var boton = $('btnGuardarPermisos');
  boton.disabled = true;
  boton.textContent = 'Guardando…';
  api('guardarPermisos', PERMISOS_EDIT.valores, PERMISOS_EDIT.fases).then(function () {
    PERMISOS_SUCIOS = false;
    toast('Permisos guardados. Cada persona los verá al volver a entrar.');
    invalidarCacheCliente();
    $('permisosAviso').textContent = 'Qué puede hacer cada rol.';
  }).catch(fallo).then(function () {
    boton.disabled = false;
    boton.textContent = 'Guardar permisos';
  });
}

/* ================= Arranque ================= */

/**
 * Trae calladamente las paginas que el usuario todavia no ha abierto.
 *
 * Cada viaje al servidor de Apps Script cuesta cerca de un segundo solo en ida
 * y vuelta, y ese segundo se paga igual si nadie lo esta esperando. Mientras la
 * persona mira el Home, el tablero y la matriz se van trayendo; cuando hace
 * clic en la pestana, ya estan.
 *
 * Reglas: nunca pisa lo que ya esta cargado, va en cadena y no en paralelo para
 * no competir con lo que el usuario pida entretanto, y si algo falla se queda
 * callado — la pagina lo volvera a pedir cuando se abra de verdad.
 */
function precargarEnSegundoPlano() {
  setTimeout(function () {
    var pasos = [
      function () {
        if (DATOS.matriz) return Promise.resolve();
        var gen = GENERACION_DATOS;
        return unaSolaConsulta('matriz', function () {
          return api('getMatrizIniciativas');
        }).then(function (r) {
          if (DATOS.matriz || gen !== GENERACION_DATOS) return;
          DATOS.matriz = r;
          prepararFiltrosIniciativas(r);
        });
      },
      function () {
        if (DATOS.kanban) return Promise.resolve();
        var gen = GENERACION_DATOS;
        return unaSolaConsulta('kanban', function () {
          return api('getDatosKanban', {});
        }).then(function (r) {
          if (DATOS.kanban || gen !== GENERACION_DATOS) return;
          DATOS.kanban = r;
          prepararFiltrosKanban(r);
        });
      }
    ];
    pasos.reduce(function (cadena, paso) {
      return cadena.then(paso).catch(function () {});
    }, Promise.resolve());
    // 400 ms, no 900: desde que los catalogos salen de la cache el arranque ya
    // termino de pintar el Home mucho antes, y cada decima que la precarga
    // espera es una decima que espera despues quien abre Seguimiento.
  }, 400);
}

/** Descarta lo que el navegador tiene guardado de las consultas anteriores. */
function invalidarCacheCliente() {
  olvidarConsultas();
  DATOS.home = null;
  DATOS.reportes = null;
  DATOS.matriz = null;
  DATOS.roadmap = null;
  DATOS.kanban = null;
  DATOS.filtrosListos = null;
  DATOS.filtrosIniListos = null;
}

    navegar(actual);

// Un solo viaje al servidor para sesion, catalogos e indicadores del Home.
/**
 * Pie de pagina: quien construyo la herramienta, que version esta corriendo y
 * de cuando es. Lo primero que hay que preguntar cuando alguien reporta algo
 * raro es que version esta viendo; que lo diga la propia pagina ahorra ese ida
 * y vuelta.
 */
function pintarPie(v) {
  if (!v) return;
  $('pieAutor').textContent = v.autor ? 'Hecho por ' + v.autor : '';
  $('pieVersion').textContent = v.numero ? 'Versión ' + v.numero : '';
  $('pieActualizacion').textContent = v.publicada
      ? 'Actualizada el ' + fechaHora(v.publicada)
      : 'Versión sin sellar';
}

/* ================= Ingreso ================= */

/** Muestra la pantalla de ingreso y esconde la aplicacion. */
function mostrarIngreso(motivo) {
  $('contenido').hidden = true;
  $('avisoAcceso').hidden = true;
  $('ingreso').hidden = false;
  $('btnActualizar').hidden = true;
  $('usuarioNombre').textContent = 'Sin sesión';
  $('usuarioRol').textContent = '';
  if (motivo) $('ingresoMotivo').textContent = motivo;
  $('pasoCodigo').hidden = true;
  $('pasoCorreo').hidden = false;
  errorIngreso('');
}

function errorIngreso(texto) {
  var caja = $('ingresoError');
  caja.textContent = texto || '';
  caja.hidden = !texto;
}

function ocupado(boton, texto, activo) {
  boton.disabled = activo;
  boton.textContent = texto;
}

$('btnPedirCodigo').addEventListener('click', function () {
  var correo = $('ingCorreo').value.trim();
  if (!correo) { errorIngreso('Escriba su correo.'); return; }
  errorIngreso('');
  var b = this;
  ocupado(b, 'Enviando…', true);
  apiPublica('solicitarCodigoAcceso', correo).then(function (r) {
    $('ingresoEnviadoA').textContent = r.mensaje;
    $('pasoCorreo').hidden = true;
    $('pasoCodigo').hidden = false;
    $('ingCodigo').focus();
  }).catch(function (err) {
    errorIngreso((err && err.message) ? err.message : String(err));
  }).then(function () { ocupado(b, 'Enviarme un código', false); });
});

$('btnEntrar').addEventListener('click', function () {
  var codigo = $('ingCodigo').value.trim();
  if (!codigo) { errorIngreso('Escriba el código que le llegó.'); return; }
  errorIngreso('');
  var b = this;
  ocupado(b, 'Entrando…', true);
  apiPublica('validarCodigoAcceso', $('ingCorreo').value.trim(), codigo).then(function (r) {
    guardarToken(r.token);
    $('ingreso').hidden = true;
    arrancar();
  }).catch(function (err) {
    errorIngreso((err && err.message) ? err.message : String(err));
    ocupado(b, 'Entrar', false);
  });
});

$('btnOtroCorreo').addEventListener('click', function () {
  $('ingCodigo').value = '';
  $('pasoCodigo').hidden = true;
  $('pasoCorreo').hidden = false;
  errorIngreso('');
});

// Enter en cualquiera de los dos campos avanza, que es lo que la gente espera.
$('ingCorreo').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') $('btnPedirCodigo').click();
});
$('ingCodigo').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') $('btnEntrar').click();
});

/* ================= Arranque ================= */

function arrancar() {
  $('ventanaMeses').value = String(VENTANA_INICIAL);
  api('getArranque', VENTANA_INICIAL).then(function (r) {
    if (!r) return;                       // la sesion se pidio de nuevo
    pintarPie(r.version);
    CTX = r.contexto;
    if (!CTX.autorizado) {
      // Identidad establecida pero sin permiso: no sirve volver a pedir el
      // codigo, hay que hablar con el administrador.
      $('ingreso').hidden = true;
      $('usuarioNombre').textContent = CTX.correo || 'Sin sesión';
      $('avisoAccesoMotivo').textContent = CTX.motivo || '';
      $('avisoAcceso').hidden = false;
      $('btnActualizar').hidden = true;
      return;
    }
    CAT = r.catalogos;
    DATOS.home = {};
    DATOS.home[VENTANA_INICIAL] = r.metricas;

    $('ingreso').hidden = true;
    $('avisoAcceso').hidden = true;
    $('btnActualizar').hidden = false;
    $('usuarioNombre').textContent = CTX.nombre;
    $('usuarioRol').textContent = CTX.rolNombre;
    aplicarPermisosDeMenu();
    $('contenido').hidden = false;
    navegar(PAGINA_INICIAL || 'home');
    abrirRegistroDelEnlace();
    precargarEnSegundoPlano();
  }).catch(function (err) {
    $('avisoAccesoMotivo').textContent = (err && err.message) ? err.message : String(err);
    $('avisoAcceso').hidden = false;
  });
}

TOKEN_SESION = leerTokenGuardado();
arrancar();
</script>
