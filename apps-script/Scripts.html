<script>
/**
 * Scripts.html
 * Logica de la interfaz. Todo el dato viene del backend por google.script.run:
 * esta capa solo pinta y valida lo que el usuario escribe antes de enviarlo.
 */

/* ================= Estado de la aplicacion ================= */
var CTX = null;          // usuario en sesion, rol y permisos
var CAT = null;          // catalogos maestros
var DATOS = {};          // cache por pagina
var tablaAdminActual = 'Usuarios';
var arrastrada = null;
var accionModal = null;

var TODAS = '*';
var PAGINAS = ['home', 'iniciativas', 'gestion', 'roadmap', 'reportes', 'admin'];
// Mismo codigo de color que los estados de iniciativa, para que el tablero y
// la matriz se lean igual: gris lo que no arranca, amarillo lo que avanza,
// verde lo terminado, rojo lo detenido.
var CLASE_ESTADO = {
  'EST-01': 'e-por-iniciar',   // Por iniciar  · gris
  'EST-02': 'e-en-progreso',   // En progreso  · amarillo
  'EST-03': 'e-finalizada',    // Aprobada     · verde
  'EST-04': 'e-en-pausa',      // Bloqueada    · rojo
  'EST-05': 'e-cancelada',     // Cancelada    · gris tachado
  'EST-06': 'e-finalizada'     // Terminada    · verde
};
// Codigo de color de los estados de iniciativa, definido por el negocio.
var CLASE_ESTADO_INI = {
  'EIN-01': 'e-por-iniciar',   // gris
  'EIN-02': 'e-en-progreso',   // amarillo
  'EIN-03': 'e-en-pausa',      // rojo
  'EIN-04': 'e-cancelada',     // gris tachado
  'EIN-05': 'e-finalizada'     // verde
};
var FRANJA_ESTADO_INI = {
  'EIN-01': 'f-por-iniciar', 'EIN-02': 'f-en-progreso', 'EIN-03': 'f-en-pausa',
  'EIN-04': 'f-cancelada', 'EIN-05': 'f-finalizada'
};
var PRIORIDAD_CLASE = {
  'PRI-01': 'p-critica', 'PRI-02': 'p-alta', 'PRI-03': 'p-media', 'PRI-04': 'p-baja'
};
// Orden de presentacion: critica, alta, media, baja. Lo que no tenga prioridad
// va al final de la celda.
var PESO_PRIORIDAD = { 'PRI-01': 0, 'PRI-02': 1, 'PRI-03': 2, 'PRI-04': 3 };
/**
 * Ventana con la que abre el Home: los ultimos tres meses.
 *
 * Vive aqui y no solo en el <option selected> porque el arranque pide los
 * indicadores de esta ventana en el mismo viaje que la sesion y los catalogos.
 * Si los dos valores se separaran, el Home pediria de nuevo al servidor apenas
 * abrir, y se perderia justo el viaje que ese arranque ahorra. Su gemelo del
 * lado del servidor es CONFIG.VENTANA_HOME_MESES, que decide cual ventana se
 * deja caliente en cache.
 */
var VENTANA_INICIAL = 3;
var COLOR_FASE = ['#00306E','#0B4FA5','#1B6FD0','#3E92E0','#1BB26C','#1DD982','#50EAA2','#9CF3CB'];

/* ================= Utilidades ================= */
function esc(t) {
  return String(t === null || t === undefined ? '' : t)
      .replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
}
function $(id) { return document.getElementById(id); }

var tToast;
function toast(msg, esError) {
  var el = $('toast');
  el.textContent = msg;
  el.className = 'toast' + (esError ? ' err' : '');
  el.hidden = false;
  clearTimeout(tToast);
  tToast = setTimeout(function () { el.hidden = true; }, esError ? 7000 : 4500);
}

/**
 * Identificador de la sesion abierta con codigo. Los de la compania no lo
 * necesitan: a ellos los reconoce Google.
 */
var TOKEN_SESION = '';
var CLAVE_TOKEN = 'sesionPlataformasDigitales';

function leerTokenGuardado() {
  try { return localStorage.getItem(CLAVE_TOKEN) || ''; } catch (e) { return ''; }
}
function guardarToken(token) {
  TOKEN_SESION = token || '';
  try {
    if (token) localStorage.setItem(CLAVE_TOKEN, token);
    else localStorage.removeItem(CLAVE_TOKEN);
  } catch (e) { /* navegador sin almacenamiento: la sesion dura lo que la pestana */ }
}

/**
 * Envuelve google.script.run en una promesa.
 *
 * Todas las operaciones entran por el despachador del servidor, que establece
 * la identidad una sola vez y la deja fija. Por eso el token viaja en cada
 * llamada: es lo unico que el servidor tiene para saber quien pregunta cuando
 * Google no lo dice.
 */
function api(metodo) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (err) {
          var msg = (err && err.message) ? err.message : String(err);
          if (msg.indexOf('SESION_INVALIDA') !== -1) {
            // La sesion vencio o nunca existio: se pide el ingreso de nuevo en
            // lugar de dejar un error suelto en pantalla.
            guardarToken('');
            mostrarIngreso(msg.replace(/^.*SESION_INVALIDA:\s*/, ''));
            return;
          }
          reject(err);
        })
        .llamar(TOKEN_SESION, metodo, args);
  });
}

/** Llamadas que ocurren ANTES de tener identidad, sin pasar por el despachador. */
function apiPublica(metodo) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)[metodo].apply(null, args);
  });
}

function fecha(valor) {
  if (!valor) return '';
  var d = new Date(valor);
  if (isNaN(d.getTime())) return String(valor);
  return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) +
         '/' + d.getFullYear();
}
function fechaHora(valor) {
  if (!valor) return '';
  var d = new Date(valor);
  if (isNaN(d.getTime())) return String(valor);
  return fecha(valor) + ' ' + ('0' + d.getHours()).slice(-2) + ':' +
         ('0' + d.getMinutes()).slice(-2);
}
/**
 * Valor para un <input type="date">: aaaa-mm-dd en la hora LOCAL.
 *
 * No se usa toISOString(), que convierte a UTC: una fecha registrada a las
 * 7 de la noche en Colombia (UTC-5) ya es el dia siguiente en UTC, y el
 * formulario mostraria un dia de mas. Al guardar, ese dia de mas se quedaria.
 */
function fechaInput(valor) {
  if (!valor) return '';
  var d = new Date(valor);
  if (isNaN(d.getTime())) return '';
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' +
         ('0' + d.getDate()).slice(-2);
}
function etiquetaMes(clave) {
  var m = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  var p = String(clave).split('-');
  return m[Number(p[1]) - 1] + ' ' + p[0].slice(2);
}
function nombreDeCatalogo(lista, id) {
  for (var i = 0; i < (lista || []).length; i++) {
    if (lista[i].id === id) return lista[i].nombre;
  }
  return id || '';
}
function nombreFase(id) { return nombreDeCatalogo(CAT.fases, id); }
function nombreEstado(id) { return nombreDeCatalogo(CAT.estados, id); }
function nombrePlataforma(id) { return nombreDeCatalogo(CAT.plataformas, id); }
function nombreUsuario(id) {
  for (var i = 0; i < CAT.usuarios.length; i++) {
    if (CAT.usuarios[i].ID_Usuario === id) return CAT.usuarios[i].Nombre_Completo;
  }
  return '';
}
function nombreCorto(id) {
  var n = nombreUsuario(id);
  if (!n) return '—';
  var p = n.split(' ');
  return p[0] + ' ' + (p[1] || '').charAt(0) + '.';
}
function ordenDeFase(id) {
  for (var i = 0; i < CAT.fases.length; i++) {
    if (CAT.fases[i].id === id) return CAT.fases[i].orden;
  }
  return -1;
}

/* ================= Componentes de presentacion ================= */
function kpi(rot, cifra, unidad, pie, clase) {
  var valor = (cifra === null || cifra === undefined)
      ? '<small>sin datos</small>'
      : esc(cifra) + (unidad ? '<small>' + esc(unidad) + '</small>' : '');
  return '<div class="kpi' + (clase ? ' ' + clase : '') + '">' +
         '<div class="rot">' + esc(rot) + '</div>' +
         '<div class="cifra num">' + valor + '</div>' +
         (pie ? '<div class="pie">' + esc(pie) + '</div>' : '') + '</div>';
}
function barra(etq, val, max, texto, clase) {
  var w = max ? Math.round(val / max * 100) : 0;
  return '<div class="barra-dato"><span>' + esc(etq) + '</span>' +
         '<span class="pista"><span class="relleno ' + (clase || '') +
         '" style="width:' + w + '%"></span></span>' +
         '<span class="val num">' + esc(texto) + '</span></div>';
}
function columnas(items, max) {
  var dobles = items.some(function (i) { return i.v2 !== undefined; });
  var tope = max || Math.max.apply(null, items.map(function (i) {
    return dobles ? Math.max(i.v1 || 0, i.v2 || 0) : (i.v1 || 0);
  })) || 1;
  return '<div class="columnas">' + items.map(function (i) {
    var h1 = Math.round((i.v1 || 0) / tope * 100);
    var h2 = Math.round((i.v2 || 0) / tope * 100);
    var cuerpo = dobles
        ? '<div class="par"><div class="bloque b2" style="height:' + h2 + '%"></div>' +
          '<div class="bloque" style="height:' + h1 + '%"></div></div>'
        : '<div class="torre"><div class="bloque" style="height:' + h1 + '%"></div></div>';
    return '<div class="colum"><span class="cifra num">' + esc(i.txt) + '</span>' +
           cuerpo + '<span class="etq">' + esc(i.etq) + '</span></div>';
  }).join('') + '</div>';
}
/**
 * Dibuja de inmediato la forma de lo que se esta pidiendo, en vez de la palabra
 * "Cargando". La espera es la misma, pero el ojo ya tiene donde posarse y la
 * pagina no da el salto de quedarse en blanco y llenarse de golpe.
 *
 * @param {string} contenedor
 * @param {string=} forma kpis | matriz | tablero | grafico | lista (por defecto).
 */
function cargando(contenedor, forma) {
  var caja = $(contenedor);
  if (!caja) return;
  var repetir = function (html, veces) { return new Array(veces + 1).join(html); };
  var formas = {
    kpis: '<div class="eq-kpis">' + repetir('<div class="eq eq-kpi"></div>', 5) + '</div>',
    matriz: '<div class="eq-matriz">' + repetir('<div class="eq eq-celda"></div>', 8) + '</div>',
    tablero: '<div class="eq-tablero">' + repetir('<div class="eq eq-columna"></div>', 4) + '</div>',
    grafico: '<div class="eq eq-grafico"></div>',
    lista: repetir('<div class="eq eq-linea"></div>', 4)
  };
  caja.innerHTML = '<div class="esqueleto" aria-busy="true" aria-label="Cargando">' +
                   (formas[forma] || formas.lista) + '</div>';
}
function fallo(err) {
  toast(err && err.message ? err.message : String(err), true);
}

/* ================= Modal ================= */
function abrirModal(titulo, subtitulo, cuerpoHtml, alGuardar) {
  $('modalTitulo').textContent = titulo;
  $('modalSub').textContent = subtitulo || '';
  $('modalCuerpo').innerHTML = cuerpoHtml;
  $('modalError').textContent = '';
  accionModal = alGuardar || null;
  $('btnGuardarModal').hidden = !alGuardar;
  $('velo').hidden = false;
}
function cerrarModal() { $('velo').hidden = true; accionModal = null; }
$('btnCerrarModal').addEventListener('click', cerrarModal);
$('velo').addEventListener('click', function (e) { if (e.target === this) cerrarModal(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') cerrarModal(); });
$('btnGuardarModal').addEventListener('click', function () {
  if (!accionModal) return;
  var boton = this;
  boton.disabled = true;
  boton.textContent = 'Guardando…';
  Promise.resolve(accionModal())
      .then(function () { cerrarModal(); })
      .catch(function (err) { $('modalError').textContent = err.message || String(err); })
      .then(function () { boton.disabled = false; boton.textContent = 'Guardar'; });
});

/* ================= Router ================= */
function navegar(pagina) {
  PAGINAS.forEach(function (p) { $('pg-' + p).hidden = (p !== pagina); });
  document.querySelectorAll('.tab').forEach(function (t) {
    if (t.dataset.pagina === pagina) t.setAttribute('aria-current', 'page');
    else t.removeAttribute('aria-current');
  });
  var cargadores = {
    home: cargarHome, iniciativas: cargarIniciativas, gestion: cargarGestion,
    roadmap: cargarRoadmap, reportes: cargarReportes, admin: cargarAdmin
  };
  if (cargadores[pagina]) cargadores[pagina]();
}
$('tabs').addEventListener('click', function (e) {
  var b = e.target.closest('.tab');
  if (b) navegar(b.dataset.pagina);
});

/* ================= Home ================= */
function cargarHome() {
  var meses = Number($('ventanaMeses').value);
  // Si ya se pidieron estos meses en esta sesion, se pinta de inmediato.
  if (DATOS.home && DATOS.home[meses]) { pintarHome(DATOS.home[meses]); return; }
  cargando('kpisPortafolio', 'kpis');
  api('getMetricasHome', meses).then(function (m) {
    DATOS.home = DATOS.home || {};
    DATOS.home[meses] = m;
    pintarHome(m);
  }).catch(fallo);
}
$('ventanaMeses').addEventListener('change', cargarHome);

function pintarHome(m) {
  $('kpisPortafolio').innerHTML = [
    kpi('Iniciativas en progreso', m.portafolio.iniciativasEnProgreso,
        ' de ' + m.portafolio.iniciativasTotales, 'Portafolio de negocio'),
    kpi('Actividades totales', m.portafolio.solicitudesTotales, '', 'Registradas históricamente'),
    kpi('En vuelo', m.portafolio.solicitudesEnVuelo, '', 'Fases 1 a 7'),
    kpi('En producción', m.portafolio.enProduccion, '', 'Cerradas con éxito'),
    kpi('Bloqueos activos', m.bloqueos.activos, '',
        (m.bloqueos.porcentajeSobreEnVuelo || 0) + '% de lo que está en vuelo',
        m.bloqueos.activos ? 'grave' : '')
  ].join('');

  $('kpisVelocidad').innerHTML = [
    kpi('Lead Time promedio', m.velocidad.leadTimeDias, ' d',
        'Registro → producción (' + m.velocidad.muestraLeadTime + ' entregas)'),
    kpi('Lead Time mediana', m.velocidad.leadTimeMediana, ' d', 'Menos sensible a casos extremos'),
    kpi('Lead Time P85', m.velocidad.leadTimeP85, ' d', 'Compromiso realista de entrega'),
    kpi('Throughput', m.velocidad.throughputPromedioMes, ' /mes', 'Promedio de la ventana'),
    kpi('Construcción neta', m.velocidad.tiempoConstruccionDias, ' d', 'Inicio a fin de desarrollo')
  ].join('');

  $('graficoThroughput').innerHTML = columnas(m.velocidad.throughputMensual.map(function (t) {
    return { etq: etiquetaMes(t.mes), v1: t.entregadas, txt: t.entregadas };
  }));

  var maxCycle = Math.max.apply(null, m.velocidad.cycleTimePorFase.map(function (c) {
    return Math.max(c.diasHabilesPromedio || 0, c.slaDias || 0);
  })) || 1;
  $('graficoCycle').innerHTML = m.velocidad.cycleTimePorFase.map(function (c) {
    if (c.diasHabilesPromedio === null) return barra(c.fase, 0, maxCycle, 'sin datos', '');
    return barra(c.fase, c.diasHabilesPromedio, maxCycle,
                 c.diasHabilesPromedio + ' d / ' + c.slaDias, c.cumple ? 'verde' : 'ambar');
  }).join('');

  $('kpisCalidad').innerHTML = [
    kpi('First Pass Yield', m.calidad.firstPassYieldPct, ' %',
        'Entregas que nunca repitieron fase',
        m.calidad.firstPassYieldPct >= 80 ? 'bien' : 'mal'),
    kpi('Tasa de reproceso', m.calidad.tasaReprocesoPct, ' %',
        m.calidad.retrocesos + ' retrocesos de ' + m.calidad.transiciones + ' transiciones',
        m.calidad.tasaReprocesoPct <= 10 ? 'bien' : 'mal'),
    kpi('Devoluciones de QA', m.calidad.devolucionesQA, '', 'Hallazgos que regresaron a desarrollo'),
    kpi('Devoluciones de UAT', m.calidad.devolucionesUAT, '', 'Rechazos del negocio')
  ].join('');

  var sla = m.predictibilidad.cumplimientoSlaPorFase.filter(function (s) {
    return s.cumplimientoPct !== null;
  });
  var slaGlobal = sla.length
      ? Math.round(sla.reduce(function (a, s) { return a + s.cumplimientoPct; }, 0) / sla.length * 10) / 10
      : null;

  $('kpisPredictibilidad').innerHTML = [
    kpi('Cumplimiento de SLA', slaGlobal, ' %', 'Promedio de las fases, en días hábiles',
        slaGlobal >= 85 ? 'bien' : 'mal'),
    kpi('Entregas en fecha', m.predictibilidad.cumplimientoFecha.onTimePct, ' %',
        m.predictibilidad.cumplimientoFecha.versionesEvaluadas + ' versiones evaluadas',
        m.predictibilidad.cumplimientoFecha.onTimePct >= 70 ? 'bien' : 'mal'),
    kpi('Desvío promedio', m.predictibilidad.cumplimientoFecha.desvioPromedioDias, ' d',
        'Respecto a la fecha planeada'),
    kpi('Eficiencia de flujo', m.predictibilidad.eficienciaFlujoPct, ' %',
        'Lead Time sin el tiempo bloqueado')
  ].join('');

  $('graficoSla').innerHTML = m.predictibilidad.cumplimientoSlaPorFase.map(function (s) {
    if (s.cumplimientoPct === null) return barra(s.fase, 0, 100, 'sin datos', '');
    return barra(s.fase, s.cumplimientoPct, 100, s.cumplimientoPct + '%',
                 s.cumplimientoPct >= 85 ? 'verde' : (s.cumplimientoPct >= 60 ? 'ambar' : 'rojo'));
  }).join('');

  $('graficoDemanda').innerHTML = columnas(m.carga.demandaVsEntrega.map(function (d) {
    return { etq: etiquetaMes(d.mes), v1: d.entregadas, v2: d.registradas,
             txt: d.registradas + '/' + d.entregadas };
  })) + '<div class="leyenda">' +
       '<span><span class="punto" style="background:var(--esmeralda)"></span>Registradas</span>' +
       '<span><span class="punto" style="background:var(--navy)"></span>Entregadas</span></div>';

  var wip = m.carga.wipPorResponsable;
  var claves = Object.keys(wip).sort(function (a, b) { return wip[b] - wip[a]; });
  var maxWip = claves.length ? wip[claves[0]] : 1;
  $('graficoWip').innerHTML = (claves.length
      ? claves.map(function (k) { return barra(nombreUsuario(k) || k, wip[k], maxWip, wip[k], ''); }).join('')
      : '<p style="color:var(--ink-muted);font-size:13px">Sin actividades en curso.</p>') +
      '<p class="nota">WIP total: <b>' + m.carga.wip + '</b> · backlog: ' + m.carga.backlog +
      (m.carga.tiempoEsperadoEntregaDias
        ? ' · con este throughput, vaciarlo toma ~' + m.carga.tiempoEsperadoEntregaDias + ' días (ley de Little).'
        : '.') + '</p>';

  var plat = m.distribucion.porPlataforma;
  var pk = Object.keys(plat).sort(function (a, b) { return plat[b] - plat[a]; });
  var maxPlat = pk.length ? plat[pk[0]] : 1;
  $('graficoPlataformas').innerHTML = pk.length
      ? pk.map(function (k) { return barra(nombrePlataforma(k), plat[k], maxPlat, plat[k], ''); }).join('')
      : '<p style="color:var(--ink-muted);font-size:13px">Sin actividades registradas.</p>';

  var est = m.envejecimiento.estancadas;
  $('listaEstancadas').innerHTML = est.length
      ? '<div class="lista-simple">' + est.slice(0, 12).map(function (e) {
          return '<div class="it"><div><b>' + esc(e.id) + '</b><br>' +
                 '<span style="color:var(--ink-muted)">' + esc(nombreFase(e.fase)) + ' · ' +
                 esc(nombreCorto(e.responsable)) + '</span></div>' +
                 '<span class="dias">' + e.diasHabilesEnFase + ' d / ' + e.slaDias + '</span></div>';
        }).join('') + '</div>' +
        (est.length > 12 ? '<p class="nota">y ' + (est.length - 12) + ' más.</p>' : '')
      : '<p style="color:var(--ink-muted);font-size:13px">Ninguna actividad supera el SLA de su fase.</p>';
}

/* ================= Iniciativas ================= */
function cargarIniciativas() {
  if (DATOS.matriz) {
    prepararFiltrosIniciativas(DATOS.matriz);
    pintarIniciativas();
    return;
  }
  cargando(VISTA_INI === 'matriz' ? 'matriz' : 'prioridades', 'matriz');
  api('getMatrizIniciativas').then(function (r) {
    DATOS.matriz = r;
    prepararFiltrosIniciativas(r);
    pintarIniciativas();
  }).catch(fallo);
}

/**
 * Llena los combos de la pagina. Vive aparte de la consulta porque los datos
 * pueden llegar por la precarga en segundo plano y no solo por abrir la pagina.
 */
function prepararFiltrosIniciativas(r) {
  if (DATOS.filtrosIniListos) return;
  $('filtroEstadoIni').innerHTML = '<option value="">Todos los estados</option>' +
      r.estados.map(function (e) {
        return '<option value="' + e.id + '">' + esc(e.nombre) + '</option>';
      }).join('');
  $('filtroTipoIni').innerHTML = '<option value="">Todos los tipos</option>' +
      r.tipos.map(function (t) {
        return '<option value="' + t.id + '">' + esc(t.nombre) + '</option>';
      }).join('');
  $('filtroPrioridadIni').innerHTML = '<option value="">Todas las prioridades</option>' +
      r.prioridades.map(function (pr) {
        return '<option value="' + pr.id + '">' + esc(pr.nombre) + '</option>';
      }).join('');
  $('filtroPlataformaIni').innerHTML = '<option value="">Todas las plataformas</option>' +
      r.plataformas.map(function (pl) {
        return '<option value="' + pl.id + '">' + esc(pl.nombre) + '</option>';
      }).join('') + '<option value="__SIN__">Sin plataforma asignada</option>';
  DATOS.filtrosIniListos = true;
}
$('buscIni').addEventListener('input', pintarIniciativas);
$('filtroEstadoIni').addEventListener('change', pintarIniciativas);
$('filtroTipoIni').addEventListener('change', pintarIniciativas);
$('filtroPrioridadIni').addEventListener('change', pintarIniciativas);
$('filtroPlataformaIni').addEventListener('change', pintarIniciativas);

/**
 * Vista activa del portafolio: la matriz LEN x vertical, o las columnas por
 * prioridad. Los dos cortes leen los mismos datos y respetan los mismos
 * filtros; cambia el eje con el que se agrupan.
 */
var VISTA_INI = 'matriz';

$('vistaIni').addEventListener('click', function (e) {
  var boton = e.target.closest('button[data-vista]');
  if (!boton || boton.dataset.vista === VISTA_INI) return;
  VISTA_INI = boton.dataset.vista;
  Array.prototype.forEach.call(this.querySelectorAll('button'), function (b) {
    b.classList.toggle('activa', b.dataset.vista === VISTA_INI);
  });
  pintarIniciativas();
});

function pintarIniciativas() {
  var vista = VISTA_INI;
  [['vistaMatriz', 'matriz'], ['prioridades', 'prioridad'], ['vistaListado', 'listado'],
   ['subMatriz', 'matriz'], ['subPrioridad', 'prioridad'], ['subListado', 'listado'],
   ['notaMatriz', 'matriz'], ['notaPrioridad', 'prioridad'], ['notaListado', 'listado']
  ].forEach(function (par) {
    $(par[0]).hidden = (par[1] !== vista);
  });
  // La caja de "sin clasificar" la llena la matriz. En las otras vistas esas
  // iniciativas ya aparecen entre las demas, asi que se recoge.
  if (vista !== 'matriz') $('sinClasificar').hidden = true;

  if (vista === 'matriz') pintarMatriz();
  else if (vista === 'prioridad') pintarPorPrioridad();
  else pintarListadoIniciativas();
}

/**
 * Todas las iniciativas del portafolio en una sola tabla.
 *
 * La matriz responde donde estamos invirtiendo y las columnas por prioridad
 * que es lo mas urgente. Esta vista responde la pregunta mas simple de todas,
 * y la que ninguna de las dos contesta bien: cuales son, todas, en una lista
 * que se pueda recorrer de arriba abajo y buscar con los ojos.
 */
function pintarListadoIniciativas() {
  var r = DATOS.matriz;
  if (!r) return;
  var pasa = filtroIniciativas();

  var todas = [];
  Object.keys(r.celdas).forEach(function (k) { todas = todas.concat(r.celdas[k]); });
  var visibles = todas.filter(pasa).sort(function (a, b) {
    return String(a.nombre).localeCompare(String(b.nombre), 'es');
  });

  $('tituloListado').textContent = visibles.length === 1
      ? '1 iniciativa'
      : visibles.length + ' iniciativas';

  var sinDato = function (texto) {
    return '<span style="color:var(--ink-faint)">' + texto + '</span>';
  };

  var columnas = ['Iniciativa', 'LEN', 'Vertical', 'Estado', 'Plataforma', 'Business Owner'];

  $('listadoIni').innerHTML =
    '<thead><tr><th style="width:26px"></th>' + columnas.map(function (c) {
      return '<th>' + esc(c) + '</th>';
    }).join('') + '</tr></thead><tbody>' +
    (visibles.length
      ? visibles.map(function (i) {
          var estado = nombreDeCatalogo(r.estados, i.estado);
          var abierta = INI_ABIERTAS[i.idProyecto];
          return '<tr class="ini-fila' + (abierta ? ' ini-abierta' : '') +
              '" data-ini="' + esc(i.idProyecto) + '" role="button" tabindex="0"' +
              ' aria-expanded="' + (abierta ? 'true' : 'false') + '">' +
            '<td class="ini-flecha">' + (abierta ? '&#9662;' : '&#9656;') + '</td>' +
            '<td style="font-weight:600">' + esc(i.nombre) + '</td>' +
            '<td>' + (i.lenId ? esc(nombreDeCatalogo(r.lineas, i.lenId)) : sinDato('sin LEN')) + '</td>' +
            '<td>' + (i.verticalId ? esc(nombreDeCatalogo(r.verticales, i.verticalId))
                                   : sinDato('sin vertical')) + '</td>' +
            '<td>' + (i.estado
                       ? '<span class="badge ' + (CLASE_ESTADO_INI[i.estado] || 'e-cancelada') +
                         '">' + esc(estado) + '</span>'
                       : sinDato('sin estado')) + '</td>' +
            '<td>' + (i.plataforma ? esc(i.plataforma) : sinDato('sin plataforma')) + '</td>' +
            '<td>' + (i.bo ? esc(i.bo) : sinDato('sin asignar')) + '</td>' +
          '</tr>' +
          (abierta
            ? '<tr class="ini-abierta"><td></td><td colspan="' + columnas.length +
              '" style="padding-top:0">' + detalleIniciativa(i.idProyecto) + '</td></tr>'
            : '');
        }).join('')
      : '<tr><td colspan="' + (columnas.length + 1) + '" style="color:var(--ink-faint);' +
        'text-align:center">Ninguna iniciativa coincide con los filtros.</td></tr>') +
    '</tbody>';
}

/** Iniciativas desplegadas en el listado, por ID. */
var INI_ABIERTAS = {};

$('listadoIni').addEventListener('click', function (e) {
  var fila = e.target.closest('.ini-fila[data-ini]');
  if (fila) alternarIniciativa(fila.dataset.ini);
});
$('listadoIni').addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  var fila = e.target.closest('.ini-fila[data-ini]');
  if (!fila) return;
  e.preventDefault();
  alternarIniciativa(fila.dataset.ini);
});

function alternarIniciativa(idProyecto) {
  if (INI_ABIERTAS[idProyecto]) {
    delete INI_ABIERTAS[idProyecto];
    pintarListadoIniciativas();
    return;
  }
  INI_ABIERTAS[idProyecto] = true;

  // Las solicitudes ya viajan al navegador para el tablero de Gestion, y la
  // precarga en segundo plano suele haberlas traido. Si todavia no, se piden
  // una sola vez y de ahi en adelante desplegar es instantaneo.
  if (DATOS.kanban) { pintarListadoIniciativas(); return; }
  pintarListadoIniciativas();
  api('getDatosKanban', {}).then(function (r) {
    if (!r) return;
    DATOS.kanban = r;
    prepararFiltrosKanban(r);
    pintarListadoIniciativas();
  }).catch(fallo);
}

/**
 * Las solicitudes de una iniciativa, con su avance por el embudo.
 *
 * Responde "como va cada tema" sin salir del listado: hasta donde llego cada
 * solicitud, si esta trabada y cuando se espera que salga, que es la fecha
 * planeada de la version que tiene asignada.
 */
function detalleIniciativa(idProyecto) {
  if (!DATOS.kanban) {
    return '<div class="sol-cab">Cargando las solicitudes…</div>';
  }

  var solicitudes = DATOS.kanban.solicitudes.filter(function (s) {
    return s.ID_Proyecto === idProyecto;
  }).sort(function (a, b) {
    // Orden del backlog: el que la iniciativa definio. Lo que no tenga orden
    // va al final, no al principio por valer cero.
    var oa = Number(a.Orden_Iniciativa) || 9999;
    var ob = Number(b.Orden_Iniciativa) || 9999;
    if (oa !== ob) return oa - ob;
    return String(a.ID_Solicitud).localeCompare(String(b.ID_Solicitud), 'es');
  });

  if (!solicitudes.length) {
    return '<div class="sol-cab">Esta iniciativa todavía no tiene solicitudes.</div>';
  }

  var bloqueadas = 0, vencidas = 0;
  solicitudes.forEach(function (s) {
    if (estaBloqueada(s)) bloqueadas++;
    else if (estaVencida(s)) vencidas++;
  });

  var resumen = solicitudes.length + (solicitudes.length === 1 ? ' solicitud' : ' solicitudes') +
      (bloqueadas ? ' · ' + bloqueadas + (bloqueadas === 1 ? ' bloqueada' : ' bloqueadas') : '') +
      (vencidas ? ' · ' + vencidas + (vencidas === 1 ? ' vencida' : ' vencidas') + ' en su fase' : '');

  return '<div class="sol-cab">' + esc(resumen) + '</div>' +
         solicitudes.map(filaSolicitud).join('');
}

function estaBloqueada(s) {
  return String(s.Tiene_Bloqueo).toUpperCase().indexOf('S') === 0;
}
function estaVencida(s) {
  return s.Sla_Fase && s.Dias_En_Fase !== null && s.Dias_En_Fase > s.Sla_Fase;
}

/** Una solicitud dentro del desplegable de su iniciativa. */
function filaSolicitud(s) {
  var bloqueada = estaBloqueada(s);
  var vencida = !bloqueada && estaVencida(s);
  var alerta = bloqueada ? 'bloqueada' : (vencida ? 'vencida' : '');

  // La barra: una casilla por fase del embudo, llenas hasta donde va.
  var indice = 0;
  CAT.fases.forEach(function (f, i) { if (f.id === s.Fase_Actual) indice = i + 1; });
  var barra = CAT.fases.map(function (f, i) {
    if (i + 1 < indice) return '<i class="hecha"></i>';
    if (i + 1 === indice) {
      return '<i class="actual' + (bloqueada ? ' mal' : (vencida ? ' ojo' : '')) + '"></i>';
    }
    return '<i></i>';
  }).join('');

  var version = versionDeSolicitud(s);

  return '<div class="sol ' + alerta + '">' +
    '<span class="sol-id">' + esc(s.ID_Solicitud) + '</span>' +
    '<span class="sol-nombre">' + esc(s.Nombre_Solicitud) +
      (bloqueada
        ? '<div class="causal">&#9888;&#65039; ' +
          esc(nombreDeCatalogo(CAT.causales, s.Causal_Bloqueo)) +
          (s.Observacion_Bloqueo ? ' · ' + esc(s.Observacion_Bloqueo) : '') + '</div>'
        : '') +
      (vencida
        ? '<div class="causal ambar">' + s.Dias_En_Fase + ' días hábiles en esta fase, ' +
          'el objetivo son ' + s.Sla_Fase + '</div>'
        : '') +
    '</span>' +
    '<span class="fases">' + barra + '</span>' +
    '<span class="sol-fase">' + esc(nombreFase(s.Fase_Actual)) + ' · ' +
      '<span class="badge ' + (CLASE_ESTADO[s.Estado_Actual] || 'e-por-iniciar') + '">' +
      esc(nombreEstado(s.Estado_Actual)) + '</span></span>' +
    '<span class="sol-quien">' +
      (s.Nombre_Responsable ? esc(s.Nombre_Responsable) : sinAsignarTexto()) + '</span>' +
    '<span class="sol-ver">' + version + '</span>' +
  '</div>';
}

function sinAsignarTexto() {
  return '<span style="color:var(--ink-faint)">sin asignar</span>';
}

/**
 * Version de la solicitud y cuando se espera que salga. La fecha sale del
 * roadmap: es el unico dato de plan que existe hoy, y responde la pregunta sin
 * pedirle al equipo que registre fechas una por una.
 */
function versionDeSolicitud(s) {
  if (!s.Version_Semantica) {
    return '<b style="color:var(--ink-faint)">—</b><br>' +
           '<span style="color:var(--ink-faint)">sin versión</span>';
  }
  var v = null;
  (DATOS.kanban.versiones || []).forEach(function (x) {
    if (x.valor === s.Version_Semantica &&
        (!x.plataformaId || x.plataformaId === s.Plataforma_ID)) v = x;
  });

  var pie = 'sin fecha en el roadmap';
  if (v && v.fechaReal) pie = 'salió ' + fecha(v.fechaReal);
  else if (v && v.fechaPlaneada) pie = 'planeada ' + fecha(v.fechaPlaneada);

  return '<b>' + esc(s.Version_Semantica) + '</b><br>' + esc(pie);
}

/**
 * Arma el predicado de los filtros de la pagina. Lo comparten las dos vistas:
 * lo que se ve en una es exactamente lo que se ve en la otra, reagrupado.
 */
function filtroIniciativas() {
  var q = $('buscIni').value.toLowerCase();
  var estado = $('filtroEstadoIni').value;
  var tipo = $('filtroTipoIni').value;
  var prioridad = $('filtroPrioridadIni').value;
  var plataforma = $('filtroPlataformaIni').value;

  return function (i) {
    if (estado && i.estado !== estado) return false;
    if (tipo && i.tipo !== tipo) return false;
    if (prioridad && i.prioridad !== prioridad) return false;
    if (plataforma === '__SIN__') {
      if (i.plataformaId) return false;
    } else if (plataforma && i.plataformaId !== plataforma) {
      return false;
    }
    if (q && String(i.nombre).toLowerCase().indexOf(q) === -1) return false;
    return true;
  };
}

function ordenPorPrioridad(a, b) {
  var pa = pesoPrioridad_(a.prioridad), pb = pesoPrioridad_(b.prioridad);
  if (pa !== pb) return pa - pb;
  return String(a.nombre).localeCompare(String(b.nombre), 'es');
}

function pintarMatriz() {
  var r = DATOS.matriz;
  if (!r) return;
  var pasa = filtroIniciativas();
  var cont = $('matriz');

  // Filas: lineas estrategicas de negocio. Columnas: verticales de producto.
  // Las celdas se indexan siempre como "vertical|LEN", que es como las arma el
  // backend.
  var filas = r.lineas;
  var columnas = r.verticales;

  // Una columna extra a la derecha y una fila extra abajo para los totales.
  cont.style.gridTemplateColumns = '150px repeat(' + columnas.length + ',1fr) 96px';

  function filtrar(lista) {
    return (lista || []).filter(pasa);
  }

  // Se resuelve cada celda una sola vez y de ahi salen los totales: asi las
  // sumas siempre corresponden a lo que se esta viendo con los filtros puestos.
  var porCelda = {};
  var totalFila = {}, totalColumna = {}, granTotal = 0;
  filas.forEach(function (f) {
    totalFila[f.id] = 0;
    columnas.forEach(function (c) {
      if (totalColumna[c.id] === undefined) totalColumna[c.id] = 0;
      var items = filtrar(r.celdas[c.id + '|' + f.id]).sort(ordenPorPrioridad);
      porCelda[f.id + '>' + c.id] = items;
      totalFila[f.id] += items.length;
      totalColumna[c.id] += items.length;
      granTotal += items.length;
    });
  });

  function celdaTotal(valor, etiqueta, clase) {
    return '<div class="mz-total' + (clase ? ' ' + clase : '') +
           (valor === 0 ? ' cero' : '') + '">' + valor +
           '<small>' + esc(etiqueta) + '</small></div>';
  }

  var html = '<div class="mz-cab esquina">LEN \\ Vertical</div>';
  columnas.forEach(function (c) { html += '<div class="mz-cab">' + esc(c.nombre) + '</div>'; });
  html += '<div class="mz-cab">Total</div>';

  filas.forEach(function (f) {
    html += '<div class="mz-fila">' + esc(f.nombre) + '</div>';
    columnas.forEach(function (c) {
      var items = porCelda[f.id + '>' + c.id];
      html += '<div class="mz-celda' + (items.length ? '' : ' vacia-celda') + '">' +
              (items.length > 3 ? '<div class="mz-conteo">' + items.length + ' iniciativas · desplace</div>' : '') +
              items.map(function (i) { return tarjetaIniciativa(i); }).join('') + '</div>';
    });
    html += celdaTotal(totalFila[f.id], 'en la LEN', '');
  });

  // Fila de cierre: total por vertical y total general.
  html += '<div class="mz-fila">Total</div>';
  columnas.forEach(function (c) {
    html += celdaTotal(totalColumna[c.id], 'en la vertical', '');
  });
  html += celdaTotal(granTotal, 'clasificadas', 'general');

  cont.innerHTML = html;

  var sueltas = [];
  Object.keys(r.celdas).forEach(function (k) {
    var p = k.split('|');
    if (p[0].indexOf('VER-') !== 0 || p[1].indexOf('LEN-') !== 0) {
      sueltas = sueltas.concat(filtrar(r.celdas[k]));
    }
  });
  var caja = $('sinClasificar');
  // Solo tiene sentido en la matriz: en la vista por prioridad estas mismas
  // iniciativas ya aparecen en su columna, con LEN y vertical en la tarjeta.
  caja.innerHTML = sueltas.length
      ? '<h3>Sin clasificar · ' + sueltas.length + '</h3>' +
        '<p class="nota" style="margin:0 0 10px">Les falta línea estratégica o vertical en la hoja de iniciativas.</p>' +
        '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px">' +
        sueltas.sort(ordenPorPrioridad)
               .map(function (i) { return tarjetaIniciativa(i); }).join('') + '</div>'
      : '';
  caja.hidden = !sueltas.length;
}

/**
 * Portafolio en columnas por prioridad: critica, alta, media y baja.
 *
 * La matriz responde "en que cruce de LEN y vertical estamos invirtiendo"; esta
 * vista responde "que es lo mas urgente", que es otra conversacion. Por eso
 * aqui entran tambien las iniciativas sin LEN o sin vertical: en la matriz no
 * tienen celda, pero una iniciativa critica sin clasificar sigue siendo
 * critica.
 */
function pintarPorPrioridad() {
  var r = DATOS.matriz;
  if (!r) return;
  var pasa = filtroIniciativas();

  var todas = [];
  Object.keys(r.celdas).forEach(function (k) { todas = todas.concat(r.celdas[k]); });
  var visibles = todas.filter(pasa);

  var columnas = r.prioridades.slice().sort(function (a, b) {
    return pesoPrioridad_(a.id) - pesoPrioridad_(b.id);
  });

  var grupos = {};
  columnas.forEach(function (p) { grupos[p.id] = []; });
  var sinPrioridad = [];
  visibles.forEach(function (i) {
    if (grupos[i.prioridad]) grupos[i.prioridad].push(i);
    else sinPrioridad.push(i);
  });

  var porNombre = function (a, b) {
    return String(a.nombre).localeCompare(String(b.nombre), 'es');
  };

  function columna(id, nombre, lista) {
    lista.sort(porNombre);
    return '<div class="pr-col' + (lista.length ? '' : ' vacia') + '">' +
      '<div class="pr-cab">' +
        '<span class="chip ' + (PRIORIDAD_CLASE[id] || 'p-baja') + '">' + esc(nombre) + '</span>' +
        '<span class="cuenta">' + lista.length + '</span>' +
      '</div>' +
      (lista.length
        ? lista.map(function (i) { return tarjetaIniciativa(i, true); }).join('')
        : '<p class="pr-vacia">Ninguna con este filtro.</p>') +
    '</div>';
  }

  var html = columnas.map(function (p) {
    return columna(p.id, p.nombre, grupos[p.id]);
  }).join('');

  // La columna de las que no tienen prioridad solo aparece si hay alguna: no
  // tiene sentido mostrar un hueco permanente por un dato que puede estar bien.
  if (sinPrioridad.length) {
    html += columna('', 'Sin prioridad', sinPrioridad);
  }

  $('prioridades').innerHTML = html;
}

/** Peso de orden de una prioridad; lo desconocido va al final. */
function pesoPrioridad_(id) {
  return PESO_PRIORIDAD[id] === undefined ? 9 : PESO_PRIORIDAD[id];
}

/**
 * @param {!Object} i Iniciativa.
 * @param {boolean=} conClasificacion Muestra LEN y vertical en la tarjeta. En
 *     la matriz sobran, porque la posicion de la tarjeta ya las dice.
 */
function tarjetaIniciativa(i, conClasificacion) {
  var nombreEst = nombreDeCatalogo(DATOS.matriz.estados, i.estado) || 'Sin estado';
  var clase = CLASE_ESTADO_INI[i.estado] || 'e-cancelada';
  var franja = FRANJA_ESTADO_INI[i.estado] || '';
  var tipo = nombreDeCatalogo(DATOS.matriz.tipos, i.tipo);

  var sinAsignar = function (texto) {
    return '<span style="color:var(--ink-faint)">' + texto + '</span>';
  };

  var clasificacion = conClasificacion
      ? '<div class="clasif">' +
        '<span class="chip c-len">' +
        esc(nombreDeCatalogo(DATOS.matriz.lineas, i.lenId) || 'Sin LEN') + '</span>' +
        '<span class="chip c-vertical">' +
        esc(nombreDeCatalogo(DATOS.matriz.verticales, i.verticalId) || 'Sin vertical') + '</span>' +
        '</div>'
      : '';

  var fechas = (i.fechaInicio || i.fechaFinPlaneada)
      ? '<div class="fechas">' +
        (i.fechaInicio ? '<span>Inicio ' + esc(fecha(i.fechaInicio)) + '</span>' : '') +
        (i.fechaFinPlaneada ? '<span>Fin ' + esc(fecha(i.fechaFinPlaneada)) + '</span>' : '') + '</div>'
      : '<div class="fechas"><span>Sin fechas registradas</span></div>';

  return '<article class="ini ' + franja + (i.prioridad === 'PRI-01' ? ' critica' : '') + '">' +
    '<h4>' + esc(i.nombre) + '</h4>' +
    '<div class="meta">' +
      '<span class="badge ' + clase + '">' + esc(nombreEst) + '</span>' +
      (i.prioridadNombre
        ? '<span class="chip ' + (PRIORIDAD_CLASE[i.prioridad] || 'p-baja') + '">' +
          esc(i.prioridadNombre) + '</span>'
        : '') +
      (tipo ? '<span class="chip c-tipo">' + esc(tipo) + '</span>' : '') +
    '</div>' +
    '<div class="personas">' +
      '<span><b>BO</b> ' + (i.bo ? esc(i.bo) : sinAsignar('sin asignar')) + '</span>' +
      '<span><b>PO</b> ' + (i.po ? esc(i.po) : sinAsignar('sin asignar')) + '</span>' +
    '</div>' +
    '<div class="meta">' +
      '<span class="act">' + i.actividades + ' act.' +
        (i.actividadesAbiertas ? ' · ' + i.actividadesAbiertas +
          (i.actividadesAbiertas === 1 ? ' abierta' : ' abiertas') : '') + '</span>' +
      '<span class="app">' + (i.plataforma ? esc(i.plataforma) : sinAsignar('sin plataforma')) + '</span>' +
    '</div>' + fechas + clasificacion +
  '</article>';
}

/* ================= Gestion (Kanban) ================= */
function cargarGestion(forzar) {
  // Se traen todas las actividades una sola vez y el filtrado ocurre en el
  // navegador: asi la busqueda predictiva responde sin esperar al servidor.
  if (!forzar && DATOS.kanban) { pintarKanban(); return; }
  cargando('kanban', 'tablero');
  api('getDatosKanban', {}).then(function (r) {
    DATOS.kanban = r;
    prepararFiltrosKanban(r);
    pintarKanban();
  }).catch(fallo);
}

/** Catalogos de los filtros, en el orden pedido y alfabeticamente. */
function prepararFiltrosKanban(r) {
  if (DATOS.filtrosListos) return;

  var proyectoPorId = {};
  r.proyectos.forEach(function (p) { proyectoPorId[p.ID_Proyecto] = p; });
  DATOS.proyectoPorId = proyectoPorId;

  // Solo se ofrecen las LEN y verticales que realmente tienen iniciativas.
  var lenUsadas = {}, verticalesUsadas = {};
  r.proyectos.forEach(function (p) {
    if (p.LEN_ID) lenUsadas[p.LEN_ID] = true;
    if (p.Vertical_ID) verticalesUsadas[p.Vertical_ID] = true;
  });

  llenarCombo('dlLen', CAT.lineasEstrategicas
      .filter(function (l) { return lenUsadas[l.id]; })
      .map(function (l) { return { id: l.id, texto: l.nombre }; }));
  llenarCombo('dlVertical', CAT.verticales
      .filter(function (v) { return verticalesUsadas[v.id]; })
      .map(function (v) { return { id: v.id, texto: v.nombre }; }));
  llenarCombo('dlProyecto', r.proyectos.map(function (p) {
    return { id: p.ID_Proyecto, texto: p.Nombre_Proyecto };
  }));
  llenarCombo('dlPlataforma', r.plataformas.map(function (p) {
    return { id: p.id, texto: p.nombre };
  }));
  llenarCombo('dlResponsable', r.usuarios.map(function (u) {
    return { id: u.ID_Usuario, texto: u.Nombre_Completo };
  }));

  DATOS.filtrosListos = true;
}

/**
 * Llena una lista predictiva y guarda la equivalencia texto -> identificador.
 * Las opciones quedan ordenadas alfabeticamente.
 */
var EQUIVALENCIAS = {};
function llenarCombo(idLista, opciones) {
  var ordenadas = opciones.slice().sort(function (a, b) {
    return String(a.texto).localeCompare(String(b.texto), 'es');
  });
  EQUIVALENCIAS[idLista] = {};
  ordenadas.forEach(function (o) {
    EQUIVALENCIAS[idLista][String(o.texto).toLowerCase()] = o.id;
  });
  $(idLista).innerHTML = ordenadas.map(function (o) {
    return '<option value="' + esc(o.texto) + '"></option>';
  }).join('');
}

/**
 * Lee un combo: devuelve el identificador elegido, '' si esta vacio, o null si
 * lo escrito no corresponde a ninguna opcion.
 */
function valorCombo(idCampo, idLista) {
  var campo = $(idCampo);
  var texto = campo.value.trim().toLowerCase();
  if (!texto) { campo.classList.remove('sin-coincidencia'); return ''; }
  var id = EQUIVALENCIAS[idLista] ? EQUIVALENCIAS[idLista][texto] : undefined;
  campo.classList.toggle('sin-coincidencia', id === undefined);
  return id === undefined ? null : id;
}

/** Aplica todos los filtros sobre las actividades ya cargadas. */
function solicitudesFiltradas() {
  var r = DATOS.kanban;
  var len = valorCombo('fLen', 'dlLen');
  var vertical = valorCombo('fVertical', 'dlVertical');
  var proyecto = valorCombo('fProyecto', 'dlProyecto');
  var plataforma = valorCombo('fPlataforma', 'dlPlataforma');
  var responsable = valorCombo('fResponsable', 'dlResponsable');
  var texto = $('fTexto').value.trim().toLowerCase();

  return r.solicitudes.filter(function (s) {
    var proy = DATOS.proyectoPorId[s.ID_Proyecto] || {};
    if (len && proy.LEN_ID !== len) return false;
    if (vertical && proy.Vertical_ID !== vertical) return false;
    if (proyecto && s.ID_Proyecto !== proyecto) return false;
    if (plataforma && s.Plataforma_ID !== plataforma) return false;
    if (responsable && s.Responsable_ID !== responsable) return false;
    if (texto) {
      var pajar = (s.ID_Solicitud + ' ' + s.Nombre_Solicitud + ' ' + s.Nombre_Iniciativa).toLowerCase();
      if (pajar.indexOf(texto) === -1) return false;
    }
    return true;
  });
}

['fLen', 'fVertical', 'fProyecto', 'fPlataforma', 'fResponsable', 'fTexto'].forEach(function (id) {

function pintarKanban() {
  var r = DATOS.kanban;
  var visibles = solicitudesFiltradas();
  $('kanban').innerHTML = r.fases.map(function (f) {
    var enFase = visibles.filter(function (s) { return s.Fase_Actual === f.id; })
        .sort(function (a, b) {
          // Primero lo que el negocio numero dentro de su iniciativa; lo no
          // numerado va despues, ordenado por prioridad.
          var oa = Number(a.Orden_Iniciativa) || 999;
          var ob = Number(b.Orden_Iniciativa) || 999;
          if (oa !== ob) return oa - ob;
          var pa = PESO_PRIORIDAD[a.Prioridad], pb = PESO_PRIORIDAD[b.Prioridad];
          if (pa === undefined) pa = 9;
          if (pb === undefined) pb = 9;
          return pa - pb;
        });
    return '<div class="col" data-fase="' + f.id + '">' +
      '<div class="col-cab"><span class="orden num">' + f.orden + '</span>' +
      '<h3>' + esc(f.nombre) + '</h3>' +
      '<span class="cuenta">' + enFase.length + '</span></div>' +
      (enFase.length
        ? enFase.slice(0, 40).map(tarjetaActividad).join('') +
          (enFase.length > 40 ? '<div class="vacia">y ' + (enFase.length - 40) + ' más</div>' : '')
        : '<div class="vacia">Sin actividades</div>') + '</div>';
  }).join('');

  $('subGestion').textContent = visibles.length + ' de ' + r.solicitudes.length +
      ' solicitudes · ' + (CTX.puedeOperarTablero
        ? 'arrastre las tarjetas para cambiarlas de fase'

}

/* --- Arrastrar y soltar --- */
document.addEventListener('dragstart', function (e) {
  var t = e.target.closest('.tarjeta');
  if (!t) return;
  arrastrada = t.dataset.id;
  t.classList.add('arrastrando');
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', arrastrada); } catch (err) {}
});
document.addEventListener('dragend', function (e) {
  var t = e.target.closest('.tarjeta');
  if (t) t.classList.remove('arrastrando');
  document.querySelectorAll('.col').forEach(function (c) {
    c.classList.remove('destino', 'vetada');
  });
  arrastrada = null;
});
document.addEventListener('dragover', function (e) {
  var col = e.target.closest('.col');
  if (!col || !arrastrada) return;
  e.preventDefault();
  var s = solicitudPorId(arrastrada);
  var v = validarTransicionCliente(s.Fase_Actual, col.dataset.fase);
  document.querySelectorAll('.col').forEach(function (c) {
    c.classList.remove('destino', 'vetada');
  });
  col.classList.add(v.permitido ? 'destino' : 'vetada');
});
document.addEventListener('drop', function (e) {
  var col = e.target.closest('.col');
  if (!col || !arrastrada) return;
  e.preventDefault();
  var id = arrastrada;
  var s = solicitudPorId(id);
  var destino = col.dataset.fase;

  // Validacion optimista en el navegador; el backend vuelve a validarla.
  var v = validarTransicionCliente(s.Fase_Actual, destino);
  if (!v.permitido) { toast(v.motivo, true); return; }

  var faseOrigen = s.Fase_Actual;
  s.Fase_Actual = destino;
  pintarKanban();

  api('cambiarFaseSolicitud', id, destino).then(function (r) {
    toast(id + ' pasó a ' + nombreFase(destino) + '.');
    (r.avisos || []).forEach(function (a) { toast(a, true); });
    invalidarCacheCliente();
    cargarGestion(true);
  }).catch(function (err) {
    s.Fase_Actual = faseOrigen;     // el backend rechazo: se revierte la tarjeta
    pintarKanban();
    fallo(err);
  });
});

function solicitudPorId(id) {
  return DATOS.kanban.solicitudes.filter(function (s) { return s.ID_Solicitud === id; })[0];
}

/** Espejo de validarTransicion() del backend, para dar respuesta inmediata. */
function validarTransicionCliente(origen, destino) {
  if (!CTX.puedeOperarTablero) {
    return { permitido: false,
             motivo: 'Solo el Product Owner y el Administrador pueden mover tarjetas.' };
  }
  if (CTX.esAdmin) return { permitido: true, motivo: '' };
  var a = ordenDeFase(origen), b = ordenDeFase(destino);
  if (a === b) return { permitido: false, motivo: 'La actividad ya está en esa fase.' };
  var puede = function (f) { return CTX.fasesEditables.indexOf(f) !== -1; };
  if (b > a) {
    if (b - a > 1) return { permitido: false, motivo: 'No se permite saltar fases. Solo el Administrador puede hacerlo.' };
    if (!puede(origen)) return { permitido: false, motivo: 'Su rol no tiene permiso sobre la fase de origen.' };
    return { permitido: true, motivo: '' };
  }
  if (!puede(destino)) return { permitido: false, motivo: 'Su rol no tiene permiso sobre la fase de destino.' };
  return { permitido: true, motivo: '' };
}

function cargarRoadmap() {
  $('btnNuevaVersion').hidden = !CTX.puedeGestionarVersiones;
  if (DATOS.roadmap) { pintarRoadmap(); return; }
  cargando('roadmap', 'lista');
  api('getRoadmapVersiones').then(function (r) {
    DATOS.roadmap = r;
    $('fRmPlataforma').innerHTML = '<option value="">Todas las plataformas</option>' +
        r.plataformas.map(function (p) {
          return '<option value="' + esc(p.id) + '">' + esc(p.nombre) + '</option>';
        }).join('');
    pintarRoadmap();
  }).catch(fallo);
}
$('fRmPlataforma').addEventListener('change', pintarRoadmap);
$('fRmEstado').addEventListener('change', pintarRoadmap);

function pintarRoadmap() {
  var r = DATOS.roadmap;
  var fp = $('fRmPlataforma').value;
  var fe = $('fRmEstado').value;

  var todas = [];
  Object.keys(r.porPlataforma).forEach(function (k) {
    todas = todas.concat(r.porPlataforma[k]);
  });
  var planeadas = todas.filter(function (v) { return v.estadoRelease === 'Planeada'; }).length;

  $('kpisRoadmap').innerHTML = [
    kpi('Entregas en la fecha planeada', r.cumplimiento.onTimePct, ' %',
        r.cumplimiento.versionesEvaluadas + ' versiones ya desplegadas',
        r.cumplimiento.onTimePct >= 70 ? 'bien' : 'mal'),
    kpi('Desvío promedio', r.cumplimiento.desvioPromedioDias, ' d', 'Días respecto a lo planeado'),
    kpi('Versiones planeadas', planeadas, '', 'Aún sin desplegar'),
    kpi('Versiones en producción', todas.length - planeadas, '', 'Histórico del roadmap')
  ].join('');

  var html = Object.keys(r.porPlataforma).filter(function (k) {
    return !fp || k === fp;
  }).map(function (idPlat) {
    var versiones = r.porPlataforma[idPlat].filter(function (v) {
      return !fe || v.estadoRelease === fe;
    });
    if (!versiones.length) return '';
    return '<div class="rm-plataforma">' +
      '<div class="rm-cab">' + esc(nombrePlataforma(idPlat)) +
        '<span class="cuenta">' + versiones.length + ' versiones</span></div>' +
      '<div class="rm-fila encab"><span>Versión</span><span>Plataforma</span><span>Actividades</span>' +
        '<span>Fecha planeada</span><span>Fecha real</span><span>Desvío</span><span>Estado</span></div>' +
      versiones.map(function (v) {
        var d = v.desvioDias;
        var n = v.actividades.length;
        return '<div class="rm-version">' +
          '<div class="rm-fila' + (n ? ' desplegable' : '') + '"' +
            (n ? ' data-version="' + esc(v.idVersion) + '" role="button" tabindex="0"' +
                 ' aria-expanded="false"' : '') + '>' +
          '<span class="rm-ver num">' + esc(v.numeroVersion) + '</span>' +

/**
 * Lo que salio en una version: cada actividad con su codigo, su nombre y en
 * que fase quedo.
 *
 * Es la pregunta que se hace despues de cada despliegue —"que entro en la
 * 2.4?"— y hasta ahora la pagina solo respondia "siete cosas", sin decir
 * cuales.
 */
function detalleVersion(v) {
  return '<div class="rm-detalle-cab">Actividades de la versión ' + esc(v.numeroVersion) + '</div>' +
    v.actividades.slice().sort(function (a, b) {
      return String(a.id).localeCompare(String(b.id), 'es');
    }).map(function (a) {
      return '<div class="rm-act">' +
        '<span class="rm-act-id">' + esc(a.id) + '</span>' +
        '<span class="rm-act-nombre">' + esc(a.nombre) + '</span>' +
        '<span class="rm-act-fase">' + esc(nombreFase(a.fase)) + '</span>' +
        '<span><span class="badge ' + (CLASE_ESTADO[a.estado] || 'e-por-iniciar') + '">' +
          esc(nombreEstado(a.estado)) + '</span></span>' +
      '</div>';
    }).join('');
}

// Abrir y cerrar el detalle de una version. Se delega en el contenedor porque
// las filas se vuelven a dibujar con cada cambio de filtro.
$('roadmap').addEventListener('click', function (e) {

  if (lapiz) { formularioVersion(lapiz.dataset.editarVersion); return; }

$('btnNuevaVersion').addEventListener('click', function () { formularioVersion(''); });

/**
 * Alta y edicion de una version del roadmap, para los roles que lo gestionan.
 * Vive aqui y no en Administracion porque quien arma el plan de entrega no es
 * necesariamente administrador.
 */
function formularioVersion(idVersion) {
  abrirModal(idVersion ? 'Editar versión' : 'Nueva versión', '',
             '<p class="nota">Cargando…</p>', null);
  api('getFormularioVersion', idVersion).then(function (f) {
    var campos = construirCampos(f.columnas, f.opciones, f.valores, null);
    abrirModal(idVersion ? 'Editar versión' : 'Nueva versión',
      idVersion ? esc(f.valores.Numero_Version || '') : 'Se agrega al roadmap de la plataforma',
      '<div class="formulario">' +
        '<p class="nota" style="margin:0">El número y la plataforma identifican la versión: ' +
        'no puede haber dos iguales. Las solicitudes la verán en su lista de versiones ' +
        'disponibles.</p>' + campos + '</div>',
      function () {
        return api('guardarVersion', idVersion, leerCampos(f.columnas)).then(function () {
          toast(idVersion ? 'Versión actualizada.' : 'Versión creada.');
          DATOS.roadmap = null;
          cargarRoadmap();
        });
      });
  }).catch(function (err) { cerrarModal(); fallo(err); });
}
$('roadmap').addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  var fila = e.target.closest('.rm-fila[data-version]');
  if (!fila) return;
  e.preventDefault();
  alternarDetalleVersion(fila);
});

function alternarDetalleVersion(fila) {
  var detalle = $('det-' + fila.dataset.version);
  if (!detalle) return;
  var abierto = !detalle.hidden;
  detalle.hidden = abierto;
  fila.setAttribute('aria-expanded', String(!abierto));
  fila.classList.toggle('abierta', !abierto);
}

function textoCelda(col, valor) {

  var opciones = DATOS.admin.opciones[col.campo];
  if (opciones) {
    for (var i = 0; i < opciones.length; i++) {
      if (String(opciones[i].valor) === String(valor)) return opciones[i].texto;
    }
  }
  return valor;
}

/**
 * Arma los campos de un formulario a partir de la definicion de columnas del
 * esquema. Lo usan el CRUD de administracion y la migracion de solicitudes, de
 * modo que ambos respetan los mismos tipos, obligatorios y listas.
 *
 * @param {!Array<!Object>} columnas
 * @param {!Object} opciones Listas desplegables por campo.
 * @param {!Object} registro Valores actuales.
 * @param {string=} campoBloqueado Campo que no se puede editar.
 * @return {string} HTML de los campos.
 */
function construirCampos(columnas, opciones, registro, campoBloqueado) {
  return columnas.map(function (c) {
    var valor = registro[c.campo] === undefined || registro[c.campo] === null ? '' : registro[c.campo];
    var bloqueado = (campoBloqueado && c.campo === campoBloqueado) ? ' disabled' : '';
    var lista = opciones[c.campo];
    var control;

    if (lista) {
      control = '<select id="campo_' + c.campo + '"' + bloqueado + '>' +
        (c.requerido ? '' : '<option value="">(sin asignar)</option>') +
        lista.map(function (o) {
          return '<option value="' + esc(o.valor) + '"' +
                 (String(o.valor) === String(valor) ? ' selected' : '') + '>' +
                 esc(o.texto) + '</option>';
        }).join('') + '</select>';
    } else if (c.opciones) {
      control = '<select id="campo_' + c.campo + '"' + bloqueado + '>' +
        c.opciones.map(function (o) {
          return '<option value="' + esc(o) + '"' + (o === valor ? ' selected' : '') + '>' +
                 esc(o) + '</option>';
        }).join('') + '</select>';
    } else if (c.tipo === 'boolSN') {
      control = '<select id="campo_' + c.campo + '"' + bloqueado + '>' +
        ['SI', 'NO'].map(function (o) {
          return '<option value="' + o + '"' +
                 (String(valor).toUpperCase().indexOf(o) === 0 ? ' selected' : '') + '>' + o + '</option>';
        }).join('') + '</select>';
    } else if (c.tipo === 'longtext') {
      control = '<textarea id="campo_' + c.campo + '" rows="3"' + bloqueado + '>' + esc(valor) + '</textarea>';
    } else if (c.tipo === 'date' || c.tipo === 'datetime') {
      control = '<input type="date" id="campo_' + c.campo + '" value="' +
                fechaInput(valor) + '"' + bloqueado + '>';
    } else {
      var tipoInput = (c.tipo === 'number' || c.tipo === 'decimal') ? 'number'
                    : (c.tipo === 'email' ? 'email' : 'text');
      control = '<input type="' + tipoInput + '" id="campo_' + c.campo + '" value="' +
                esc(valor) + '"' + bloqueado + '>';
    }
    return '<label class="campo"><span>' + esc(c.etiqueta) + (c.requerido ? ' *' : '') +
           '</span>' + control + '</label>';
  }).join('');
}

/** Lee de vuelta los campos construidos por construirCampos(). */
function leerCampos(columnas) {
  var datos = {};
  columnas.forEach(function (c) {
    var el = $('campo_' + c.campo);
    datos[c.campo] = el ? el.value : '';
  });
  return datos;
}

function formularioRegistro(valorPk) {
  var r = DATOS.admin;
  var registro = valorPk
      ? r.filas.filter(function (f) { return String(f[r.pk]) === String(valorPk); })[0]
      : {};

  var campos = construirCampos(r.columnas, r.opciones, registro, valorPk ? r.pk : null);
  if (!valorPk) {
    campos = campos.replace('</label>',
        '<small style="color:var(--ink-faint)">Déjelo vacío y el sistema lo genera</small></label>');
  }

  abrirModal(valorPk ? 'Editar registro' : 'Nuevo registro',
    r.etiqueta, '<div class="formulario">' + campos + '</div>',
    function () {
      var nuevo = leerCampos(r.columnas);
      var metodo = valorPk ? 'adminActualizarRegistro' : 'adminCrearRegistro';
      var args = valorPk ? [metodo, r.tabla, valorPk, nuevo] : [metodo, r.tabla, nuevo];
      return api.apply(null, args).then(function () {
        toast(valorPk ? 'Registro actualizado.' : 'Registro creado.');
        invalidarCacheCliente();
        cargarTablaAdmin(r.tabla);
      });
    });
}

/* ================= Arranque ================= */

/**
 * Trae calladamente las paginas que el usuario todavia no ha abierto.
 *
 * Cada viaje al servidor de Apps Script cuesta cerca de un segundo solo en ida
 * y vuelta, y ese segundo se paga igual si nadie lo esta esperando. Mientras la
 * persona mira el Home, el tablero y la matriz se van trayendo; cuando hace
 * clic en la pestana, ya estan.
 *
 * Reglas: nunca pisa lo que ya esta cargado, va en cadena y no en paralelo para
 * no competir con lo que el usuario pida entretanto, y si algo falla se queda
 * callado — la pagina lo volvera a pedir cuando se abra de verdad.
 */
function precargarEnSegundoPlano() {
  setTimeout(function () {
    var pasos = [
      function () {
        if (DATOS.matriz) return Promise.resolve();
        return api('getMatrizIniciativas').then(function (r) {
          if (DATOS.matriz) return;
          DATOS.matriz = r;
          prepararFiltrosIniciativas(r);
        });
      },
      function () {
        if (DATOS.kanban) return Promise.resolve();
        return api('getDatosKanban', {}).then(function (r) {
          if (DATOS.kanban) return;
          DATOS.kanban = r;
          prepararFiltrosKanban(r);
        });
      }
    ];
    pasos.reduce(function (cadena, paso) {
      return cadena.then(paso).catch(function () {});
    }, Promise.resolve());
  }, 900);
}

/** Descarta lo que el navegador tiene guardado de las consultas anteriores. */

  boton.disabled = true;
  boton.textContent = 'Actualizando…';
  api('refrescarDatos').then(function () {
    invalidarCacheCliente();
    var actual = PAGINAS.filter(function (p) { return !$('pg-' + p).hidden; })[0] || 'home';
    navegar(actual);
    toast('Datos actualizados desde las hojas.');
  }).catch(fallo).then(function () {
    boton.disabled = false;
    boton.textContent = 'Actualizar';
  });
});

// Un solo viaje al servidor para sesion, catalogos e indicadores del Home.
/**
 * Pie de pagina: quien construyo la herramienta, que version esta corriendo y
 * de cuando es. Lo primero que hay que preguntar cuando alguien reporta algo
 * raro es que version esta viendo; que lo diga la propia pagina ahorra ese ida
 * y vuelta.
 */
function pintarPie(v) {
  if (!v) return;
  $('pieAutor').textContent = v.autor ? 'Hecho por ' + v.autor : '';
  $('pieVersion').textContent = v.numero ? 'Versión ' + v.numero : '';
  $('pieActualizacion').textContent = v.publicada
      ? 'Actualizada el ' + fechaHora(v.publicada)
      : 'Versión sin sellar';
}

/* ================= Ingreso ================= */

/** Muestra la pantalla de ingreso y esconde la aplicacion. */
function mostrarIngreso(motivo) {
  $('contenido').hidden = true;
  $('avisoAcceso').hidden = true;
  $('ingreso').hidden = false;
  $('btnActualizar').hidden = true;
  $('usuarioNombre').textContent = 'Sin sesión';
  $('usuarioRol').textContent = '';
  if (motivo) $('ingresoMotivo').textContent = motivo;
  $('pasoCodigo').hidden = true;
  $('pasoCorreo').hidden = false;
  errorIngreso('');
}

function errorIngreso(texto) {
  var caja = $('ingresoError');
  caja.textContent = texto || '';
  caja.hidden = !texto;
}

function ocupado(boton, texto, activo) {
  boton.disabled = activo;
  boton.textContent = texto;
}

$('btnPedirCodigo').addEventListener('click', function () {
  var correo = $('ingCorreo').value.trim();
  if (!correo) { errorIngreso('Escriba su correo.'); return; }
  errorIngreso('');
  var b = this;
  ocupado(b, 'Enviando…', true);
  apiPublica('solicitarCodigoAcceso', correo).then(function (r) {
    $('ingresoEnviadoA').textContent = r.mensaje;
    $('pasoCorreo').hidden = true;
    $('pasoCodigo').hidden = false;
    $('ingCodigo').focus();
  }).catch(function (err) {
    errorIngreso((err && err.message) ? err.message : String(err));
  }).then(function () { ocupado(b, 'Enviarme un código', false); });
});

$('btnEntrar').addEventListener('click', function () {
  var codigo = $('ingCodigo').value.trim();
  if (!codigo) { errorIngreso('Escriba el código que le llegó.'); return; }
  errorIngreso('');
  var b = this;
  ocupado(b, 'Entrando…', true);
  apiPublica('validarCodigoAcceso', $('ingCorreo').value.trim(), codigo).then(function (r) {
    guardarToken(r.token);
    $('ingreso').hidden = true;
    arrancar();
  }).catch(function (err) {
    errorIngreso((err && err.message) ? err.message : String(err));
    ocupado(b, 'Entrar', false);
  });
});

$('btnOtroCorreo').addEventListener('click', function () {
  $('ingCodigo').value = '';
  $('pasoCodigo').hidden = true;
  $('pasoCorreo').hidden = false;
  errorIngreso('');
});

// Enter en cualquiera de los dos campos avanza, que es lo que la gente espera.
$('ingCorreo').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') $('btnPedirCodigo').click();
});
$('ingCodigo').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') $('btnEntrar').click();
});

/* ================= Arranque ================= */

function arrancar() {
  $('ventanaMeses').value = String(VENTANA_INICIAL);
  api('getArranque', VENTANA_INICIAL).then(function (r) {
    if (!r) return;                       // la sesion se pidio de nuevo
    pintarPie(r.version);
    CTX = r.contexto;
    if (!CTX.autorizado) {
      // Identidad establecida pero sin permiso: no sirve volver a pedir el
      // codigo, hay que hablar con el administrador.
      $('ingreso').hidden = true;
      $('usuarioNombre').textContent = CTX.correo || 'Sin sesión';
      $('avisoAccesoMotivo').textContent = CTX.motivo || '';
      $('avisoAcceso').hidden = false;
      $('btnActualizar').hidden = true;
      return;
    }
    CAT = r.catalogos;
    DATOS.home = {};
    DATOS.home[VENTANA_INICIAL] = r.metricas;

    $('ingreso').hidden = true;
    $('avisoAcceso').hidden = true;
    $('btnActualizar').hidden = false;
    $('usuarioNombre').textContent = CTX.nombre;
    $('usuarioRol').textContent = CTX.rolNombre;
    if (!CTX.esAdmin) $('tabAdmin').hidden = true;
    $('contenido').hidden = false;
    navegar(PAGINA_INICIAL || 'home');
    precargarEnSegundoPlano();
  }).catch(function (err) {
    $('avisoAccesoMotivo').textContent = (err && err.message) ? err.message : String(err);
    $('avisoAcceso').hidden = false;
  });
}

TOKEN_SESION = leerTokenGuardado();
arrancar();
</script>
