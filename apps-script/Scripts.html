 * Si esta tarjeta puede caer en esta columna. Reparte segun el gobierno del
 * registro: una de fabrica se valida contra el embudo; una tarea, contra el
 * permiso de mover tareas. Y ninguna cruza al tablero del otro.
 */
function validarSoltar_(s, col) {
  if (esEstabilizacion(s)) {
    if (!col.dataset.estadoEstab) {
      return { permitido: false,
               motivo: 'Una estabilizacion se mueve en su propio tablero.' };
    }
    if (!permiso('Gestionar_Estabilizacion')) {
      return { permitido: false, motivo: 'Su rol no puede mover las estabilizaciones.' };
    }
    if (s.Estado_Actual === col.dataset.estadoEstab) {
      return { permitido: false, motivo: 'La estabilización ya se encuentra en ese estado.' };
    }
    // La compuerta de cierre, avisada antes de soltar: espejo de
    // faltaParaCerrarEstabilizacion_() del servidor (D-101).
    if (col.dataset.estadoEstab === 'EST-06' && s.Falta_Para_Cerrar) {
      return { permitido: false,
               motivo: 'No se puede dar por terminada. ' + s.Falta_Para_Cerrar +
                       ' Use el lápiz de la tarjeta para registrarlo.' };
    }
    return { permitido: true, motivo: '' };
  }
  if (esTarea(s)) {
    if (!col.dataset.estado) {
      return { permitido: false, motivo: 'Una tarea no recorre el embudo de fases.' };
    }
    if (!permiso('Mover_Estado_Tarea')) {
      return { permitido: false, motivo: 'Su rol no puede cambiar el estado de las tareas.' };
    }
    if (s.Estado_Actual === col.dataset.estado) {
      return { permitido: false, motivo: 'La tarea ya se encuentra en ese estado.' };
    }
    return { permitido: true, motivo: '' };
  }
  if (!col.dataset.fase) {
    return { permitido: false, motivo: 'Esta solicitud se mueve por fase, no por estado.' };
  }
  // Soltarla en su misma columna no es un cambio de fase fallido: es cambiarle
  // el orden de atencion, y en las tres columnas que se ordenan a mano se
  // permite. Sin esto la columna se pintaba de rojo mientras uno la arrastraba
  // dentro de ella misma, diciendo que no se puede algo que si se puede (D-96).
  if (col.dataset.fase === s.Fase_Actual) {
    if (!col.hasAttribute('data-ordenable')) {
      return { permitido: false, motivo: 'La actividad ya está en esa fase.' };
    }
    return permiso('Mover_Fase')
        ? { permitido: true, motivo: '' }
        : { permitido: false, motivo: 'Su rol no puede reordenar el tablero: es de consulta.' };
  }
  var v = validarTransicionCliente(s.Fase_Actual, col.dataset.fase);
  if (!v.permitido) return v;

  // La compuerta de aprobacion, avisada antes de soltar y no despues: espejo de
  // faltaAprobacion_() del servidor (D-98).
  if (faseExigeAprobacionCliente(s.Fase_Actual) && !estaAprobada(s) &&
      ordenDeFase(col.dataset.fase) > ordenDeFase(s.Fase_Actual)) {
    return { permitido: false,
             motivo: 'Sin aprobar en "' + nombreFase(s.Fase_Actual) + '". ' +
                     'Necesita el visto bueno antes de avanzarla.' };
  }
  return v;
}
document.addEventListener('drop', function (e) {
  var col = e.target.closest('.col');
  if (!col || !arrastrada) return;
  e.preventDefault();
  var id = arrastrada;
  var s = solicitudPorId(id);
  var vecina = tarjetaBajoElCursor_(col, e.clientY);
  marcarSitio_(null);

  // Soltarla en su misma columna ordenable no la mueve de fase: la reordena.
  if (col.dataset.fase === s.Fase_Actual && col.hasAttribute('data-ordenable')) {
    reordenarEnColumna_(s, col, vecina);
    return;
  }

  // Validacion optimista en el navegador; el backend vuelve a validarla.
  var v = validarSoltar_(s, col);
  if (!v.permitido) { toast(v.motivo, true); return; }

  // Entrar a Analisis y diseno sin analista no se rechaza: se pregunta. Frenar
  // la tarjeta para que la persona abra la solicitud, busque el campo y vuelva a
  // arrastrarla seria tres pasos para un dato que cabe en una pregunta (D-102).
  if (faltaPreguntarAnalista(s, col.dataset.fase)) {
    preguntarAnalista(s, function (idAnalista) { moverTarjeta_(s, col, idAnalista); });
    return;
  }
  moverTarjeta_(s, col);
});

/**
 * @return {boolean} True si hay que preguntar quien analiza antes de mover.
 *
 * Si no hay analistas registrados no se pregunta y no se frena: seria una
 * ventana con un desplegable vacio. Gemelo de faltaAnalista_() del servidor.
 */
function faltaPreguntarAnalista(s, faseDestino) {
  return esDeFabrica(s) &&
         (CAT.fasesConAnalista || []).indexOf(faseDestino) !== -1 &&
         !String(s.Analista_ID || '').trim() &&
         (CAT.analistas || []).length > 0;
}

/** Pregunta quien analiza y sigue con lo que se estaba haciendo. */
function preguntarAnalista(s, seguir) {
  abrirModal('¿Quién analiza ' + s.ID_Solicitud + '?',
    s.Nombre_Solicitud,
    '<div class="formulario">' +
      '<label class="campo"><span>Analista asignado *</span>' +
        '<select id="movAnalista"><option value="">(elija el analista)</option>' +
        (CAT.analistas || []).map(function (a) {
          return '<option value="' + esc(a.id) + '">' + esc(a.nombre) + '</option>';
        }).join('') + '</select>' +
        '<small style="color:var(--ink-faint)">No se empieza un análisis sin saber quién lo ' +
        'hace. La lista se administra en Administración → Analistas.</small></label>' +
    '</div>',
    function () {
      var id = $('movAnalista').value;
      if (!id) throw new Error('Elija el analista.');
      seguir(id);
    });
}

/**
 * Mueve la tarjeta de verdad: se pinta de una vez y se revierte si el servidor
 * dice que no. Vive aparte del manejador de soltar porque tambien se llama
 * despues de preguntar quien analiza.
 */
function moverTarjeta_(s, col, idAnalista) {
  var id = s.ID_Solicitud;

  // Cada gobierno mueve su propio campo con su propio metodo (D-79, D-101).
  var gobierno = gobiernoDe(s);
  var porEstado = gobierno !== 'fabrica';
  var campo = porEstado ? 'Estado_Actual' : 'Fase_Actual';
  var destino = gobierno === 'estabilizacion' ? col.dataset.estadoEstab
      : gobierno === 'tarea' ? col.dataset.estado : col.dataset.fase;
  var metodo = gobierno === 'estabilizacion' ? 'cambiarEstadoEstabilizacion'
      : gobierno === 'tarea' ? 'cambiarEstadoTarea' : 'cambiarFaseSolicitud';
  var original = s[campo];

  var analistaAntes = s.Analista_ID;
  s[campo] = destino;               // se mueve ya, y se revierte si el servidor dice que no
  if (idAnalista) {
    s.Analista_ID = idAnalista;
    s.Nombre_Analista = nombreDeCatalogo(CAT.analistas, idAnalista);
  }
  pintarKanban();

  // Solo el embudo recibe el analista, y en la MISMA llamada que el movimiento:
  // asignarlo aparte y fallar al mover dejaria la solicitud con analista en una
  // fase que todavia no es la suya. El estado destino va vacio: lo decide el
  // servidor.
  var argumentos = porEstado ? [metodo, id, destino]
                             : [metodo, id, destino, '', idAnalista || ''];
  api.apply(null, argumentos).then(function (r) {
    toast(id + ' pasó a ' + (porEstado ? nombreEstado(destino) : nombreFase(destino)) + '.');
    (r.avisos || []).forEach(function (a) { toast(a, true); });
    invalidarCacheCliente();
    cargarGestion(true);
  }).catch(function (err) {
    s[campo] = original;
    s.Analista_ID = analistaAntes;
    pintarKanban();
    fallo(err);
  });
}

function solicitudPorId(id) {
  // Puede llamarse antes de que el tablero haya cargado: devolver nada es mejor
  // que reventar en quien solo queria el nombre para un titulo.
  if (!DATOS.kanban) return null;
  return DATOS.kanban.solicitudes.filter(function (s) { return s.ID_Solicitud === id; })[0] || null;
}

/**
 * Cambia el orden de atencion de una tarjeta dentro de su columna.
 *
 * Al servidor no se le manda un numero sino un vecino: "va justo debajo de
 * aquella". Asi el resultado es correcto aunque la columna este filtrada y se
 * esten viendo solo unas cuantas tarjetas, y aunque otra persona la haya
 * reordenado hace un segundo; el servidor recalcula sobre lo que hay.
 *
 * En pantalla se reordena de una vez, sin esperar respuesta: arrastrar tiene
 * que sentirse inmediato. Si el servidor dice que no, se vuelve a pedir el
 * tablero y la tarjeta regresa sola a su sitio.
 */
function reordenarEnColumna_(s, col, vecina) {
  if (!permiso('Mover_Fase')) {
    toast('Su rol no puede reordenar el tablero: es de consulta.', true);
    return;
  }

  var enColumna = DATOS.kanban.solicitudes
      .filter(function (x) { return x.Fase_Actual === s.Fase_Actual && esDeFabrica(x); })
      .sort(ordenPuestoAMano);

  var sinEsta = enColumna.filter(function (x) { return x.ID_Solicitud !== s.ID_Solicitud; });

  // "vecina" es la tarjeta ante la cual cae, o nada si cae al final. De ahi
  // salen las dos cosas que hacen falta: en que puesto queda en pantalla, y
  // cual es la que le va a quedar ENCIMA, que es lo que el servidor entiende.
  var destino = sinEsta.length;
  if (vecina) {
    var i = sinEsta.map(function (x) { return x.ID_Solicitud; }).indexOf(vecina.dataset.id);
    if (i !== -1) destino = i;
  }
  var idEncima = destino ? sinEsta[destino - 1].ID_Solicitud : '';

  var antes = enColumna.map(function (x) { return x.Orden_Columna; });
  var nueva = sinEsta.slice(0, destino).concat([s], sinEsta.slice(destino));
  nueva.forEach(function (x, i) { x.Orden_Columna = i + 1; });
  pintarKanban();

  // En exito no se recarga nada. La pantalla ya quedo como va a quedar: el
  // reordenamiento de aqui arriba usa la misma regla de insercion que el
  // servidor, asi que pedir el tablero completo solo servia para volver a
  // dibujar lo mismo —y dejaba la pagina en blanco varios segundos, porque
  // releer todas las hojas cuesta entre uno y tres segundos—. Lo unico que
  // cambio fue el numero de orden de una columna, y ya esta aplicado.
  api('reordenarSolicitud', s.ID_Solicitud, idEncima).catch(function (err) {
    enColumna.forEach(function (x, i) { x.Orden_Columna = antes[i]; });
    pintarKanban();
    fallo(err);
  });
}

/**
 * Espejo de validarTransicion() del backend, para dar respuesta inmediata al
 * arrastrar. Tiene que decir lo mismo que el servidor: si aqui se permite algo
 * que alla se rechaza, la tarjeta se mueve y vuelve sola, que es peor que no
 * dejarla mover. Las dos reglas se prueban juntas (pruebaPermisos.js).
 */
function validarTransicionCliente(origen, destino) {
  if (!permiso('Mover_Fase')) {
    return { permitido: false,
             motivo: 'Su rol no puede mover solicitudes de fase: el tablero es de consulta.' };
  }
  var a = ordenDeFase(origen), b = ordenDeFase(destino);
  if (a === b) return { permitido: false, motivo: 'La actividad ya está en esa fase.' };
  var opera = function (f) { return (CTX.fasesEditables || []).indexOf(f) !== -1; };

  if (b > a) {
    if (b - a > 1 && !permiso('Saltar_Fases')) {
      return { permitido: false,
               motivo: 'Su rol no puede saltar fases: mueva la solicitud de una en una.' };
    }
    if (!opera(origen)) {
      return { permitido: false,
               motivo: 'Su rol no opera la fase "' + nombreFase(origen) + '".' };
    }
    return { permitido: true, motivo: '' };
  }

  if (!permiso('Retroceder_Fase')) {
    return { permitido: false,
             motivo: 'Su rol no puede devolver una solicitud a una fase anterior.' };
  }
  if (!opera(destino)) {
    return { permitido: false,
             motivo: 'Su rol no opera la fase "' + nombreFase(destino) + '", que es a donde ' +
                     'se estaría devolviendo.' };
  }
  return { permitido: true, motivo: '' };
}

/* --- Detalle de la actividad --- */
// Las tarjetas de iniciativa viven en la matriz y en las columnas por prioridad;
// el listado tiene su propio manejador.
document.addEventListener('click', function (e) {
  var globoIni = e.target.closest('[data-comentar-ini]');
  if (globoIni && !e.target.closest('#listadoIni')) {
    verDetalleIniciativa(globoIni.dataset.comentarIni);
    return;
  }
  var lapizIni = e.target.closest('[data-editar-ini]');
  if (lapizIni && !e.target.closest('#listadoIni')) {
    formularioIniciativa(lapizIni.dataset.editarIni);
    return;
  }
  var sello = e.target.closest('[data-aprobar]');
  if (sello) { alternarAprobacion(sello.dataset.aprobar); return; }
  var quienAnaliza = e.target.closest('[data-analista]');
  if (quienAnaliza) { cambiarAnalista(quienAnaliza.dataset.analista); return; }
  var historias = e.target.closest('[data-historias]');
  if (historias) { cambiarHistorias(historias.dataset.historias); return; }
  var lapiz = e.target.closest('[data-editar-sol]');
  if (lapiz) { editarSolicitud(lapiz.dataset.editarSol); return; }
  var alerta = e.target.closest('[data-alerta]');
  if (alerta) { verDetalle(alerta.dataset.alerta); return; }
  // Un enlace de la tarjeta se deja pasar al navegador: si no, abrir la
  // carpeta de Drive abriria ademas el detalle por detras.
  if (e.target.closest('[data-enlace]')) return;
  var t = e.target.closest('.tarjeta');
  if (t) verDetalle(t.dataset.id);
});

/**
 * Edicion completa de una solicitud, para los roles autorizados.
 *
 * Dos columnas: a la izquierda los datos de la solicitud, que no dependen de
 * donde este; a la derecha un paso por fase con lo que se diligencia en ella.
 * Antes era una sola columna con las 52 columnas de la tabla, las de los tres
 * gobiernos juntas: a una tarea se le pedian fechas de QA y a una de fabrica la
 * causa raiz de un incidente. Medio formulario era ruido, y el ruido ensena a no
 * leer el formulario (D-130).
 *
 * El servidor decide que campos aplican y como se reparten. La pantalla no tiene
 * su propia lista: si la tuviera, agregar una columna al esquema obligaria a
 * acordarse de dos sitios, y el que se olvide deja un campo que no se puede
 * diligenciar sin que nada avise.
 */
function editarSolicitud(idSolicitud) {
  abrirModal('Editar solicitud', idSolicitud, '<p class="nota">Cargando…</p>', null);
  api('getFormularioSolicitud', idSolicitud).then(function (f) {
    abrirModal('Editar solicitud',
      idSolicitud + ' · ' + (f.valores.Nombre_Solicitud || ''),
      cuerpoFormularioSolicitud(f),
      function () {
        return api('actualizarSolicitudCompleta', idSolicitud, leerCampos(f.columnas))
            .then(function (r) {
              toast('Solicitud ' + idSolicitud + ' actualizada.');
              invalidarCacheCliente();
              cargarGestion(true);
            });
      }, true);
    activarPasosFormulario(f);
  }).catch(function (err) { cerrarModal(); fallo(err); });
}

/** Como se llama el gobierno, para decirlo en el encabezado. */
function nombreDelGobierno(g) {
  return g === 'tarea' ? 'tarea'
       : g === 'estabilizacion' ? 'estabilización'
       : 'solicitud de fábrica';
}

/**
 * En que va la informacion de un paso: completa, a medias, sin datos o marcada
 * como que no aplica.
 *
 * Se mira solo lo que de verdad hay que llenar —las fechas y las marcas—, no
 * todos los campos del paso: una fase con fechas puestas y la version todavia
 * sin asignar no esta "incompleta" por eso.
 */
function estadoDelPaso(paso, valores) {
  var noAplica = paso.columnas.some(function (c) {
    return /^No_Aplica_/.test(c.campo) &&
           String(valores[c.campo] || '').toUpperCase().indexOf('S') === 0;
  });
  if (noAplica) return { clave: 'noaplica', texto: 'no aplica' };

  var fechas = paso.columnas.filter(function (c) {
    return c.tipo === 'date' || c.tipo === 'datetime';
  });
  if (!fechas.length) return { clave: 'otros', texto: '' };
  var puestas = fechas.filter(function (c) { return !!valores[c.campo]; }).length;
  if (puestas === 0) return { clave: 'sin', texto: 'sin fechas' };
  if (puestas < fechas.length) return { clave: 'medias', texto: 'a medias' };
  return { clave: 'listo', texto: 'completo' };
}

/** El cuerpo del modal: izquierda los datos, derecha los pasos. */
function cuerpoFormularioSolicitud(f) {
  var izq = f.sueltos.map(function (g) {
    return '<div class="fs-grupo"><h4>' + esc(g.grupo) + '</h4>' +
           construirCampos(g.columnas, f.opciones, f.valores, null) + '</div>';
  }).join('');

  /* Lo que aplica y el reparto no acomodo. No se descarta en silencio: un campo
     que desaparece del formulario deja de poderse diligenciar y nadie se
     entera. */
  if (f.sinAcomodar && f.sinAcomodar.length) {
    izq += '<div class="fs-grupo"><h4>Otros datos</h4>' +
      '<p class="nota" style="margin:0 0 8px">Estos campos aplican a este tipo pero todavía ' +
      'no están ubicados en ningún paso. Avise para acomodarlos.</p>' +
      construirCampos(f.sinAcomodar, f.opciones, f.valores, null) + '</div>';
  }

  var filas = f.pasos.map(function (p, i) {
    var est = estadoDelPaso(p, f.valores);
    // La fase en la que esta la solicitud llega abierta; las demas, plegadas.
    var actual = !!p.fase && p.fase === f.faseActual;
    /* Un gobierno sin embudo —una tarea, una estabilizacion— no tiene "donde
       estas": sus pasos son secciones de lo mismo, no etapas por las que se
       avanza, asi que llegan todas abiertas. Plegadas, quien abre una tarea ve la
       columna derecha en blanco y concluye que no hay nada que diligenciar. */
    var abierto = p.fase ? actual : true;
    return '<div class="fs-paso' + (actual ? ' fs-paso-actual' : '') +
      '" data-paso="' + i + '">' +
      '<button type="button" class="fs-paso-cab" data-abrir="' + i + '">' +
        '<span class="fs-paso-n">' + (p.fase ? p.orden : '·') + '</span>' +
        '<span class="fs-paso-tit">' + esc(p.titulo) +
          (actual ? ' <b class="fs-aqui">está aquí</b>' : '') + '</span>' +
        (est.texto ? '<span class="fs-chip fs-chip-' + est.clave + '">' +
          esc(est.texto) + '</span>' : '') +
        '<span class="fs-flecha">▾</span>' +
      '</button>' +
      '<div class="fs-paso-cuerpo"' + (abierto ? '' : ' hidden') + '>' +
        (p.ayuda ? '<p class="nota" style="margin:0 0 8px">' + esc(p.ayuda) + '</p>' : '') +
        construirCampos(p.columnas, f.opciones, f.valores, null) +
      '</div></div>';
  }).join('');

  var aviso = f.seApruebaEnTablero
    ? '<p class="nota fs-aprob" style="margin:10px 0 0">La <b>aprobación</b> de la fase no se edita ' +
      'aquí: se da desde la tarjeta del tablero, que es donde se verifica el permiso. ' +
      'Hoy está en <b>' + (String(f.aprobada).toUpperCase().indexOf('S') === 0
        ? 'aprobada' : 'sin aprobar') + '</b>.</p>'
    : '';

  return '<div class="fs">' +
    '<div class="fs-izq"><div class="formulario">' +
      '<p class="nota" style="margin:0 0 10px">Datos de la ' +
      esc(nombreDelGobierno(f.gobierno)) + '. Si cambia ' +
      (f.gobierno === 'fabrica' ? 'la fase o el estado' : 'el estado') +
      ', el movimiento queda registrado en la bitácora igual que un arrastre en el tablero. ' +
      'La fecha de registro alimenta el Lead Time: corríjala solo si la que quedó no es ' +
      'la real.</p>' +
      izq + '</div></div>' +
    '<div class="fs-der">' +
      '<h4>' + (f.gobierno === 'fabrica' ? 'Qué diligenciar en cada fase'
                                         : 'Qué diligenciar') + '</h4>' +
      '<p class="nota" style="margin:0 0 10px">' +
      (f.gobierno === 'fabrica'
        ? 'La fase en la que está viene abierta. Las demás se despliegan al hacer clic: de ahí ' +
          'salen el Cycle Time y el costo, así que lo que quede vacío no se puede medir.'
        : 'Lo que hace falta para poder cerrarla y para que su costo se pueda calcular.') +
      '</p>' +
      (filas || '<p class="nota">Este tipo no tiene pasos por diligenciar.</p>') +
      aviso +
    '</div></div>';
}

/** Conecta el plegado de los pasos. */
function activarPasosFormulario(f) {
  var caja = $('modalCuerpo');
  if (!caja) return;
  caja.querySelectorAll('[data-abrir]').forEach(function (b) {
    b.addEventListener('click', function () {
      var paso = b.closest('.fs-paso');
      var cuerpo = paso.querySelector('.fs-paso-cuerpo');
      cuerpo.hidden = !cuerpo.hidden;
      paso.classList.toggle('fs-abierto', !cuerpo.hidden);
    });
  });
  // El paso de la fase actual arranca abierto: su marca tiene que coincidir.
  caja.querySelectorAll('.fs-paso').forEach(function (paso) {
    var cuerpo = paso.querySelector('.fs-paso-cuerpo');
    paso.classList.toggle('fs-abierto', !cuerpo.hidden);
  });
}

function verDetalle(id) {
  abrirModal('Cargando…', id, '<p class="nota">Consultando la solicitud…</p>', null);
  api('getDetalleSolicitud', id).then(function (s) {
    var bloq = String(s.Tiene_Bloqueo).toUpperCase().indexOf('S') === 0;
    var filas = [
      ['Iniciativa', s.Nombre_Iniciativa],
      ['Plataforma digital', s.Nombre_Plataforma || 'sin asignar'],
      ['Fase', nombreFase(s.Fase_Actual)],
      ['Estado', nombreEstado(s.Estado_Actual)],
      ['Tipo', nombreDeCatalogo(CAT.tipos, s.Tipo_Solicitud)],
      ['Prioridad', nombreDeCatalogo(CAT.prioridades, s.Prioridad)],
      ['Responsable', s.Nombre_Responsable || '—'],
      ['Versión', s.Version_Semantica || 'Sin asignar'],
      ['Registro', fechaHora(s.Fecha_Registro)]
    ].map(function (p) {
      return '<dt>' + esc(p[0]) + '</dt><dd>' + esc(p[1]) + '</dd>';
    }).join('');

    // El alcance va aparte del listado de datos y no dentro: es el unico campo
    // largo del detalle, y en una fila de <dl> los saltos de linea se pierden.
    var alcance = s.Alcance
        ? tituloSeccion('Alcance') + '<p class="alcance">' + esc(s.Alcance) + '</p>'
        : '';

    var alerta = bloq
        ? '<div class="caja-alerta"><strong>&#9888;&#65039; Actividad bloqueada</strong><br>Causal: ' +
          esc(nombreDeCatalogo(CAT.causales, s.Causal_Bloqueo)) +
          (s.Observacion_Bloqueo
            ? '<span style="display:block;margin-top:6px">' +
              esc(s.Observacion_Bloqueo) + '</span>'
            : '') +
          '</div>'
        : '';

    // Los mismos dos enlaces de la tarjeta, aqui con su nombre escrito: en el
    // detalle hay sitio y no hay que adivinar a donde lleva cada icono.
    var enlaces = [
      { url: s.Doc_Requerimiento_URL, texto: 'Requerimiento' },
      { url: s.Link_Taiga, texto: 'Issue en Taiga' }
    ].filter(function (e) { return e.url; }).map(function (e) {
      return '<a class="btn-sec" style="text-decoration:none;display:inline-block" href="' +
             esc(e.url) + '" target="_blank" rel="noopener">' + esc(e.texto) + '</a>';
    }).join(' ');

    var acciones = CTX.puedeOperarTablero
        ? '<div class="fila" style="margin-top:14px">' +
          (bloq
            ? '<button class="btn-sec" id="btnLevantarBloqueo">Levantar bloqueo</button>'
            : '<button class="btn-sec" id="btnBloquear">Marcar bloqueo</button>') +
          '</div>'
        : '';

    var historial = (s.Historial || []).slice(0, 6).map(function (a) {
      return '<div class="it"><div><b>' + esc(nombreFase(a.Fase_Destino) || '—') + '</b><br>' +
             '<span style="color:var(--ink-muted)">' + esc(fechaHora(a.Fecha_Hora_Cambio)) + '</span></div>' +
             '<span class="dias" style="color:var(--ink-muted)">' +
             (a.Dias_Habiles_En_Fase || 0) + ' d háb.</span></div>';
    }).join('');

    abrirModal(s.Nombre_Solicitud, s.ID_Solicitud + ' · ' + s.Nombre_Plataforma,
      '<dl>' + filas + '</dl>' + alcance + alerta +
      '<div style="margin-top:12px">' + enlaces + '</div>' + acciones +
      bloqueComentarios(s.Observaciones) +
      (historial ? tituloSeccion('Últimos movimientos') +
        '<div class="lista-simple">' + historial + '</div>' : ''), null);

    conectarComentarios('agregarObservacion', s.ID_Solicitud);

    if ($('btnBloquear')) {
      $('btnBloquear').addEventListener('click', function () { formularioBloqueo(s.ID_Solicitud); });
    }
    if ($('btnLevantarBloqueo')) {
      $('btnLevantarBloqueo').addEventListener('click', function () {
        api('marcarBloqueo', s.ID_Solicitud, false, '', '').then(function () {
          toast('Bloqueo levantado.');
          cerrarModal();
          invalidarCacheCliente();
          cargarGestion(true);
        }).catch(fallo);
      });
    }
  }).catch(function (err) { cerrarModal(); fallo(err); });
}

/** Titulo de seccion dentro del detalle de una solicitud. */
function tituloSeccion(texto) {
  return '<h3 style="font-size:12px;margin:16px 0 8px;color:var(--ink-faint);' +
         'text-transform:uppercase;letter-spacing:.06em">' + esc(texto) + '</h3>';
}

/**
 * Los comentarios de algo: lo que la gente ha ido anotando.
 *
 * Van de lo mas reciente a lo mas antiguo porque lo que se necesita al abrir
 * una solicitud —o una iniciativa— es en que quedo, no como empezo. Escribir
 * puede cualquiera con sesion; borrar o editar, nadie: un seguimiento que se
 * puede reescribir despues deja de servir para saber que se dijo y cuando.
 *
 * El mismo bloque sirve para las dos cosas: solo cambia la operacion del
 * servidor que lo guarda.
 */
function bloqueComentarios(observaciones) {
  var obs = observaciones || [];
  return tituloSeccion('Comentarios' + (obs.length ? ' · ' + obs.length : '')) +
    '<div class="obs-nueva">' +
      '<textarea id="obsTexto" rows="3" maxlength="2000" ' +
        'placeholder="En qué quedó, qué se acordó, a quién se está esperando"></textarea>' +
      '<div class="fila" style="justify-content:space-between;align-items:center">' +
        '<span class="nota" id="obsRestan"></span>' +
        '<button class="btn" id="btnObs">Agregar comentario</button>' +
      '</div>' +
    '</div>' +
    '<div class="obs-lista" id="obsLista">' + listaComentarios(obs) + '</div>';
}

/** Los comentarios ya escritos, o el texto de cuando no hay ninguno. */
function listaComentarios(obs) {
  if (!obs.length) {
    return '<p class="nota" style="margin:0">Todavía no hay comentarios. El primero ' +
           'puede ser el suyo.</p>';
  }
  return obs.map(function (o) {
    return '<div class="obs">' +
      '<div class="obs-cab"><b>' + esc(o.autor || 'sin autor') + '</b>' +
      '<span>' + esc(fechaHora(o.fecha)) + '</span></div>' +
      '<div class="obs-txt">' + esc(o.texto) + '</div>' +
    '</div>';
  }).join('');
}

/**
 * Conecta el cuadro de comentarios recien pintado.
 *
 * @param {string} metodo Operacion del servidor que guarda.
 * @param {string} id Llave de la solicitud o de la iniciativa.
 */
function conectarComentarios(metodo, id) {
  var caja = $('obsTexto'), boton = $('btnObs'), restan = $('obsRestan');
  if (!caja || !boton) return;

  var contar = function () {
    var quedan = 2000 - caja.value.length;
    restan.textContent = quedan < 200 ? 'Quedan ' + quedan + ' caracteres' : '';
    boton.disabled = !caja.value.trim();
  };
  caja.addEventListener('input', contar);
  contar();

  boton.addEventListener('click', function () {
    var texto = caja.value.trim();
    if (!texto) return;
    boton.disabled = true;
    boton.textContent = 'Guardando…';
    api(metodo, id, texto).then(function (r) {
      // Se repinta solo la lista: el resto de la ventana no cambio y volver a
      // armarla perderia el desplazamiento de quien esta leyendo.
      caja.value = '';
      $('obsLista').innerHTML = listaComentarios(r.Observaciones || []);
      toast('Comentario registrado.');
      // Si el correo de aviso no salio, el comentario igual quedo guardado: se
      // dice, pero como advertencia y no como error de lo que la persona hizo.
      (r.avisos || []).forEach(function (a) { toast(a, true); });
    }).catch(fallo).then(function () {
      boton.textContent = 'Agregar comentario';
      contar();
    });
  });
}

/**
 * El detalle de una iniciativa, desde cualquiera de las tres vistas.
 *
 * Reemplazo de la ventana que antes solo mostraba los comentarios: para saber
 * de que iniciativa se estaba hablando habia que cerrarla y volver a la tabla.
 * Ahora la conversacion queda debajo de los datos que la explican.
 */
function verDetalleIniciativa(idProyecto) {
  abrirModal('Iniciativa', idProyecto, '<p class="nota">Cargando…</p>', null, true);
  api('getDetalleIniciativa', idProyecto).then(function (i) {
    abrirModal(i.nombre, i.idProyecto + (i.plataforma ? ' · ' + i.plataforma : ''),
               cuerpoDetalleIniciativa(i), null, true);
    conectarComentarios('agregarObservacionIniciativa', idProyecto);
    if ($('btnEditarDesdeDetalle')) {
      $('btnEditarDesdeDetalle').addEventListener('click', function () {
        formularioIniciativa(idProyecto);
      });
    }
  }).catch(function (err) { cerrarModal(); fallo(err); });
}

/**
 * El detalle en tres columnas: quien es la iniciativa, que se esta haciendo y
 * que se ha dicho.
 *
 * Antes iba todo en una sola columna y habia que desplazarse hasta el final
 * para ver los comentarios, que son lo que mas se consulta. Puestos al lado,
 * se leen junto a los datos que los explican. En pantalla angosta las tres
 * columnas se apilan en ese mismo orden.
 */
function cuerpoDetalleIniciativa(i) {
  return '<div class="det-ini">' +
    '<div class="det-col">' + columnaDatosIniciativa(i) + '</div>' +
    '<div class="det-col">' + columnaActividades(i) + '</div>' +
    '<div class="det-col">' + bloqueComentarios(i.Observaciones) + '</div>' +
  '</div>';
}

/** Columna 1: los datos de la iniciativa, su avance y su documentacion. */
function columnaDatosIniciativa(i) {
  var filas = [
    ['Estado', i.estado],
    ['Prioridad', i.prioridad],
    ['Tipo', i.tipo],
    ['Línea estratégica', i.len],
    ['Vertical', i.vertical],
    ['Plataforma digital', i.plataforma],
    ['Solicitante', i.solicitante],
    ['Business Owner', i.bo],
    ['Product Owner', i.po],
    ['Inicio', fecha(i.fechaInicio)],
    ['Fin estimado', fecha(i.fechaFinEstimada)],
    ['Fin real', fecha(i.fechaFinReal)]
  ].map(function (p) {
    return '<dt>' + esc(p[0]) + '</dt><dd>' +
           (p[1] ? esc(p[1]) : '<span style="color:var(--ink-faint)">sin definir</span>') +
           '</dd>';
  }).join('');

  var avance = tituloSeccion('Avance') +
    '<p style="font-size:13px;margin:0">' +
      (i.avanceReal === null
        ? '<span style="color:var(--ink-faint)">Todavía no tiene solicitudes relacionadas.</span>'
        : celdaAvanceReal({ avanceReal: i.avanceReal, avanceEsperado: i.avanceEsperado,
                            actividades: i.solicitudes }) + ' real' +
          (i.avanceEsperado === null
            ? ' <span style="color:var(--ink-faint)">(sin fechas para comparar)</span>'
            : ' · se esperaba ' + formatoPorcentaje(i.avanceEsperado))) +
    '</p>';

  var descripcion = i.descripcion
      ? tituloSeccion('Descripción') + '<p class="alcance">' + esc(i.descripcion) + '</p>'
      : '';

  var drive = i.driveUrl
      ? '<div style="margin-top:16px"><a class="btn-sec" target="_blank" rel="noopener" ' +
        'style="text-decoration:none;display:inline-block" href="' + esc(i.driveUrl) + '">' +
        'Documentación en Drive</a></div>'
      : '<p class="nota" style="margin-top:16px">Sin carpeta de documentación registrada' +
        (CTX.puedeEditarIniciativa ? ': se agrega editando la iniciativa.' : '.') + '</p>';

  var editar = CTX.puedeEditarIniciativa
      ? '<div style="margin-top:10px">' +
        '<button class="btn-sec" id="btnEditarDesdeDetalle">Editar iniciativa</button></div>'
      : '';

  return '<dl>' + filas + '</dl>' + avance + descripcion + drive + editar;
}

/** Columna 2: las actividades de la iniciativa y como va cada una. */
function columnaActividades(i) {
  var lista = (i.actividades || []).slice().sort(ordenDeAtencion);
  var resumen = i.solicitudes + (i.solicitudes === 1 ? ' actividad' : ' actividades') +
      ' · ' + i.solicitudesEnVuelo + ' en curso' +
      (i.solicitudesBloqueadas ? ' · ' + i.solicitudesBloqueadas + ' bloqueada' +
        (i.solicitudesBloqueadas === 1 ? '' : 's') : '');

  if (!lista.length) {
    return tituloSeccion('Actividades') +
           '<p class="nota" style="margin:0">Esta iniciativa todavía no tiene actividades.</p>';
  }

  return tituloSeccion('Actividades · ' + i.solicitudes) +
    '<p class="nota" style="margin:0 0 10px">' + esc(resumen) + '</p>' +
    '<div class="act-lista">' + lista.map(function (a) {
      return '<div class="act' + (a.bloqueada ? ' bloqueada' : '') + '">' +
        '<div class="act-top"><span class="act-id">' + esc(a.id) + '</span>' +
          '<span class="badge ' + (CLASE_ESTADO[a.estadoId] || 'e-por-iniciar') + '">' +
          esc(a.estado) + '</span></div>' +
        '<div class="act-nombre">' + esc(a.nombre) + '</div>' +
        '<div class="act-pie">' + esc(a.fase) +
          (a.responsable ? ' · ' + esc(a.responsable) : '') +
          (a.bloqueada ? ' · <b style="color:var(--rojo)">bloqueada</b>' : '') +
        '</div></div>';
    }).join('') + '</div>';
}

function formularioBloqueo(id) {
  var opciones = CAT.causales.map(function (c) {
    return '<option value="' + c.id + '">' + esc(c.nombre) + '</option>';
  }).join('');
  // Con el codigo solo, quien llega aqui desde el tablero tiene que acordarse de
  // cual solicitud estaba bloqueando. El nombre lo dice.
  var s = solicitudPorId(id);
  abrirModal('Marcar bloqueo', id + (s && s.Nombre_Solicitud ? ' · ' + s.Nombre_Solicitud : ''),
    '<div class="formulario">' +
    '<label class="campo"><span>Causal del bloqueo</span>' +
    '<select id="causalBloqueo">' + opciones + '</select></label>' +
    '<label class="campo"><span>Observación</span>' +
    '<textarea id="observacionBloqueo" rows="3" ' +
    'placeholder="Qué está trabando la solicitud y qué se está esperando"></textarea></label>' +
    '<p class="nota" style="margin:0">La observación es opcional y se borra cuando se ' +
    'levanta el bloqueo.</p></div>',
    function () {
      return api('marcarBloqueo', id, true, $('causalBloqueo').value,
                 $('observacionBloqueo').value).then(function () {
        toast('Actividad bloqueada.');
        invalidarCacheCliente();
        cargarGestion(true);
      });
    });
}

/* --- Nueva solicitud --- */

    '</label>' +
    // Ojo: esta lista NO es la de "Versión estimada" de arriba. Esa guarda el
    // numero de version (texto), porque es asi como la fabrica relaciona una
    // actividad con su release. Esta guarda el identificador de la version del
    // roadmap, que es lo que permite contar incidentes por version sin depender
    // de como alguien escribio el numero (D-101).
    '<label class="campo solo-estabilizacion" hidden><span>Versión afectada</span>' +
      '<select id="nsVersionAfectada"><option value="">(elija la versión)</option>' +
      (CAT.versiones || []).map(function (v) {
        return '<option value="' + esc(v.valor) + '">' + esc(v.texto) + '</option>';
      }).join('') + '</select>' +
      '<small style="color:var(--ink-faint)">' +
      ((CAT.versiones || []).length
        ? 'En qué versión ya desplegada apareció el problema. Si todavía no se sabe, se puede ' +
          'dejar en blanco: hace falta para <b>cerrar</b> la estabilización, no para abrirla.'
        : '<b>No hay versiones registradas en el Roadmap todavía.</b> Puede abrir el incidente ' +
          'sin este dato y completarlo después, cuando la versión exista.') + '</small>' +
    '</label>' +
    '<label class="campo solo-tarea" hidden><span>Fecha compromiso</span>' +
      '<input type="date" id="nsCompromiso">' +
      '<small style="color:var(--ink-faint)">Para qué día se comprometió. Sin esta fecha una ' +
      'tarea no puede llegar tarde: las de fábrica se miden contra el SLA de su fase.</small>' +
    '</label>' +
    '<label class="campo"><span>Documento de requerimiento (enlace de Drive)</span>' +
      '<input type="url" id="nsDoc" placeholder="https://docs.google.com/…">' +
      '<small style="color:var(--ink-faint)">Opcional. Si todavía no existe, se puede pegar ' +
      'después editando la solicitud.</small></label>' +
    '</div>',
    function () {
      var nombre = $('nsNombre').value.trim();
      if (!nombre) throw new Error('Escriba el nombre de la solicitud.');
      // El combo devuelve '' si esta vacio y null si lo escrito no corresponde
      // a ninguna iniciativa. Los dos casos se atajan aqui: antes era un
      // <select> y siempre traia la primera de la lista, asi que quien no lo
      // tocaba creaba la solicitud colgada de una iniciativa que no era.
      var proyecto = valorCombo('nsProyecto', 'dlNsProyecto');
      if (!proyecto) {
        throw new Error(proyecto === null
          ? 'No hay ninguna iniciativa con ese nombre. Elija una de la lista.'
          : 'Elija la iniciativa a la que pertenece la solicitud.');
      }
      var doc = $('nsDoc').value.trim();
      if (doc && !/^https?:\/\//i.test(doc)) {
        throw new Error('El enlace del documento debe empezar por http:// o https://');
      }
      return api('crearSolicitud', {
        Nombre_Solicitud: nombre,
        Alcance: $('nsAlcance').value,
        ID_Proyecto: proyecto,
        Plataforma_ID: $('nsPlataforma').value,
        Tipo_Solicitud: $('nsTipo').value,
        Prioridad: $('nsPrioridad').value,
        // Sin campo de fase (el rol no mueve fases, o es una tarea) va vacia y
        // el servidor pone la que corresponda.
        Fase_Actual: (gobiernoDelFormulario() === 'fabrica' && $('nsFase'))
            ? $('nsFase').value : '',
        Solicitante_ID: $('nsSolicitante').value,
        Responsable_ID: $('nsResponsable').value,
        Proceso_Impactado: $('nsProceso').value,
        Version_Semantica: gobiernoDelFormulario() === 'fabrica' ? $('nsVersion').value : '',
        Version_Afectada: gobiernoDelFormulario() === 'estabilizacion'
            ? $('nsVersionAfectada').value : '',
        Fecha_Compromiso: tipoEsTarea() ? $('nsCompromiso').value : '',
        Doc_Requerimiento_URL: $('nsDoc').value.trim()
      }).then(function (r) {
        toast('Solicitud ' + r.idSolicitud + ' creada.');
        (r.avisos || []).forEach(function (a) { toast(a, true); });
        invalidarCacheCliente();
        cargarGestion(true);
      });
    });

  // El formulario se adapta al tipo: una tarea no tiene version comprometida
  // —no pasa por el roadmap— y en cambio si tiene fecha compromiso (D-79); una
  // estabilizacion pide en cambio la version que fallo (D-101).
  $('nsTipo').addEventListener('change', ajustarFormularioPorTipo);
  ajustarFormularioPorTipo();

  // La lista se llena despues de pintar la ventana, cuando el <datalist> ya
  // existe en el documento. llenarCombo la deja en orden alfabetico.
  llenarCombo('dlNsProyecto', CAT.proyectos.map(function (p) {
    return { id: p.ID_Proyecto, texto: p.Nombre_Proyecto };
  }));
  $('nsProyecto').addEventListener('input', function () {
    // Quita el aviso de "no coincide" apenas la persona corrige.
    this.classList.remove('sin-coincidencia');
  });
});

/* ================= Roadmap ================= */
function cargarRoadmap() {
  $('btnNuevaVersion').hidden = !CTX.puedeGestionarVersiones;
  if (DATOS.roadmap) { pintarRoadmap(); return; }
  cargando('roadmap', 'lista');
  api('getRoadmapVersiones').then(function (r) {
    DATOS.roadmap = r;
    $('fRmPlataforma').innerHTML = '<option value="">Todas las plataformas</option>' +
        r.plataformas.map(function (p) {
          return '<option value="' + esc(p.id) + '">' + esc(p.nombre) + '</option>';
        }).join('');
    pintarRoadmap();
  }).catch(fallo);
}
$('fRmPlataforma').addEventListener('change', pintarRoadmap);
$('fRmEstado').addEventListener('change', pintarRoadmap);

function pintarRoadmap() {
  var r = DATOS.roadmap;
  var fp = $('fRmPlataforma').value;
  var fe = $('fRmEstado').value;

  var todas = [];
  Object.keys(r.porPlataforma).forEach(function (k) {
    todas = todas.concat(r.porPlataforma[k]);
  });
  var planeadas = todas.filter(function (v) { return v.estadoRelease === 'Planeada'; }).length;

  $('kpisRoadmap').innerHTML = [
    kpi('Entregas en la fecha planeada', r.cumplimiento.onTimePct, ' %',
        r.cumplimiento.versionesEvaluadas + ' versiones ya desplegadas',
        r.cumplimiento.onTimePct >= 70 ? 'bien' : 'mal'),
    kpi('Desvío promedio', r.cumplimiento.desvioPromedioDias, ' d', 'Días respecto a lo planeado'),
    kpi('Versiones planeadas', planeadas, '', 'Aún sin desplegar'),
    kpi('Versiones en producción', todas.length - planeadas, '', 'Histórico del roadmap')
  ].join('');

  pintarIndicadoresRoadmap(r.indicadores);

  var html = Object.keys(r.porPlataforma).filter(function (k) {
    return !fp || k === fp;
  }).map(function (idPlat) {
    var versiones = r.porPlataforma[idPlat].filter(function (v) {
      return !fe || v.estadoRelease === fe;
    });
    if (!versiones.length) return '';
    return '<div class="rm-plataforma">' +
      '<div class="rm-cab">' + esc(nombrePlataforma(idPlat)) +
        '<span class="cuenta">' + versiones.length + ' versiones</span></div>' +
      '<div class="rm-fila encab"><span>Versión</span><span>Plataforma</span><span>Actividades</span>' +
        '<span>Fecha planeada</span><span>Fecha real</span><span>Desvío</span><span>Estado</span></div>' +
      versiones.map(function (v) {
        var d = v.desvioDias;
        var n = v.actividades.length;
        return '<div class="rm-version">' +
          '<div class="rm-fila' + (n ? ' desplegable' : '') + '"' +
            (n ? ' data-version="' + esc(v.idVersion) + '" role="button" tabindex="0"' +
                 ' aria-expanded="false"' : '') + '>' +
          '<span class="rm-ver num">' + esc(v.numeroVersion) + '</span>' +
          '<span>' + esc(v.plataforma) + '</span>' +
          '<span class="rm-cuenta' + (n ? '' : ' vacia') + '">' +
            '<span class="rm-total num">' + n +
            (n ? '<span class="rm-flecha">&#9656;</span>' : '') + '</span>' +
            chipsDeTipo(v.porTipo) + '</span>' +
          '<span class="num">' + (v.fechaPlaneada ? esc(fecha(v.fechaPlaneada)) : '<span style="color:var(--ink-faint)">sin fecha</span>') + '</span>' +
          '<span class="num">' + (v.fechaReal ? esc(fecha(v.fechaReal)) : '<span style="color:var(--ink-faint)">pendiente</span>') + '</span>' +
          '<span class="rm-desvio ' + (d === null ? '' : (d <= 0 ? 'ok' : 'tarde')) + '">' +
            (d === null ? '—' : (d > 0 ? '+' + d + ' d' : d + ' d')) + '</span>' +
          '<span class="rm-estado"><span class="badge ' +
            (v.estadoRelease === 'Planeada' ? 'b-progreso' : 'b-terminada') + '">' +
            esc(v.estadoRelease === 'Planeada' ? 'Planeada' : 'Producción') + '</span>' +
            (CTX.puedeGestionarVersiones
              ? '<button class="lapiz" title="Editar versión" data-editar-version="' +
                esc(v.idVersion) + '">&#9998;</button>'
              : '') + '</span>' +
          '</div>' +
          (n ? '<div class="rm-detalle" id="det-' + esc(v.idVersion) + '" hidden>' +
               detalleVersion(v) + '</div>' : '') +
        '</div>';
      }).join('') + '</div>';
  }).join('');

  $('roadmap').innerHTML = html ||
      '<div class="panel" style="text-align:center;color:var(--ink-faint)">Todavía no hay versiones registradas.</div>';
}

/**
 * Los indicadores del roadmap (D-104).
 *
 * No siguen el filtro de plataforma de la pagina: son la lectura del portafolio
 * completo, y el filtro esta pensado para recorrer el detalle de una plataforma.
 * El panel "Mezcla por plataforma" ya responde la pregunta por separado.
 */
function pintarIndicadoresRoadmap(i) {
  if (!i) return;

  /* --- Mezcla de inversion --- */
  var conDatos = i.mezcla.total > 0;
  $('kpisMezcla').innerHTML = i.mezcla.tipos.map(function (t) {
    // Sin color de semaforo: que una plataforma madura se sostenga con ajustes
    // no es malo, y pintar "Ajuste" en rojo seria opinar donde hay que informar.
    // La proporcion se ve en la barra de abajo, que si lleva los colores.
    return kpi(t.nombre, conDatos ? t.pct : null, ' %',
               t.cuenta + ' de ' + i.mezcla.total + ' actividades en producción');
  }).join('') +
  kpi('Ritmo de entrega', i.ritmo.diasPromedio, ' d',
      'Días promedio entre versiones, todas las plataformas');

  /* --- Mezcla por plataforma --- */
  $('graficoMezclaPlat').innerHTML = i.mezclaPorPlataforma.length
      ? i.mezclaPorPlataforma.map(function (p) {
          return '<div class="mez-fila"><div class="mez-nombre">' + esc(p.plataforma) +
            (p.sinVersiones
              ? '<span class="mez-aviso" title="Esta plataforma entregó a producción pero no ' +
                'tiene ninguna versión registrada en el roadmap">sin versiones</span>'
              : '') +
            '<span class="mez-total num">' + p.total + '</span></div>' +
            '<div class="mez-barra">' + p.tipos.filter(function (t) { return t.cuenta; })
              .map(function (t) {
                return '<span class="mez-parte ' + (CLASE_TIPO[t.tipo] || '') + '" style="width:' +
                  (t.pct || 0) + '%" title="' + esc(t.cuenta + ' ' + t.nombre + ' · ' + t.pct + '%') +
                  '">' + (t.pct >= 14 ? t.pct + '%' : '') + '</span>';
              }).join('') + '</div></div>';
        }).join('') + leyendaTipos()
      : '<p style="color:var(--ink-muted);font-size:13px">Todavía no hay actividades en producción.</p>';

  /* --- Ritmo por plataforma --- */
  $('tablaRitmo').innerHTML = i.ritmo.porPlataforma.length
      ? '<table class="tabla-compacta"><thead><tr><th>Plataforma</th>' +
        '<th class="num">Versiones</th><th class="num">Cada</th>' +
        '<th class="num">Última</th></tr></thead><tbody>' +
        i.ritmo.porPlataforma.map(function (p) {
          return '<tr><td>' + esc(p.plataforma) + '</td>' +
            '<td class="num">' + p.desplegadas + '</td>' +
            '<td class="num">' + (p.diasPromedio === null
              ? '<span style="color:var(--ink-faint)">una sola</span>'
              : p.diasPromedio + ' d') + '</td>' +
            '<td class="num">' + (p.diasDesdeUltimo === null ? '—'
              : 'hace ' + p.diasDesdeUltimo + ' d') + '</td></tr>';
        }).join('') + '</tbody></table>'
      : '<p style="color:var(--ink-muted);font-size:13px">Ninguna versión ha llegado a producción.</p>';

  /* --- Tamano contra incidentes --- */
  var t = i.tamano;
  var cabeza = '<p class="nota" style="margin:0 0 8px">' +
    (t.versiones
      ? t.versiones + ' versiones desplegadas · ' + t.promedio + ' actividades en promedio' +
        (t.maximo ? ' · la mayor llevó ' + t.maximo : '')
      : 'Ninguna versión ha llegado a producción todavía.') + '</p>';

  var comparacion = '';
  if (t.comparacion) {
    var c = t.comparacion;
    var peor = c.grandes.incidentesPromedio > c.pequenas.incidentesPromedio;
    comparacion =
      '<div class="cmp"><div class="cmp-lado"><span class="cmp-rot">Hasta ' + c.corte +
        ' actividades</span><span class="cmp-cifra num">' + c.pequenas.incidentesPromedio +
        '</span><span class="cmp-pie">incidentes por versión · ' + c.pequenas.versiones +
        ' versiones</span></div>' +
      '<div class="cmp-lado' + (peor ? ' mal' : '') + '"><span class="cmp-rot">Más de ' + c.corte +
        '</span><span class="cmp-cifra num">' + c.grandes.incidentesPromedio +
        '</span><span class="cmp-pie">incidentes por versión · ' + c.grandes.versiones +
        ' versiones</span></div></div>' +
      '<p class="nota" style="margin:8px 0 0">' + (peor
        ? 'Las versiones grandes están generando más estabilizaciones. Entregar más seguido y más pequeño reduce el riesgo de cada entrega.'
        : 'El tamaño de la versión no está explicando los incidentes: la causa hay que buscarla en el Pareto de causa raíz.') +
      '</p>';
  } else if (t.versiones) {
    comparacion = '<p class="nota" style="margin:0">Hacen falta más versiones desplegadas para ' +
      'comparar las grandes contra las pequeñas.</p>';
  }

  var detalle = t.detalle.length
      ? '<table class="tabla-compacta" style="margin-top:10px"><thead><tr><th>Versión</th>' +
        '<th class="num">Actividades</th><th class="num">Incidentes</th></tr></thead><tbody>' +
        t.detalle.map(function (d) {
          return '<tr><td>' + esc(d.version) + '</td>' +
            '<td class="num">' + d.actividades + '</td>' +
            '<td class="num"' + (d.incidentes ? ' style="color:var(--rojo);font-weight:700"' : '') +
            '>' + d.incidentes + '</td></tr>';
        }).join('') + '</tbody></table>'
      : '';

  $('tablaTamano').innerHTML = cabeza + comparacion + detalle;

  /* --- Avisos del plan --- */
  var avisos = [];
  if (i.higiene.sinVersion.length) {
    var nSV = i.higiene.sinVersion.length;
    avisos.push('<div class="aviso-plan mal"><b>' + nSV +
      (nSV === 1 ? ' actividad va' : ' actividades van') + ' a salir sin plan.</b> ' +
      (nSV === 1 ? 'Está' : 'Están') + ' en Desarrollo o más adelante y no ' +
      (nSV === 1 ? 'tiene' : 'tienen') + ' versión asignada, así que ' +
      (nSV === 1 ? 'llegará' : 'llegarán') +
      ' a producción sin estar en ninguna versión del roadmap.' +
      '<ul>' + i.higiene.sinVersion.slice(0, 6).map(function (a) {
        return '<li>' + esc(a.id) + ' · ' + esc(a.nombre) + ' <span style="color:var(--ink-faint)">(' +
          esc(nombreFase(a.fase)) + (a.plataforma ? ' · ' + esc(a.plataforma) : '') + ')</span></li>';
      }).join('') + '</ul>' +
      (nSV > 6 ? '<p class="nota" style="margin:4px 0 0">y ' + (nSV - 6) + ' más.</p>' : '') +
      '</div>');
  }
  if ((i.higiene.entreganSinRoadmap || []).length) {
    var nSR = i.higiene.entreganSinRoadmap.length;
    avisos.push('<div class="aviso-plan"><b>' + nSR +
      (nSR === 1 ? ' plataforma entrega' : ' plataformas entregan') +
      ' sin registrar versiones.</b> ' + (nSR === 1 ? 'Tiene' : 'Tienen') +
      ' actividades en producción y ninguna versión en el roadmap, así que lo que ' +
      (nSR === 1 ? 'saca no aparece' : 'sacan no aparece') + ' en el plan de entregas.' +
      '<ul>' + i.higiene.entreganSinRoadmap.map(function (p) {
        return '<li>' + esc(p.plataforma) + ' <span style="color:var(--ink-faint)">(' +
          p.actividades + (p.actividades === 1 ? ' actividad' : ' actividades') +
          ' en producción)</span></li>';
      }).join('') + '</ul></div>');
  }
  if (i.higiene.sinContenido.length) {
    var nSC = i.higiene.sinContenido.length;
    avisos.push('<div class="aviso-plan"><b>' + nSC +
      (nSC === 1 ? ' versión planeada está vacía.' : ' versiones planeadas están vacías.') +
      '</b> No ' + (nSC === 1 ? 'tiene' : 'tienen') + ' ninguna actividad asignada: o el plan ' +
      'todavía no se armó, o el trabajo está asignado a otra versión.' +
      '<ul>' + i.higiene.sinContenido.slice(0, 6).map(function (v) {
        return '<li>' + esc(v.version) +
          (v.fechaPlaneada ? ' <span style="color:var(--ink-faint)">(planeada para ' +
            esc(fecha(v.fechaPlaneada)) + ')</span>' : '') + '</li>';
      }).join('') + '</ul></div>');
  }
  $('avisosPlan').innerHTML = avisos.length ? avisos.join('')
      : '<p style="color:var(--verde);font-size:13px">El plan está sano: todas las versiones ' +
        'planeadas tienen contenido, ninguna actividad avanzada se quedó sin versión y todas ' +
        'las plataformas que entregan tienen su roadmap al día.</p>';
}

/** La leyenda de colores de la mezcla, para no tener que adivinar las franjas. */
function leyendaTipos() {
  return '<div class="leyenda" style="margin-top:8px">' + (CAT.tipos || [])
    .filter(function (t) { return CLASE_TIPO[t.id]; })
    .map(function (t) {
      return '<span><span class="punto ' + CLASE_TIPO[t.id] + '"></span>' + esc(t.nombre) + '</span>';
    }).join('') + '</div>';
}

/**
 * El contador de una version, abierto por tipo de solicitud (D-103).
 *
 * Una version de siete ajustes y una de siete cosas nuevas cuentan igual y no
 * significan lo mismo: una es mantenimiento y la otra es producto. El numero
 * solo no permitia distinguirlas.
 *
 * Se escribe el nombre completo del tipo y no su inicial: "3 N" obliga a
 * recordar que es N, y el ancho que ahorra no vale eso.
 *
 * @param {!Object<string,number>} porTipo Cuentas por ID de tipo.
 * @return {string}
 */
function chipsDeTipo(porTipo) {
  if (!porTipo) return '';
  // En el orden del catalogo, no en el que vengan las cuentas: asi la lectura
  // es la misma en todas las filas.
  var chips = (CAT.tipos || []).filter(function (t) { return porTipo[t.id]; })
      .map(function (t) {
        return '<span class="rm-tipo ' + (CLASE_TIPO[t.id] || '') + '" title="' +
          esc(porTipo[t.id] + ' de tipo ' + t.nombre) + '">' +
          porTipo[t.id] + ' ' + esc(t.nombre) + '</span>';
      });

  // Un tipo que el catalogo ya no tiene igual se muestra: la version vieja que
  // lo usaba existe, y callarlo haria que las chips no sumaran el total.
  var conocidos = {};
  (CAT.tipos || []).forEach(function (t) { conocidos[t.id] = true; });
  Object.keys(porTipo).forEach(function (id) {
    if (!conocidos[id]) chips.push('<span class="rm-tipo">' + porTipo[id] + ' ' + esc(id) + '</span>');
  });

  return chips.length ? '<span class="rm-tipos">' + chips.join('') + '</span>' : '';
}

/**
 * Lo que salio en una version: cada actividad con su codigo, su nombre y en
 * que fase quedo.
 *
 * Es la pregunta que se hace despues de cada despliegue —"que entro en la
 * 2.4?"— y hasta ahora la pagina solo respondia "siete cosas", sin decir
 * cuales.
 */
function detalleVersion(v) {
  var n = v.actividades.length;
  var enProduccion = v.desplegadas === undefined ? null : v.desplegadas;
  var resumen = 'Actividades de la versión ' + v.numeroVersion +
      (enProduccion === null ? ''
        : ' · ' + enProduccion + ' de ' + n +
          (enProduccion === n ? ' ya en producción' : ' en producción'));

  return '<div class="rm-detalle-cab">' + esc(resumen) + '</div>' +
    v.actividades.slice().sort(function (a, b) {
      return String(a.id).localeCompare(String(b.id), 'es');
    }).map(function (a) {
      return '<div class="rm-act">' +
        '<span class="rm-act-id">' + esc(a.id) + '</span>' +
        '<span class="rm-act-nombre">' + esc(a.nombre) + '</span>' +
        '<span><span class="rm-tipo ' + (CLASE_TIPO[a.tipo] || '') + '">' +
          esc(nombreDeCatalogo(CAT.tipos, a.tipo) || 'sin tipo') + '</span></span>' +
        // Una estabilizacion no recorre fases: la columna diria vacio, que se lee
        // como un dato que falta y no como uno que no aplica (D-106).
        '<span class="rm-act-fase">' + (a.fase ? esc(nombreFase(a.fase)) : '—') + '</span>' +
        '<span><span class="badge ' + (CLASE_ESTADO[a.estado] || 'e-por-iniciar') + '">' +
          esc(nombreEstado(a.estado)) + '</span></span>' +
      '</div>';
    }).join('');
}

// Abrir y cerrar el detalle de una version. Se delega en el contenedor porque
// las filas se vuelven a dibujar con cada cambio de filtro.
$('roadmap').addEventListener('click', function (e) {
  var lapiz = e.target.closest('[data-editar-version]');
  if (lapiz) { formularioVersion(lapiz.dataset.editarVersion); return; }
  var fila = e.target.closest('.rm-fila[data-version]');
  if (fila) alternarDetalleVersion(fila);
});

$('btnNuevaVersion').addEventListener('click', function () { formularioVersion(''); });

/**
 * Alta y edicion de una version del roadmap, para los roles que lo gestionan.
 * Vive aqui y no en Administracion porque quien arma el plan de entrega no es
 * necesariamente administrador.
 */
function formularioIniciativa(idProyecto) {
  abrirModal('Editar iniciativa', '', '<p class="nota">Cargando\u2026</p>', null);
  api('getFormularioIniciativa', idProyecto).then(function (f) {
    var campos = construirCampos(f.columnas, f.opciones, f.valores, null);
    abrirModal('Editar iniciativa', esc(f.valores.Nombre_Proyecto || idProyecto),
      '<div class="formulario">' +
        '<p class="nota" style="margin:0">El ID de la iniciativa no cambia: es el que la ' +
        'relaciona con sus solicitudes. Lo dem\u00e1s se puede corregir.</p>' + campos + '</div>',
      function () {
        return api('guardarIniciativa', idProyecto, leerCampos(f.columnas)).then(function () {

$('roadmap').addEventListener('keydown', function (e) {

  if (!fila) return;
  e.preventDefault();
  alternarDetalleVersion(fila);
});

function alternarDetalleVersion(fila) {
  var detalle = $('det-' + fila.dataset.version);
  if (!detalle) return;
  var abierto = !detalle.hidden;

  fila.setAttribute('aria-expanded', String(!abierto));
  fila.classList.toggle('abierta', !abierto);
}
