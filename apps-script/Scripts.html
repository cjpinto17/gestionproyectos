<script>
/**
 * Scripts.html
 * Logica de la interfaz. Todo el dato viene del backend por google.script.run:
 * esta capa solo pinta y valida lo que el usuario escribe antes de enviarlo.
 */

/* ================= Estado de la aplicacion ================= */
var CTX = null;          // usuario en sesion, rol y permisos
var CAT = null;          // catalogos maestros
var DATOS = {};          // cache por pagina
var tablaAdminActual = 'Usuarios';
var arrastrada = null;
var accionModal = null;

var TODAS = '*';
var PAGINAS = ['home', 'iniciativas', 'gestion', 'roadmap', 'reportes', 'admin'];
var CLASE_ESTADO = {
  'EST-01': 'b-iniciar', 'EST-02': 'b-progreso', 'EST-03': 'b-aprobada',
  'EST-04': 'b-bloqueada', 'EST-05': 'b-cancelada', 'EST-06': 'b-terminada'
};
// Codigo de color de los estados de iniciativa, definido por el negocio.
var CLASE_ESTADO_INI = {
  'EIN-01': 'e-por-iniciar',   // gris
  'EIN-02': 'e-en-progreso',   // amarillo
  'EIN-03': 'e-en-pausa',      // rojo
  'EIN-04': 'e-cancelada',     // gris tachado
  'EIN-05': 'e-finalizada'     // verde
};
var FRANJA_ESTADO_INI = {
  'EIN-01': 'f-por-iniciar', 'EIN-02': 'f-en-progreso', 'EIN-03': 'f-en-pausa',
  'EIN-04': 'f-cancelada', 'EIN-05': 'f-finalizada'
};
var PRIORIDAD_CLASE = {
  'PRI-01': 'p-critica', 'PRI-02': 'p-alta', 'PRI-03': 'p-media', 'PRI-04': 'p-baja'
};
// Orden de presentacion: critica, alta, media, baja. Lo que no tenga prioridad
// va al final de la celda.
var PESO_PRIORIDAD = { 'PRI-01': 0, 'PRI-02': 1, 'PRI-03': 2, 'PRI-04': 3 };
var COLOR_FASE = ['#00306E','#0B4FA5','#1B6FD0','#3E92E0','#1BB26C','#1DD982','#50EAA2','#9CF3CB'];

/* ================= Utilidades ================= */
function esc(t) {
  return String(t === null || t === undefined ? '' : t)
      .replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
}
function $(id) { return document.getElementById(id); }

var tToast;
function toast(msg, esError) {
  var el = $('toast');
  el.textContent = msg;
  el.className = 'toast' + (esError ? ' err' : '');
  el.hidden = false;
  clearTimeout(tToast);
  tToast = setTimeout(function () { el.hidden = true; }, esError ? 7000 : 4500);
}

/** Envuelve google.script.run en una promesa, para poder encadenar llamadas. */
function api(metodo) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (err) { reject(err); })[metodo].apply(null, args);
  });
}

function fecha(valor) {
  if (!valor) return '';
  var d = new Date(valor);
  if (isNaN(d.getTime())) return String(valor);
  return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) +
         '/' + d.getFullYear();
}
function fechaHora(valor) {
  if (!valor) return '';
  var d = new Date(valor);
  if (isNaN(d.getTime())) return String(valor);
  return fecha(valor) + ' ' + ('0' + d.getHours()).slice(-2) + ':' +
         ('0' + d.getMinutes()).slice(-2);
}
function etiquetaMes(clave) {
  var m = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  var p = String(clave).split('-');
  return m[Number(p[1]) - 1] + ' ' + p[0].slice(2);
}
function nombreDeCatalogo(lista, id) {
  for (var i = 0; i < (lista || []).length; i++) {
    if (lista[i].id === id) return lista[i].nombre;
  }
  return id || '';
}
function nombreFase(id) { return nombreDeCatalogo(CAT.fases, id); }
function nombreEstado(id) { return nombreDeCatalogo(CAT.estados, id); }
function nombrePlataforma(id) { return nombreDeCatalogo(CAT.plataformas, id); }
function nombreUsuario(id) {
  for (var i = 0; i < CAT.usuarios.length; i++) {
    if (CAT.usuarios[i].ID_Usuario === id) return CAT.usuarios[i].Nombre_Completo;
  }
  return '';
}
function nombreCorto(id) {
  var n = nombreUsuario(id);
  if (!n) return '—';
  var p = n.split(' ');
  return p[0] + ' ' + (p[1] || '').charAt(0) + '.';
}
function ordenDeFase(id) {
  for (var i = 0; i < CAT.fases.length; i++) {
    if (CAT.fases[i].id === id) return CAT.fases[i].orden;
  }
  return -1;
}

/* ================= Componentes de presentacion ================= */
function kpi(rot, cifra, unidad, pie, clase) {
  var valor = (cifra === null || cifra === undefined)
      ? '<small>sin datos</small>'
      : esc(cifra) + (unidad ? '<small>' + esc(unidad) + '</small>' : '');
  return '<div class="kpi' + (clase ? ' ' + clase : '') + '">' +
         '<div class="rot">' + esc(rot) + '</div>' +
         '<div class="cifra num">' + valor + '</div>' +
         (pie ? '<div class="pie">' + esc(pie) + '</div>' : '') + '</div>';
}
function barra(etq, val, max, texto, clase) {
  var w = max ? Math.round(val / max * 100) : 0;
  return '<div class="barra-dato"><span>' + esc(etq) + '</span>' +
         '<span class="pista"><span class="relleno ' + (clase || '') +
         '" style="width:' + w + '%"></span></span>' +
         '<span class="val num">' + esc(texto) + '</span></div>';
}
function columnas(items, max) {
  var dobles = items.some(function (i) { return i.v2 !== undefined; });
  var tope = max || Math.max.apply(null, items.map(function (i) {
    return dobles ? Math.max(i.v1 || 0, i.v2 || 0) : (i.v1 || 0);
  })) || 1;
  return '<div class="columnas">' + items.map(function (i) {
    var h1 = Math.round((i.v1 || 0) / tope * 100);
    var h2 = Math.round((i.v2 || 0) / tope * 100);
    var cuerpo = dobles
        ? '<div class="par"><div class="bloque b2" style="height:' + h2 + '%"></div>' +
          '<div class="bloque" style="height:' + h1 + '%"></div></div>'
        : '<div class="torre"><div class="bloque" style="height:' + h1 + '%"></div></div>';
    return '<div class="colum"><span class="cifra num">' + esc(i.txt) + '</span>' +
           cuerpo + '<span class="etq">' + esc(i.etq) + '</span></div>';
  }).join('') + '</div>';
}
function cargando(contenedor) {
  $(contenedor).innerHTML = '<p style="color:var(--ink-faint);font-size:13px">Cargando&hellip;</p>';
}
function fallo(err) {
  toast(err && err.message ? err.message : String(err), true);
}

/* ================= Modal ================= */
function abrirModal(titulo, subtitulo, cuerpoHtml, alGuardar) {
  $('modalTitulo').textContent = titulo;
  $('modalSub').textContent = subtitulo || '';
  $('modalCuerpo').innerHTML = cuerpoHtml;
  $('modalError').textContent = '';
  accionModal = alGuardar || null;
  $('btnGuardarModal').hidden = !alGuardar;
  $('velo').hidden = false;
}
function cerrarModal() { $('velo').hidden = true; accionModal = null; }
$('btnCerrarModal').addEventListener('click', cerrarModal);
$('velo').addEventListener('click', function (e) { if (e.target === this) cerrarModal(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') cerrarModal(); });
$('btnGuardarModal').addEventListener('click', function () {
  if (!accionModal) return;
  var boton = this;
  boton.disabled = true;
  boton.textContent = 'Guardando…';
  Promise.resolve(accionModal())
      .then(function () { cerrarModal(); })
      .catch(function (err) { $('modalError').textContent = err.message || String(err); })
      .then(function () { boton.disabled = false; boton.textContent = 'Guardar'; });
});

/* ================= Router ================= */
function navegar(pagina) {
  PAGINAS.forEach(function (p) { $('pg-' + p).hidden = (p !== pagina); });
  document.querySelectorAll('.tab').forEach(function (t) {
    if (t.dataset.pagina === pagina) t.setAttribute('aria-current', 'page');
    else t.removeAttribute('aria-current');
  });
  var cargadores = {
    home: cargarHome, iniciativas: cargarIniciativas, gestion: cargarGestion,
    roadmap: cargarRoadmap, reportes: cargarReportes, admin: cargarAdmin
  };
  if (cargadores[pagina]) cargadores[pagina]();
}
$('tabs').addEventListener('click', function (e) {
  var b = e.target.closest('.tab');
  if (b) navegar(b.dataset.pagina);
});

/* ================= Home ================= */
function cargarHome() {
  var meses = Number($('ventanaMeses').value);
  // Si ya se pidieron estos meses en esta sesion, se pinta de inmediato.
  if (DATOS.home && DATOS.home[meses]) { pintarHome(DATOS.home[meses]); return; }
  cargando('kpisPortafolio');
  api('getMetricasHome', meses).then(function (m) {
    DATOS.home = DATOS.home || {};
    DATOS.home[meses] = m;
    pintarHome(m);
  }).catch(fallo);
}
$('ventanaMeses').addEventListener('change', cargarHome);

function pintarHome(m) {
  $('kpisPortafolio').innerHTML = [
    kpi('Iniciativas en progreso', m.portafolio.iniciativasEnProgreso,
        ' de ' + m.portafolio.iniciativasTotales, 'Portafolio de negocio'),
    kpi('Actividades totales', m.portafolio.solicitudesTotales, '', 'Registradas históricamente'),
    kpi('En vuelo', m.portafolio.solicitudesEnVuelo, '', 'Fases 1 a 7'),
    kpi('En producción', m.portafolio.enProduccion, '', 'Cerradas con éxito'),
    kpi('Bloqueos activos', m.bloqueos.activos, '',
        (m.bloqueos.porcentajeSobreEnVuelo || 0) + '% de lo que está en vuelo',
        m.bloqueos.activos ? 'grave' : '')
  ].join('');

  $('kpisVelocidad').innerHTML = [
    kpi('Lead Time promedio', m.velocidad.leadTimeDias, ' d',
        'Registro → producción (' + m.velocidad.muestraLeadTime + ' entregas)'),
    kpi('Lead Time mediana', m.velocidad.leadTimeMediana, ' d', 'Menos sensible a casos extremos'),
    kpi('Lead Time P85', m.velocidad.leadTimeP85, ' d', 'Compromiso realista de entrega'),
    kpi('Throughput', m.velocidad.throughputPromedioMes, ' /mes', 'Promedio de la ventana'),
    kpi('Construcción neta', m.velocidad.tiempoConstruccionDias, ' d', 'Inicio a fin de desarrollo')
  ].join('');

  $('graficoThroughput').innerHTML = columnas(m.velocidad.throughputMensual.map(function (t) {
    return { etq: etiquetaMes(t.mes), v1: t.entregadas, txt: t.entregadas };
  }));

  var maxCycle = Math.max.apply(null, m.velocidad.cycleTimePorFase.map(function (c) {
    return Math.max(c.diasHabilesPromedio || 0, c.slaDias || 0);
  })) || 1;
  $('graficoCycle').innerHTML = m.velocidad.cycleTimePorFase.map(function (c) {
    if (c.diasHabilesPromedio === null) return barra(c.fase, 0, maxCycle, 'sin datos', '');
    return barra(c.fase, c.diasHabilesPromedio, maxCycle,
                 c.diasHabilesPromedio + ' d / ' + c.slaDias, c.cumple ? 'verde' : 'ambar');
  }).join('');

  $('kpisCalidad').innerHTML = [
    kpi('First Pass Yield', m.calidad.firstPassYieldPct, ' %',
        'Entregas que nunca repitieron fase',
        m.calidad.firstPassYieldPct >= 80 ? 'bien' : 'mal'),
    kpi('Tasa de reproceso', m.calidad.tasaReprocesoPct, ' %',
        m.calidad.retrocesos + ' retrocesos de ' + m.calidad.transiciones + ' transiciones',
        m.calidad.tasaReprocesoPct <= 10 ? 'bien' : 'mal'),
    kpi('Devoluciones de QA', m.calidad.devolucionesQA, '', 'Hallazgos que regresaron a desarrollo'),
    kpi('Devoluciones de UAT', m.calidad.devolucionesUAT, '', 'Rechazos del negocio')
  ].join('');

  var sla = m.predictibilidad.cumplimientoSlaPorFase.filter(function (s) {
    return s.cumplimientoPct !== null;
  });
  var slaGlobal = sla.length
      ? Math.round(sla.reduce(function (a, s) { return a + s.cumplimientoPct; }, 0) / sla.length * 10) / 10
      : null;

  $('kpisPredictibilidad').innerHTML = [
    kpi('Cumplimiento de SLA', slaGlobal, ' %', 'Promedio de las fases, en días hábiles',
        slaGlobal >= 85 ? 'bien' : 'mal'),
    kpi('Entregas en fecha', m.predictibilidad.cumplimientoFecha.onTimePct, ' %',
        m.predictibilidad.cumplimientoFecha.versionesEvaluadas + ' versiones evaluadas',
        m.predictibilidad.cumplimientoFecha.onTimePct >= 70 ? 'bien' : 'mal'),
    kpi('Desvío promedio', m.predictibilidad.cumplimientoFecha.desvioPromedioDias, ' d',
        'Respecto a la fecha planeada'),
    kpi('Eficiencia de flujo', m.predictibilidad.eficienciaFlujoPct, ' %',
        'Lead Time sin el tiempo bloqueado')
  ].join('');

  $('graficoSla').innerHTML = m.predictibilidad.cumplimientoSlaPorFase.map(function (s) {
    if (s.cumplimientoPct === null) return barra(s.fase, 0, 100, 'sin datos', '');
    return barra(s.fase, s.cumplimientoPct, 100, s.cumplimientoPct + '%',
                 s.cumplimientoPct >= 85 ? 'verde' : (s.cumplimientoPct >= 60 ? 'ambar' : 'rojo'));
  }).join('');

  $('graficoDemanda').innerHTML = columnas(m.carga.demandaVsEntrega.map(function (d) {
    return { etq: etiquetaMes(d.mes), v1: d.entregadas, v2: d.registradas,
             txt: d.registradas + '/' + d.entregadas };
  })) + '<div class="leyenda">' +
       '<span><span class="punto" style="background:var(--esmeralda)"></span>Registradas</span>' +
       '<span><span class="punto" style="background:var(--navy)"></span>Entregadas</span></div>';

  var wip = m.carga.wipPorResponsable;
  var claves = Object.keys(wip).sort(function (a, b) { return wip[b] - wip[a]; });
  var maxWip = claves.length ? wip[claves[0]] : 1;
  $('graficoWip').innerHTML = (claves.length
      ? claves.map(function (k) { return barra(nombreUsuario(k) || k, wip[k], maxWip, wip[k], ''); }).join('')
      : '<p style="color:var(--ink-muted);font-size:13px">Sin actividades en curso.</p>') +
      '<p class="nota">WIP total: <b>' + m.carga.wip + '</b> · backlog: ' + m.carga.backlog +
      (m.carga.tiempoEsperadoEntregaDias
        ? ' · con este throughput, vaciarlo toma ~' + m.carga.tiempoEsperadoEntregaDias + ' días (ley de Little).'
        : '.') + '</p>';

  var plat = m.distribucion.porPlataforma;
  var pk = Object.keys(plat).sort(function (a, b) { return plat[b] - plat[a]; });
  var maxPlat = pk.length ? plat[pk[0]] : 1;
  $('graficoPlataformas').innerHTML = pk.length
      ? pk.map(function (k) { return barra(nombrePlataforma(k), plat[k], maxPlat, plat[k], ''); }).join('')
      : '<p style="color:var(--ink-muted);font-size:13px">Sin actividades registradas.</p>';

  var est = m.envejecimiento.estancadas;
  $('listaEstancadas').innerHTML = est.length
      ? '<div class="lista-simple">' + est.slice(0, 12).map(function (e) {
          return '<div class="it"><div><b>' + esc(e.id) + '</b><br>' +
                 '<span style="color:var(--ink-muted)">' + esc(nombreFase(e.fase)) + ' · ' +
                 esc(nombreCorto(e.responsable)) + '</span></div>' +
                 '<span class="dias">' + e.diasHabilesEnFase + ' d / ' + e.slaDias + '</span></div>';
        }).join('') + '</div>' +
        (est.length > 12 ? '<p class="nota">y ' + (est.length - 12) + ' más.</p>' : '')
      : '<p style="color:var(--ink-muted);font-size:13px">Ninguna actividad supera el SLA de su fase.</p>';
}

/* ================= Iniciativas ================= */
function cargarIniciativas() {
  if (DATOS.matriz) { pintarMatriz(); return; }
  cargando('matriz');
  api('getMatrizIniciativas').then(function (r) {
    DATOS.matriz = r;
    $('filtroEstadoIni').innerHTML = '<option value="">Todos los estados</option>' +
        r.estados.map(function (e) {
          return '<option value="' + e.id + '">' + esc(e.nombre) + '</option>';
        }).join('');
    $('filtroTipoIni').innerHTML = '<option value="">Todos los tipos</option>' +
        r.tipos.map(function (t) {
          return '<option value="' + t.id + '">' + esc(t.nombre) + '</option>';
        }).join('');
    $('filtroPrioridadIni').innerHTML = '<option value="">Todas las prioridades</option>' +
        r.prioridades.map(function (pr) {
          return '<option value="' + pr.id + '">' + esc(pr.nombre) + '</option>';
        }).join('');
    $('filtroPlataformaIni').innerHTML = '<option value="">Todas las plataformas</option>' +
        r.plataformas.map(function (pl) {
          return '<option value="' + pl.id + '">' + esc(pl.nombre) + '</option>';
        }).join('') + '<option value="__SIN__">Sin plataforma asignada</option>';
    pintarMatriz();
  }).catch(fallo);
}
$('buscIni').addEventListener('input', pintarMatriz);
$('filtroEstadoIni').addEventListener('change', pintarMatriz);
$('filtroTipoIni').addEventListener('change', pintarMatriz);
$('filtroPrioridadIni').addEventListener('change', pintarMatriz);
$('filtroPlataformaIni').addEventListener('change', pintarMatriz);

function ordenPorPrioridad(a, b) {
  var pa = PESO_PRIORIDAD[a.prioridad], pb = PESO_PRIORIDAD[b.prioridad];
  if (pa === undefined) pa = 9;
  if (pb === undefined) pb = 9;
  if (pa !== pb) return pa - pb;
  return String(a.nombre).localeCompare(String(b.nombre));
}

function pintarMatriz() {
  var r = DATOS.matriz;
  if (!r) return;
  var q = $('buscIni').value.toLowerCase();
  var estado = $('filtroEstadoIni').value;
  var tipo = $('filtroTipoIni').value;
  var prioridad = $('filtroPrioridadIni').value;
  var plataforma = $('filtroPlataformaIni').value;
  var cont = $('matriz');

  // Filas: lineas estrategicas de negocio. Columnas: verticales de producto.
  // Las celdas se indexan siempre como "vertical|LEN", que es como las arma el
  // backend.
  var filas = r.lineas;
  var columnas = r.verticales;

  // Una columna extra a la derecha y una fila extra abajo para los totales.
  cont.style.gridTemplateColumns = '150px repeat(' + columnas.length + ',1fr) 96px';

  function filtrar(lista) {
    return (lista || []).filter(function (i) {
      if (estado && i.estado !== estado) return false;
      if (tipo && i.tipo !== tipo) return false;
      if (prioridad && i.prioridad !== prioridad) return false;
      if (plataforma === '__SIN__') {
        if (i.plataformaId) return false;
      } else if (plataforma && i.plataformaId !== plataforma) {
        return false;
      }
      if (q && String(i.nombre).toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
  }

  // Se resuelve cada celda una sola vez y de ahi salen los totales: asi las
  // sumas siempre corresponden a lo que se esta viendo con los filtros puestos.
  var porCelda = {};
  var totalFila = {}, totalColumna = {}, granTotal = 0;
  filas.forEach(function (f) {
    totalFila[f.id] = 0;
    columnas.forEach(function (c) {
      if (totalColumna[c.id] === undefined) totalColumna[c.id] = 0;
      var items = filtrar(r.celdas[c.id + '|' + f.id]).sort(ordenPorPrioridad);
      porCelda[f.id + '>' + c.id] = items;
      totalFila[f.id] += items.length;
      totalColumna[c.id] += items.length;
      granTotal += items.length;
    });
  });

  function celdaTotal(valor, etiqueta, clase) {
    return '<div class="mz-total' + (clase ? ' ' + clase : '') +
           (valor === 0 ? ' cero' : '') + '">' + valor +
           '<small>' + esc(etiqueta) + '</small></div>';
  }

  var html = '<div class="mz-cab esquina">LEN \\ Vertical</div>';
  columnas.forEach(function (c) { html += '<div class="mz-cab">' + esc(c.nombre) + '</div>'; });
  html += '<div class="mz-cab">Total</div>';

  filas.forEach(function (f) {
    html += '<div class="mz-fila">' + esc(f.nombre) + '</div>';
    columnas.forEach(function (c) {
      var items = porCelda[f.id + '>' + c.id];
      html += '<div class="mz-celda' + (items.length ? '' : ' vacia-celda') + '">' +
              (items.length > 3 ? '<div class="mz-conteo">' + items.length + ' iniciativas · desplace</div>' : '') +
              items.map(tarjetaIniciativa).join('') + '</div>';
    });
    html += celdaTotal(totalFila[f.id], 'en la LEN', '');
  });

  // Fila de cierre: total por vertical y total general.
  html += '<div class="mz-fila">Total</div>';
  columnas.forEach(function (c) {
    html += celdaTotal(totalColumna[c.id], 'en la vertical', '');
  });
  html += celdaTotal(granTotal, 'clasificadas', 'general');

  cont.innerHTML = html;

  var sueltas = [];
  Object.keys(r.celdas).forEach(function (k) {
    var p = k.split('|');
    if (p[0].indexOf('VER-') !== 0 || p[1].indexOf('LEN-') !== 0) {
      sueltas = sueltas.concat(filtrar(r.celdas[k]));
    }
  });
  var caja = $('sinClasificar');
  caja.innerHTML = sueltas.length
      ? '<h3>Sin clasificar · ' + sueltas.length + '</h3>' +
        '<p class="nota" style="margin:0 0 10px">Les falta línea estratégica o vertical en la hoja de iniciativas.</p>' +
        '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px">' +
        sueltas.sort(ordenPorPrioridad).map(tarjetaIniciativa).join('') + '</div>'
      : '';
  caja.hidden = !sueltas.length;
}

function tarjetaIniciativa(i) {
  var nombreEst = nombreDeCatalogo(DATOS.matriz.estados, i.estado) || 'Sin estado';
  var clase = CLASE_ESTADO_INI[i.estado] || 'e-cancelada';
  var franja = FRANJA_ESTADO_INI[i.estado] || '';
  var tipo = nombreDeCatalogo(DATOS.matriz.tipos, i.tipo);

/* ================= Gestion (Kanban) ================= */
function cargarGestion(forzar) {
  // Se traen todas las actividades una sola vez y el filtrado ocurre en el
  // navegador: asi la busqueda predictiva responde sin esperar al servidor.
  if (!forzar && DATOS.kanban) { pintarKanban(); return; }
  cargando('kanban');
  api('getDatosKanban', {}).then(function (r) {
    DATOS.kanban = r;
    prepararFiltrosKanban(r);
    pintarKanban();
  }).catch(fallo);
}

/** Catalogos de los filtros, en el orden pedido y alfabeticamente. */
function prepararFiltrosKanban(r) {
  if (DATOS.filtrosListos) return;

  var proyectoPorId = {};
  r.proyectos.forEach(function (p) { proyectoPorId[p.ID_Proyecto] = p; });
  DATOS.proyectoPorId = proyectoPorId;

  // Solo se ofrecen las LEN y verticales que realmente tienen iniciativas.
  var lenUsadas = {}, verticalesUsadas = {};
  r.proyectos.forEach(function (p) {
    if (p.LEN_ID) lenUsadas[p.LEN_ID] = true;
    if (p.Vertical_ID) verticalesUsadas[p.Vertical_ID] = true;
  });

  llenarCombo('dlLen', CAT.lineasEstrategicas
      .filter(function (l) { return lenUsadas[l.id]; })
      .map(function (l) { return { id: l.id, texto: l.nombre }; }));
  llenarCombo('dlVertical', CAT.verticales
      .filter(function (v) { return verticalesUsadas[v.id]; })
      .map(function (v) { return { id: v.id, texto: v.nombre }; }));
  llenarCombo('dlProyecto', r.proyectos.map(function (p) {
    return { id: p.ID_Proyecto, texto: p.Nombre_Proyecto };
  }));
  llenarCombo('dlPlataforma', r.plataformas.map(function (p) {
    return { id: p.id, texto: p.nombre };
  }));
  llenarCombo('dlResponsable', r.usuarios.map(function (u) {
    return { id: u.ID_Usuario, texto: u.Nombre_Completo };
  }));

  DATOS.filtrosListos = true;
}

/**
 * Llena una lista predictiva y guarda la equivalencia texto -> identificador.
 * Las opciones quedan ordenadas alfabeticamente.
 */
var EQUIVALENCIAS = {};
function llenarCombo(idLista, opciones) {
  var ordenadas = opciones.slice().sort(function (a, b) {
    return String(a.texto).localeCompare(String(b.texto), 'es');
  });
  EQUIVALENCIAS[idLista] = {};
  ordenadas.forEach(function (o) {
    EQUIVALENCIAS[idLista][String(o.texto).toLowerCase()] = o.id;
  });
  $(idLista).innerHTML = ordenadas.map(function (o) {
    return '<option value="' + esc(o.texto) + '"></option>';
  }).join('');
}

/**
 * Lee un combo: devuelve el identificador elegido, '' si esta vacio, o null si
 * lo escrito no corresponde a ninguna opcion.
 */
function valorCombo(idCampo, idLista) {
  var campo = $(idCampo);
  var texto = campo.value.trim().toLowerCase();
  if (!texto) { campo.classList.remove('sin-coincidencia'); return ''; }
  var id = EQUIVALENCIAS[idLista] ? EQUIVALENCIAS[idLista][texto] : undefined;
  campo.classList.toggle('sin-coincidencia', id === undefined);
  return id === undefined ? null : id;
}

/** Aplica todos los filtros sobre las actividades ya cargadas. */
function solicitudesFiltradas() {
  var r = DATOS.kanban;
  var len = valorCombo('fLen', 'dlLen');
  var vertical = valorCombo('fVertical', 'dlVertical');
  var proyecto = valorCombo('fProyecto', 'dlProyecto');
  var plataforma = valorCombo('fPlataforma', 'dlPlataforma');
  var responsable = valorCombo('fResponsable', 'dlResponsable');
  var texto = $('fTexto').value.trim().toLowerCase();

  return r.solicitudes.filter(function (s) {
    var proy = DATOS.proyectoPorId[s.ID_Proyecto] || {};
    if (len && proy.LEN_ID !== len) return false;
    if (vertical && proy.Vertical_ID !== vertical) return false;
    if (proyecto && s.ID_Proyecto !== proyecto) return false;
    if (plataforma && s.Plataforma_ID !== plataforma) return false;
    if (responsable && s.Responsable_ID !== responsable) return false;
    if (texto) {
      var pajar = (s.ID_Solicitud + ' ' + s.Nombre_Solicitud + ' ' + s.Nombre_Iniciativa).toLowerCase();
      if (pajar.indexOf(texto) === -1) return false;
    }
    return true;
  });
}

['fLen', 'fVertical', 'fProyecto', 'fPlataforma', 'fResponsable', 'fTexto'].forEach(function (id) {
  $(id).addEventListener('input', function () { if (DATOS.kanban) pintarKanban(); });
});
$('btnLimpiarFiltros').addEventListener('click', function () {
  ['fLen', 'fVertical', 'fProyecto', 'fPlataforma', 'fResponsable', 'fTexto'].forEach(function (id) {
    $(id).value = '';
    $(id).classList.remove('sin-coincidencia');
  });
  pintarKanban();
});

function pintarKanban() {
  var r = DATOS.kanban;
  var visibles = solicitudesFiltradas();
  $('kanban').innerHTML = r.fases.map(function (f) {
    var enFase = visibles.filter(function (s) { return s.Fase_Actual === f.id; })
        .sort(function (a, b) {
          // Primero lo que el negocio numero dentro de su iniciativa; lo no
          // numerado va despues, ordenado por prioridad.
          var oa = Number(a.Orden_Iniciativa) || 999;
          var ob = Number(b.Orden_Iniciativa) || 999;
          if (oa !== ob) return oa - ob;
          var pa = PESO_PRIORIDAD[a.Prioridad], pb = PESO_PRIORIDAD[b.Prioridad];
          if (pa === undefined) pa = 9;
          if (pb === undefined) pb = 9;
          return pa - pb;
        });
    return '<div class="col" data-fase="' + f.id + '">' +
      '<div class="col-cab"><span class="orden num">' + f.orden + '</span>' +
      '<h3>' + esc(f.nombre) + '</h3>' +
      '<span class="cuenta">' + enFase.length + '</span></div>' +
      (enFase.length
        ? enFase.slice(0, 40).map(tarjetaActividad).join('') +
          (enFase.length > 40 ? '<div class="vacia">y ' + (enFase.length - 40) + ' más</div>' : '')
        : '<div class="vacia">Sin actividades</div>') + '</div>';
  }).join('');

  $('subGestion').textContent = visibles.length + ' de ' + r.solicitudes.length +
      ' actividades · fases editables para su rol: ' +
      (CTX.fasesEditables.length === CAT.fases.length
        ? 'todas'
        : (CTX.fasesEditables.map(nombreFase).join(', ') || 'ninguna'));
}

/* --- Arrastrar y soltar --- */
document.addEventListener('dragstart', function (e) {
  var t = e.target.closest('.tarjeta');
  if (!t) return;
  arrastrada = t.dataset.id;
  t.classList.add('arrastrando');
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', arrastrada); } catch (err) {}
});
document.addEventListener('dragend', function (e) {
  var t = e.target.closest('.tarjeta');
  if (t) t.classList.remove('arrastrando');
  document.querySelectorAll('.col').forEach(function (c) {
    c.classList.remove('destino', 'vetada');
  });
  arrastrada = null;
});
document.addEventListener('dragover', function (e) {
  var col = e.target.closest('.col');
  if (!col || !arrastrada) return;
  e.preventDefault();
  var s = solicitudPorId(arrastrada);
  var v = validarTransicionCliente(s.Fase_Actual, col.dataset.fase);
  document.querySelectorAll('.col').forEach(function (c) {
    c.classList.remove('destino', 'vetada');
  });
  col.classList.add(v.permitido ? 'destino' : 'vetada');
});
document.addEventListener('drop', function (e) {
  var col = e.target.closest('.col');
  if (!col || !arrastrada) return;
  e.preventDefault();
  var id = arrastrada;
  var s = solicitudPorId(id);
  var destino = col.dataset.fase;

  // Validacion optimista en el navegador; el backend vuelve a validarla.
  var v = validarTransicionCliente(s.Fase_Actual, destino);
  if (!v.permitido) { toast(v.motivo, true); return; }

  var faseOrigen = s.Fase_Actual;
  s.Fase_Actual = destino;
  pintarKanban();

  api('cambiarFaseSolicitud', id, destino).then(function (r) {
    toast(id + ' pasó a ' + nombreFase(destino) + '.');
    (r.avisos || []).forEach(function (a) { toast(a, true); });
    invalidarCacheCliente();
    cargarGestion(true);
  }).catch(function (err) {
    s.Fase_Actual = faseOrigen;     // el backend rechazo: se revierte la tarjeta
    pintarKanban();
    fallo(err);
  });
});

function solicitudPorId(id) {
  return DATOS.kanban.solicitudes.filter(function (s) { return s.ID_Solicitud === id; })[0];
}

/** Espejo de validarTransicion() del backend, para dar respuesta inmediata. */
function validarTransicionCliente(origen, destino) {
  if (CTX.esAdmin) return { permitido: true, motivo: '' };
  var a = ordenDeFase(origen), b = ordenDeFase(destino);
  if (a === b) return { permitido: false, motivo: 'La actividad ya está en esa fase.' };
  var puede = function (f) { return CTX.fasesEditables.indexOf(f) !== -1; };
  if (b > a) {
    if (b - a > 1) return { permitido: false, motivo: 'No se permite saltar fases. Solo el Administrador puede hacerlo.' };
    if (!puede(origen)) return { permitido: false, motivo: 'Su rol no tiene permiso sobre la fase de origen.' };
    return { permitido: true, motivo: '' };
  }
  if (!puede(destino)) return { permitido: false, motivo: 'Su rol no tiene permiso sobre la fase de destino.' };
  return { permitido: true, motivo: '' };
}

/* ================= Roadmap ================= */
function cargarRoadmap() {
  if (DATOS.roadmap) { pintarRoadmap(); return; }
  cargando('roadmap');
  api('getRoadmapVersiones').then(function (r) {
    DATOS.roadmap = r;
    $('fRmPlataforma').innerHTML = '<option value="">Todas las plataformas</option>' +
        r.plataformas.map(function (p) {
          return '<option value="' + esc(p.id) + '">' + esc(p.nombre) + '</option>';
        }).join('');
    pintarRoadmap();
  }).catch(fallo);
}
$('fRmPlataforma').addEventListener('change', pintarRoadmap);
$('fRmEstado').addEventListener('change', pintarRoadmap);

function pintarRoadmap() {
  var r = DATOS.roadmap;
  var fp = $('fRmPlataforma').value;
  var fe = $('fRmEstado').value;

  var todas = [];
  Object.keys(r.porPlataforma).forEach(function (k) {
    todas = todas.concat(r.porPlataforma[k]);
  });
  var planeadas = todas.filter(function (v) { return v.estadoRelease === 'Planeada'; }).length;

  $('kpisRoadmap').innerHTML = [
    kpi('Entregas en la fecha planeada', r.cumplimiento.onTimePct, ' %',
        r.cumplimiento.versionesEvaluadas + ' versiones ya desplegadas',
        r.cumplimiento.onTimePct >= 70 ? 'bien' : 'mal'),
    kpi('Desvío promedio', r.cumplimiento.desvioPromedioDias, ' d', 'Días respecto a lo planeado'),
    kpi('Versiones planeadas', planeadas, '', 'Aún sin desplegar'),
    kpi('Versiones en producción', todas.length - planeadas, '', 'Histórico del roadmap')
  ].join('');

  var html = Object.keys(r.porPlataforma).filter(function (k) {
    return !fp || k === fp;
  }).map(function (idPlat) {
    var versiones = r.porPlataforma[idPlat].filter(function (v) {
      return !fe || v.estadoRelease === fe;
    });
    if (!versiones.length) return '';
    return '<div class="rm-plataforma">' +
      '<div class="rm-cab">' + esc(nombrePlataforma(idPlat)) +
        '<span class="cuenta">' + versiones.length + ' versiones</span></div>' +
      '<div class="rm-fila encab"><span>Versión</span><span>Plataforma</span><span>Actividades</span>' +
        '<span>Fecha planeada</span><span>Fecha real</span><span>Desvío</span><span>Estado</span></div>' +
      versiones.map(function (v) {
        var d = v.desvioDias;
        return '<div class="rm-fila">' +
          '<span class="rm-ver num">' + esc(v.numeroVersion) + '</span>' +
          '<span>' + esc(v.plataforma) + '</span>' +
          '<span class="num" style="color:var(--ink-muted)">' + v.actividades.length + '</span>' +
          '<span class="num">' + (v.fechaPlaneada ? esc(fecha(v.fechaPlaneada)) : '<span style="color:var(--ink-faint)">sin fecha</span>') + '</span>' +
          '<span class="num">' + (v.fechaReal ? esc(fecha(v.fechaReal)) : '<span style="color:var(--ink-faint)">pendiente</span>') + '</span>' +
          '<span class="rm-desvio ' + (d === null ? '' : (d <= 0 ? 'ok' : 'tarde')) + '">' +
            (d === null ? '—' : (d > 0 ? '+' + d + ' d' : d + ' d')) + '</span>' +
          '<span><span class="badge ' + (v.estadoRelease === 'Planeada' ? 'b-progreso' : 'b-terminada') + '">' +
            esc(v.estadoRelease === 'Planeada' ? 'Planeada' : 'Producción') + '</span></span>' +
        '</div>';
      }).join('') + '</div>';
  }).join('');

  $('roadmap').innerHTML = html ||
      '<div class="panel" style="text-align:center;color:var(--ink-faint)">Todavía no hay versiones registradas.</div>';
}

/* ================= Reportes ================= */
function cargarReportes() {
  var meses = Number($('ventanaReportes').value);
  if (DATOS.reportes && DATOS.reportes[meses]) { pintarReportes(DATOS.reportes[meses]); return; }
  cargando('graficoIniMes');
  api('getReportes', meses).then(function (r) {
    DATOS.reportes = DATOS.reportes || {};
    DATOS.reportes[meses] = r;
    pintarReportes(r);
  }).catch(fallo);
}
$('ventanaReportes').addEventListener('change', cargarReportes);

function pintarReportes(r) {
  $('graficoIniMes').innerHTML = columnas(r.iniciativasPorMes.map(function (x) {
    return { etq: etiquetaMes(x.mes), v1: x.actividades, v2: x.iniciativas,
             txt: x.iniciativas + '/' + x.actividades };
  })) + '<div class="leyenda">' +
       '<span><span class="punto" style="background:var(--esmeralda)"></span>Iniciativas con movimiento</span>' +
       '<span><span class="punto" style="background:var(--navy)"></span>Actividades trabajadas</span></div>';

  var maxT = Math.max.apply(null, r.fasesPorMes.map(function (f) { return f.total; })) || 1;
  $('graficoFasesMes').innerHTML =
    '<div class="columnas" style="height:210px">' + r.fasesPorMes.map(function (fila) {
      var segmentos = CAT.fases.map(function (f, i) {
        var v = fila.fases[f.id];
        if (!v) return '';
        return '<div class="bloque" title="' + esc(f.nombre) + ': ' + v +
               '" style="height:' + (v / maxT * 100) + '%;background:' + COLOR_FASE[i] + '"></div>';
      }).join('');
      return '<div class="colum"><span class="cifra num">' + fila.total + '</span>' +
             '<div class="torre" style="height:160px">' + segmentos + '</div>' +
             '<span class="etq">' + esc(etiquetaMes(fila.mes)) + '</span></div>';
    }).join('') + '</div>' +
    '<div class="leyenda">' + CAT.fases.map(function (f, i) {
      return '<span><span class="punto" style="background:' + COLOR_FASE[i] + '"></span>' +
             esc(f.nombre) + '</span>';
    }).join('') + '</div>';

  $('tablaMensual').innerHTML =
    '<thead><tr><th>Mes</th><th style="text-align:right">Iniciativas</th>' +
    '<th style="text-align:right">Actividades</th><th>Iniciativas trabajadas</th></tr></thead><tbody>' +
    r.iniciativasPorMes.slice().reverse().map(function (x) {
      return '<tr><td class="num"><strong>' + esc(etiquetaMes(x.mes)) + '</strong></td>' +
        '<td class="num" style="text-align:right">' + x.iniciativas + '</td>' +
        '<td class="num" style="text-align:right">' + x.actividades + '</td>' +
        '<td style="color:var(--ink-muted)">' + (x.detalle.length
          ? x.detalle.slice(0, 4).map(function (d) {
              return esc(d.nombre) + ' (' + d.actividades + ')';
            }).join(' · ') + (x.detalle.length > 4 ? ' · +' + (x.detalle.length - 4) + ' más' : '')
          : 'sin movimiento') + '</td></tr>';
    }).join('') + '</tbody>';

  $('totalAud').textContent = r.totalAuditoria || r.auditoria.length;
  $('tablaAuditoria').innerHTML =
    '<thead><tr><th>ID Auditoría</th><th>Actividad</th><th>Fase origen</th><th>Fase destino</th>' +
    '<th>Estado destino</th><th>Fecha/hora</th><th>Responsable</th>' +
    '<th style="text-align:right">Días hábiles</th></tr></thead><tbody>' +
    r.auditoria.slice(0, 40).map(function (a) {
      var retro = ordenDeFase(a.Fase_Destino) < ordenDeFase(a.Fase_Origen);
      return '<tr><td class="num">' + esc(a.ID_Auditoria) + '</td>' +
        '<td class="num">' + esc(a.ID_Solicitud) + '</td>' +
        '<td>' + esc(nombreFase(a.Fase_Origen)) + '</td>' +
        '<td>' + esc(nombreFase(a.Fase_Destino)) +
          (retro ? ' <span class="badge b-bloqueada">retroceso</span>' : '') + '</td>' +
        '<td>' + esc(nombreEstado(a.Estado_Destino)) + '</td>' +
        '<td class="num">' + esc(fechaHora(a.Fecha_Hora_Cambio)) + '</td>' +
        '<td>' + esc(a.Usuario_Responsable) + '</td>' +
        '<td class="num" style="text-align:right">' + (a.Dias_Habiles_En_Fase || 0) + '</td></tr>';
    }).join('') + '</tbody>';
}

var TABLAS_ADMIN = [
  'Usuarios', 'Proyectos', 'Plataforma_Digital', 'Roles', 'Lineas_Estrategicas',
  'Verticales', 'Tipos_Iniciativa', 'Tipos_Solicitud', 'Estados_Iniciativa',
  'Estados', 'Fases', 'SLA_Fases', 'Causales_Bloqueo', 'Festivos', 'Roadmap_Versiones'
];

function cargarAdmin() {
  if (!$('botoneraTablas').innerHTML) {
    $('botoneraTablas').innerHTML = TABLAS_ADMIN.map(function (t) {
      return '<button class="btn-sec" data-tabla="' + t + '" aria-pressed="' +
             (t === tablaAdminActual) + '">' + esc(t.replace(/_/g, ' ')) + '</button>';
    }).join('');
  }
  cargarTablaAdmin(tablaAdminActual);
}
$('botoneraTablas').addEventListener('click', function (e) {
  var b = e.target.closest('[data-tabla]');
  if (!b) return;
  tablaAdminActual = b.dataset.tabla;

    x.setAttribute('aria-pressed', x.dataset.tabla === tablaAdminActual);

});

function cargarTablaAdmin(tabla) {
  $('tablaAdmin').innerHTML = '';
  $('tituloTabla').textContent = 'Cargando…';
  api('adminCargarTabla', tabla).then(function (r) {
    DATOS.admin = r;
    $('tituloTabla').textContent = r.etiqueta + ' · ' + r.filas.length + ' registros';
    pintarTablaAdmin();
  }).catch(fallo);
}

function pintarTablaAdmin() {
  var r = DATOS.admin;
  var cols = r.columnas;
  $('tablaAdmin').innerHTML =
    '<thead><tr>' + cols.map(function (c) { return '<th>' + esc(c.etiqueta) + '</th>'; }).join('') +
    '<th style="text-align:right">Acciones</th></tr></thead><tbody>' +
    r.filas.map(function (f) {
      return '<tr>' + cols.map(function (c) {
        return '<td>' + esc(textoCelda(c, f[c.campo])) + '</td>';
      }).join('') +
      '<td style="text-align:right;white-space:nowrap">' +
        '<button class="btn-sec" style="padding:3px 8px;font-size:12px" data-editar="' +
          esc(f[r.pk]) + '">Editar</button> ' +
        '<button class="btn-sec" style="padding:3px 8px;font-size:12px" data-eliminar="' +
          esc(f[r.pk]) + '">Eliminar</button></td></tr>';
    }).join('') + '</tbody>';
}

function textoCelda(col, valor) {
  if (valor === '' || valor === null || valor === undefined) return '';
  if (col.tipo === 'date') return fecha(valor);
  if (col.tipo === 'datetime') return fechaHora(valor);
  var opciones = DATOS.admin.opciones[col.campo];
  if (opciones) {
    for (var i = 0; i < opciones.length; i++) {
      if (String(opciones[i].valor) === String(valor)) return opciones[i].texto;
    }
  }
  return valor;
}

$('tablaAdmin').addEventListener('click', function (e) {
  var editar = e.target.closest('[data-editar]');
  if (editar) { formularioRegistro(editar.dataset.editar); return; }
  var eliminar = e.target.closest('[data-eliminar]');
  if (eliminar) confirmarEliminar(eliminar.dataset.eliminar);
});
$('btnNuevoReg').addEventListener('click', function () { formularioRegistro(null); });

/**
 * Arma los campos de un formulario a partir de la definicion de columnas del
 * esquema. Lo usan el CRUD de administracion y la migracion de solicitudes, de
 * modo que ambos respetan los mismos tipos, obligatorios y listas.
 *
 * @param {!Array<!Object>} columnas
 * @param {!Object} opciones Listas desplegables por campo.
 * @param {!Object} registro Valores actuales.
 * @param {string=} campoBloqueado Campo que no se puede editar.
 * @return {string} HTML de los campos.
 */
function construirCampos(columnas, opciones, registro, campoBloqueado) {
  return columnas.map(function (c) {
    var valor = registro[c.campo] === undefined || registro[c.campo] === null ? '' : registro[c.campo];
    var bloqueado = (campoBloqueado && c.campo === campoBloqueado) ? ' disabled' : '';
    var lista = opciones[c.campo];
    var control;

    if (lista) {
      control = '<select id="campo_' + c.campo + '"' + bloqueado + '>' +
        (c.requerido ? '' : '<option value="">(sin asignar)</option>') +
        lista.map(function (o) {
          return '<option value="' + esc(o.valor) + '"' +
                 (String(o.valor) === String(valor) ? ' selected' : '') + '>' +
                 esc(o.texto) + '</option>';
        }).join('') + '</select>';
    } else if (c.opciones) {
      control = '<select id="campo_' + c.campo + '"' + bloqueado + '>' +
        c.opciones.map(function (o) {
          return '<option value="' + esc(o) + '"' + (o === valor ? ' selected' : '') + '>' +
                 esc(o) + '</option>';
        }).join('') + '</select>';
    } else if (c.tipo === 'boolSN') {
      control = '<select id="campo_' + c.campo + '"' + bloqueado + '>' +
        ['SI', 'NO'].map(function (o) {
          return '<option value="' + o + '"' +
                 (String(valor).toUpperCase().indexOf(o) === 0 ? ' selected' : '') + '>' + o + '</option>';
        }).join('') + '</select>';
    } else if (c.tipo === 'longtext') {
      control = '<textarea id="campo_' + c.campo + '" rows="3"' + bloqueado + '>' + esc(valor) + '</textarea>';
    } else if (c.tipo === 'date' || c.tipo === 'datetime') {
      var iso = '';
      if (valor) {
        var d = new Date(valor);
        if (!isNaN(d.getTime())) iso = d.toISOString().slice(0, 10);
      }
      control = '<input type="date" id="campo_' + c.campo + '" value="' + iso + '"' + bloqueado + '>';
    } else {
      var tipoInput = (c.tipo === 'number' || c.tipo === 'decimal') ? 'number'
                    : (c.tipo === 'email' ? 'email' : 'text');
      control = '<input type="' + tipoInput + '" id="campo_' + c.campo + '" value="' +
                esc(valor) + '"' + bloqueado + '>';
    }
    return '<label class="campo"><span>' + esc(c.etiqueta) + (c.requerido ? ' *' : '') +
           '</span>' + control + '</label>';
  }).join('');
}

/** Lee de vuelta los campos construidos por construirCampos(). */
function leerCampos(columnas) {
  var datos = {};
  columnas.forEach(function (c) {
    var el = $('campo_' + c.campo);
    datos[c.campo] = el ? el.value : '';
  });
  return datos;
}

function formularioRegistro(valorPk) {
  var r = DATOS.admin;
  var registro = valorPk
      ? r.filas.filter(function (f) { return String(f[r.pk]) === String(valorPk); })[0]
      : {};

  var campos = construirCampos(r.columnas, r.opciones, registro, valorPk ? r.pk : null);
  if (!valorPk) {
    campos = campos.replace('</label>',
        '<small style="color:var(--ink-faint)">Déjelo vacío y el sistema lo genera</small></label>');
  }

  abrirModal(valorPk ? 'Editar registro' : 'Nuevo registro',
    r.etiqueta, '<div class="formulario">' + campos + '</div>',
    function () {
      var nuevo = leerCampos(r.columnas);
      var metodo = valorPk ? 'adminActualizarRegistro' : 'adminCrearRegistro';
      var args = valorPk ? [metodo, r.tabla, valorPk, nuevo] : [metodo, r.tabla, nuevo];
      return api.apply(null, args).then(function () {
        toast(valorPk ? 'Registro actualizado.' : 'Registro creado.');
        invalidarCacheCliente();
        cargarTablaAdmin(r.tabla);
      });
    });
}

/* --- Migracion de solicitudes (solo Administrador) --- */
$('btnMigrar').addEventListener('click', function () {
  abrirModal('Migrar solicitud', 'Cargando formulario…', '<p class="nota">Un momento…</p>', null);
  api('getFormularioMigracion').then(function (f) {
    var campos = construirCampos(f.columnas, f.opciones, f.valoresPorDefecto, null);

    abrirModal('Migrar solicitud',
      'Se registra con la fase, el estado y las fechas que usted indique',
      '<div class="formulario">' +
        '<p class="nota" style="margin:0">El código es opcional: si lo deja vacío se genera uno. ' +
        'La fecha de registro debe ser la de la fuente original, porque de ella dependen el Lead ' +
        'Time y la antigüedad.</p>' +
        campos +
        '<label class="campo" style="flex-direction:row;align-items:center;gap:8px">' +
          '<input type="checkbox" id="migCarpeta" style="width:auto">' +
          '<span style="text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--ink)">' +
          'Crear carpeta y documento en Drive</span></label>' +
        '<label class="campo" style="flex-direction:row;align-items:center;gap:8px">' +
          '<input type="checkbox" id="migNotificar" style="width:auto">' +
          '<span style="text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--ink)">' +
          'Enviar notificación de Chat y correo</span></label>' +
      '</div>',
      function () {
        var datos = leerCampos(f.columnas);
        if (!String(datos.Nombre_Solicitud || '').trim()) {
          throw new Error('Escriba el nombre de la solicitud.');
        }
        if (!datos.ID_Proyecto) throw new Error('Elija la iniciativa a la que pertenece.');
        return api('migrarSolicitud', datos, {
          crearCarpeta: $('migCarpeta').checked,
          notificar: $('migNotificar').checked
        }).then(function (r) {
          toast('Solicitud ' + r.idSolicitud + ' migrada.');
          (r.avisos || []).forEach(function (a) { toast(a, true); });
          invalidarCacheCliente();
        });
      });
  }).catch(function (err) { cerrarModal(); fallo(err); });
});

function confirmarEliminar(valorPk) {
  var r = DATOS.admin;
  abrirModal('Eliminar registro', r.etiqueta,
    '<p style="font-size:13.5px">Va a eliminar <b>' + esc(valorPk) + '</b> de forma permanente. ' +
    'Esta acción no se puede deshacer.</p>' +
    '<p class="nota">Si el registro está referenciado por otra tabla, el sistema no lo permitirá.</p>',
    function () {
      return api('adminEliminarRegistro', r.tabla, valorPk).then(function () {
        toast('Registro eliminado.');
        cargarTablaAdmin(r.tabla);
      });
    });
}

/** Descarta lo que el navegador tiene guardado de las consultas anteriores. */
function invalidarCacheCliente() {
  DATOS.home = null;
  DATOS.reportes = null;
  DATOS.matriz = null;
  DATOS.roadmap = null;
  DATOS.kanban = null;
  DATOS.filtrosListos = null;
}

/** Boton "Actualizar": relee las hojas, por si alguien las edito por fuera. */
$('btnActualizar').addEventListener('click', function () {
  var boton = this;
  boton.disabled = true;
  boton.textContent = 'Actualizando…';
  api('refrescarDatos').then(function () {
    invalidarCacheCliente();
    var actual = PAGINAS.filter(function (p) { return !$('pg-' + p).hidden; })[0] || 'home';
    navegar(actual);
    toast('Datos actualizados desde las hojas.');
  }).catch(fallo).then(function () {
    boton.disabled = false;
    boton.textContent = 'Actualizar';

});

  $('usuarioRol').textContent = CTX.rolNombre;
  if (!CTX.esAdmin) $('tabAdmin').hidden = true;
  $('contenido').hidden = false;
  navegar(PAGINA_INICIAL || 'home');
}).catch(function (err) {
  $('avisoAccesoMotivo').textContent = (err && err.message) ? err.message : String(err);
  $('avisoAcceso').hidden = false;
});
